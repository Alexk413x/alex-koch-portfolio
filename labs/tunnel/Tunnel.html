<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tunnel Lab</title>
<!-- NOT LINKED FROM THE INDEX YET. This is the analytic tunnel, being built beside the marched Wormhole rather
     than replacing it, and it is not a shipping surface until that decision is made. noindex says the same
     thing to a crawler, the way labs/shell/ does. -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23070707'/%3E%3Ccircle cx='8' cy='8' r='6.2' fill='none' stroke='%23ffb454' stroke-width='.9'/%3E%3Ccircle cx='8' cy='8' r='3.6' fill='none' stroke='%23ffb454' stroke-width='.9' opacity='.7'/%3E%3Ccircle cx='8' cy='8' r='1.4' fill='none' stroke='%23ffb454' stroke-width='.9' opacity='.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Archivo:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../kit/panel.css">
<link rel="stylesheet" href="../kit/loading.css">
<link rel="stylesheet" href="../kit/lab.css">
<style>
  #panel h1{font-size:12px}
</style>
</head>
<body>

<div class="kit-load" role="status" aria-live="polite"></div>

<div id="stage">
  <canvas id="field"></canvas>
  <div id="mast"><div class="t">TUNNEL&nbsp;LAB</div><div class="s" id="modename">solved, not marched</div></div>
  <div id="hud"><b id="fps">-- FPS</b> <span id="scaleinfo"></span> <span id="glstate"></span><br><span class="dim" id="gpu"></span></div>
</div>
<div id="panel">
  <h1>TUNNEL</h1>
  <div class="btns" id="actions"></div>
  <div id="controls"></div>
</div>

<script type="module">
import { createQuad } from '../kit/glquad.js';
import { createPanel, buildActions, mountPanelToggle } from '../kit/panel.js';
import { persist, fitCanvas, runLoop, textOut, reportNoGL, escapeLeaves, mountLoader } from '../kit/lab.js';

import { FRAG, UNIFORMS, MAXL } from './tunnel-shader.js';
import { ALL_SECTIONS, sectionsFor, FMT, LAYER_NAMES } from './tunnel-sidebar.js';
import { defaultPreset } from './tunnel-presets.js';
mountLoader();
escapeLeaves();

const stage = document.getElementById('stage');
/* ONE PROGRAM, NOT A VARIANT PER SETTING. The marched lab compiles a shader per layer set because a marched
 * layer costs whether or not its uniform is zero -- the loop pays for code it does not run, once per step. Here
 * a shell that is off is one `continue` per pixel, so the same trick would buy a compile for nothing. */
const R = createQuad(document.getElementById('field'), {
  frag: FRAG, uniforms: UNIFORMS, onRestore: () => fit(true),
});
if (!R) { reportNoGL(); throw new Error('WebGL unavailable'); }

/* persist() derives its key list from the panel layout, so it is handed ALL_SECTIONS rather than the sections
 * currently on screen -- otherwise dropping SHELLS to 2 would stop saving shells 3 and 4 and lose them on the
 * next reload. The swatches and the masters have no range to be derived from, so they are named. */
// Swatches have no range for persist() to derive, so every one is named. Six per shell now, plus the throat.
const SWATCHES = ['ringCol', 'discA', 'discB'].concat(
  Array.from({ length: MAXL }, (_, i) =>
    ['CloudA', 'CloudB', 'BoltA', 'BoltB', 'StrkA', 'StrkB'].map((n) => 'L' + i + n)).flat());
const MASTERS = ALL_SECTIONS.map(([, , m]) => m).filter(Boolean);
const state = defaultPreset(R.gpu);
const store = persist({ key: 'tunnel', version: 1, state, sections: ALL_SECTIONS,
                        extra: MASTERS.concat(SWATCHES) });
store.restore();

const modeEl = document.getElementById('modename');
function syncMode() {
  const lit = [];
  for (let i = 0; i < MAXL; i++) {
    if (!state['L' + i + 'On']) continue;
    const on = [['Cloud', 'CLOUD'], ['Bolts', 'BOLTS'], ['Streak', 'STREAKS']]
      .filter(([k]) => state['L' + i + k] > 0.001).map(([, n]) => n);
    if (on.length) lit.push(LAYER_NAMES[i] + ' ' + on.join('+'));
  }
  textOut(modeEl, lit.length ? lit.join(' · ') : 'NOTHING LIT');
}

buildActions(document.getElementById('actions'), [
  ['↺ RESET', () => {
    const folds = state.secClosed;
    Object.assign(state, defaultPreset(R.gpu), { secClosed: folds });
    rebuildPanel(); syncMode(); fit(true); store.queueSave();
  }],
]);

const host = document.getElementById('controls');
function rebuildPanel() {
  host.innerHTML = '';
  createPanel({ host, state, sections: sectionsFor(), fmt: FMT, onChange });
}

function onChange(key, kind) {
  if (key === 'renderScale') fit(true);
  if (kind !== 'fold') syncMode();
  store.queueSave();
}
rebuildPanel();

const scaleEl = document.getElementById('scaleinfo');
const fit = fitCanvas({
  stage, R, scale: () => state.renderScale,
  onFit: (w, h) => textOut(scaleEl, w + '×' + h + ' @ ' + Math.round(state.renderScale * 100) + '%'),
});
fit(true);

mountPanelToggle({ panel: document.getElementById('panel'), onToggle: () => fit(true) });

textOut(document.getElementById('gpu'),
        (R.gpu.integrated ? 'INTEGRATED' : 'DISCRETE') + ' · ' +
        String(R.gpu.name || '?').replace(/^ANGLE \(|\)$/g, '').slice(0, 44));

const fpsEl = document.getElementById('fps'), glEl = document.getElementById('glstate');
const hex = (h) => [1, 3, 5].map((i) => parseInt((h || '#ffffff').slice(i, i + 2), 16) / 255);

/* SORTED BY RADIUS ON THE WAY TO THE GPU, and this is load-bearing rather than tidy. The shader composites
 * front-to-back and a ray crosses the small radius first, so the shells must arrive inner-first. Drag one shell's
 * RADIUS past another's and, unsorted, it would composite behind something it is now in front of -- which reads
 * as the near shell being transparent to the far one for no reason a viewer could name. */
function packed() {
  const idx = Array.from({ length: MAXL }, (_, i) => i)
    .sort((a, b) => state['L' + a + 'Rad'] - state['L' + b + 'Rad']);
  const geom = [], mix = [], shade = [], extra = [];
  const cA = [], cB = [], bA = [], bB = [], sA = [], sB = [];
  for (let s = 0; s < MAXL; s++) {
    const i = idx[s];
    const g = (k) => state['L' + i + k];
    geom.push(g('Rad'), g('Amt'), g('Speed'), g('Warp'));
    mix.push(g('Cloud'), g('Bolts'), g('Streak'), g('Ring'));
    shade.push(g('Fill'), g('Edge'), g('Oct'), g('Spin'));
    // extra.y is the shell's ON flag: the shader skips a dark shell before it solves anything for it.
    extra.push(g('Lanes'), g('On') ? 1 : 0, 0, 0);
    cA.push(...hex(g('CloudA')), 0); cB.push(...hex(g('CloudB')), 0);
    bA.push(...hex(g('BoltA')), 0);  bB.push(...hex(g('BoltB')), 0);
    sA.push(...hex(g('StrkA')), 0);  sB.push(...hex(g('StrkB')), 0);
  }
  return { geom, mix, shade, extra, cA, cB, bA, bB, sA, sB };
}

function draw(dt, sec) {
  if (R.lost) { textOut(glEl, 'GL CONTEXT LOST'); return; }
  textOut(glEl, '');
  const s = state;

  R.f2('uRes', R.w, R.h);
  R.f('uTime', sec);
  // FOV is stored as an angle and sent as the ray's z. Small is wide, so a slider on the raw value runs backwards
  // from the number printed beside it; the conversion lives here because a formatter is display only.
  R.f('uFov', 0.5 / Math.tan(s.fov * Math.PI / 360));
  R.f('uFar', s.far); R.f('uWind', s.wind);
  R.f('uBend', s.bend); R.f('uBendFlow', s.bendFlow); R.f('uBendDir', s.bendDir);
  R.f('uRingAmt', s.ringAmt); R.f('uRingN', s.ringN); R.f('uRingFlow', s.ringFlow);
  // The hole's master rides on MASS, SHADOW, RING and DISC together: switching the section off must remove the
  // lensing too, not just stop drawing the disc, or the frame stays warped around nothing.
  const H = s.holeOn ? 1 : 0;
  R.f('uMass', s.mass * H); R.f('uRing', s.ring * H);
  // Never uploaded once, so uRingCol sat at vec3(0) and PHOTON RING multiplied to black at every setting.
  R.f3('uRingCol', ...hex(s.ringCol));

  /* ONE SHARED END RADIUS FOR EVERY SHELL, worked out here because only the host sees all six radii at once.
     It is the HOLE'S shadow when there is one, so the tunnel arrives exactly at it rather than near it, and it
     is capped below the narrowest lit shell so no shell ever has to FLARE outward to reach it.

     WITH THE HOLE OFF IT IS A FRACTION OF THE NARROWEST SHELL, not 0.02. A near-zero end shut the tube to a
     pinhole at DEPTH, and a pinhole whose axis has swung sideways is a needle pointing off screen that almost
     no ray hits -- which emptied the frame and looked exactly like the bend being broken. */
  const litRad = Array.from({ length: MAXL }, (_, i) => i)
    .filter((i) => state['L' + i + 'On']).map((i) => state['L' + i + 'Rad']);
  const narrowest = litRad.length ? Math.min(...litRad) : 1;
  R.f('uEndR', Math.min(H ? s.mass * 0.2 * 2.6 : narrowest * 0.30, narrowest * 0.85));

  R.f('uDisc', s.disc * H); R.f('uDiscTilt', s.discTilt); R.f('uDiscLean', s.discLean); R.f('uDiscThick', s.discThick);
  R.f('uDiscOut', s.discOut);
  R.f('uDiscSpin', s.discSpin); R.f('uDoppler', s.doppler);
  R.f3('uDiscA', ...hex(s.discA)); R.f3('uDiscB', ...hex(s.discB));
  R.f('uFog', s.fog); R.f('uExposure', s.exposure);

  const p = packed();
  R.fv4('uGeom', p.geom); R.fv4('uMix', p.mix); R.fv4('uShade', p.shade); R.fv4('uExtra', p.extra);
  R.fv4('uCloudA', p.cA); R.fv4('uCloudB', p.cB);
  R.fv4('uBoltA', p.bA);  R.fv4('uBoltB', p.bB);
  R.fv4('uStrkA', p.sA);  R.fv4('uStrkB', p.sB);

  R.draw();
}

const loop = runLoop({ draw, onTick: (fps) => textOut(fpsEl, fps + ' FPS') });
syncMode();

window.TUNNEL = { state, R, fit, saveState: store.save, rebuildPanel,
                  renderNow: (sec) => loop.renderNow(1 / 60, sec),
                  get time() { return loop.time; } };
</script>
</body>
</html>
