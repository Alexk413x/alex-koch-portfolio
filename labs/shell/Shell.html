<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lab Shell</title>
<!-- NOT A USER-FACING PAGE. This is the reference wiring for a lab screen and a live catalogue of every control
     the kit offers. It is not linked from the site index; noindex says the same thing to a crawler. -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23090909'/%3E%3Crect x='3' y='3' width='10' height='10' rx='2' fill='none' stroke='%23ffb454' stroke-width='1.3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Archivo:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../kit/panel.css">
<link rel="stylesheet" href="../kit/lab.css">
<!-- A lab's own style block holds only what is true of that lab. Here that is one line. -->
<style>
  #panel h1{font-size:12px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="subject"></canvas>
  <div id="mast">
    <div class="t">LAB&nbsp;SHELL</div>
    <div class="s" id="modename">every control the kit offers</div>
  </div>
  <div id="hud">
    <b id="fps">-- FPS</b> <span id="scaleinfo"></span> <span id="glstate"></span><br>
    <span class="dim" id="gpu"></span>
  </div>
</div>
<div id="panel">
  <h1>LAB SHELL</h1>
  <!-- Both are `btns` strips but they mean different things: a preset is a set of values and lights when the
       state matches; an action is a verb and never lights. Two rows so they cannot be confused. -->
  <div class="btns" id="presets"></div>
  <div class="btns" id="actions"></div>
  <div id="controls"></div>
</div>

<script type="module">
/* LAB SHELL — the reference wiring for a lab, and the file to copy when starting a new one.
 *
 * READ THIS TOP TO BOTTOM AND YOU HAVE THE WHOLE PATTERN. Every lab here is the same seven steps in the same
 * order, and the kit supplies six of them:
 *
 *   1  createQuad   the shader host: compile, uniform cache, resize, context loss   (kit/glquad.js)
 *   2  persist      settings that survive a reload, clamped and debounced           (kit/lab.js)
 *   3  createPanel  the sidebar, built from a table of rows                         (kit/panel.js)
 *   4  buildActions verbs and preset pills                                          (kit/panel.js)
 *   5  fitCanvas    size the buffer to the stage at a render scale                  (kit/lab.js)
 *   6  runLoop      rAF, visibility pause, accumulated clock, dt clamp              (kit/lab.js)
 *   7  draw         THE ONLY PART THAT IS ACTUALLY YOURS
 *
 * The subject is a stroked shape rather than anything interesting, deliberately: a template whose subject is
 * interesting competes with the thing it is teaching.
 */
import { createQuad } from '../kit/glquad.js';
import { createPanel, buildActions, mountPanelToggle } from '../kit/panel.js';
import { persist, fitCanvas, runLoop, textOut, reportNoGL, escapeLeaves } from '../kit/lab.js';

// Escape leaves the instrument, the way the back button does.
escapeLeaves();
import { FRAG, UNIFORMS } from './shell-shader.js';
import { SECTIONS, FMT, SHAPES } from './shell-sidebar.js';
import { PRESETS, defaultPreset, matchIdx } from './shell-presets.js';

// 1 — THE RENDERER. Returns null when WebGL is unavailable; say so on the page rather than showing black.
const stage = document.getElementById('stage');
const R = createQuad(document.getElementById('subject'), {
  // `ext` IS NOT OPTIONAL WHEN THE SHADER USES fwidth: WebGL1 has no derivatives without it, the shader compiles
  // to nothing, and the page simply never starts. See the note at the top of shell-shader.js.
  frag: FRAG, uniforms: UNIFORMS, ext: ['OES_standard_derivatives'], onRestore: () => fit(true),
});
if (!R) { reportNoGL(); throw new Error('WebGL unavailable'); }

// 2 — STATE AND PERSISTENCE. `extra` names the keys persist() cannot find from the layout: a colour row has no
// range, and `debugOn` is a section MASTER rather than a row.
const state = defaultPreset(R.gpu);
const store = persist({ key: 'labshell', version: 1, state, sections: SECTIONS,
                        extra: ['ink', 'debugOn'] });
store.restore();

const modeEl = document.getElementById('modename');
function syncMode() {
  const i = matchIdx(state);
  textOut(modeEl, SHAPES[state.shape] + ' · ' + (i < 0 ? 'CUSTOM' : PRESETS[i].label));
  syncPresets();
}

/* 4a — THE PRESET STRIP. `lit` is a predicate, not a flag: it asks the state rather than remembering the last
 * click, so editing any slider unlights whichever pill no longer matches. buildActions returns sync() because
 * that can happen without anyone touching the strip. */
const syncPresets = buildActions(document.getElementById('presets'),
  PRESETS.map((p, i) => [p.label, () => applyPreset(i), () => matchIdx(state) === i]));

function applyPreset(i) {
  Object.assign(state, PRESETS[i].values);
  rebuildPanel(); syncMode(); store.queueSave();
}

/* 4b — ACTIONS ARE VERBS. RESET restores every value from defaultPreset, which is a different promise from
 * applying the first preset — see shell-presets.js. `secClosed` is carried over so resetting the values does not
 * also unfold the panel. */
buildActions(document.getElementById('actions'), [
  ['↺ RESET', () => {
    const folds = state.secClosed;
    Object.assign(state, defaultPreset(R.gpu), { secClosed: folds });
    rebuildPanel(); syncMode(); fit(true); store.queueSave();
  }],
]);

/* 3 — THE PANEL. Rebuilt only when something outside it writes state, which here is a preset or a reset:
 * panel.js's rows read state once and own their DOM afterwards, so a value changed behind a row's back leaves it
 * stale. Folds live in state and survive the rebuild. */
const host = document.getElementById('controls');
function rebuildPanel() {
  host.innerHTML = '';
  createPanel({ host, state, sections: SECTIONS, fmt: FMT, onChange });
}

function onChange(key, kind) {
  if (key === 'renderScale') fit(true);       // changes the SIZE of the buffer, not a number inside it
  if (kind !== 'fold') syncMode();            // a fold is not a value and cannot change which preset is active
  store.queueSave();
}
rebuildPanel();

// 5 — THE CANVAS FILLS THE STAGE, which is the panel's flex sibling. Never size from innerWidth: hiding the panel
// grows the stage without the window changing at all.
const scaleEl = document.getElementById('scaleinfo');
const fit = fitCanvas({
  stage, R, scale: () => state.renderScale,
  onFit: (w, h) => textOut(scaleEl, w + '×' + h + ' @ ' + Math.round(state.renderScale * 100) + '%'),
});
fit(true);

mountPanelToggle({ panel: document.getElementById('panel'), onToggle: () => fit(true) });

textOut(document.getElementById('gpu'),
        (R.gpu.integrated ? 'INTEGRATED' : 'DISCRETE') + ' · ' +
        String(R.gpu.name || '?').replace(/^ANGLE \(|\)$/g, '').slice(0, 44));

// 7 — THE ONLY PART THAT IS YOURS. Read state, push uniforms, draw. R.f skips the upload when a value has not
// moved, so pushing the whole table every frame costs almost nothing at rest.
const fpsEl = document.getElementById('fps'), glEl = document.getElementById('glstate');
const DEG = Math.PI / 180;

function draw(dt, sec) {
  if (R.lost) { textOut(glEl, 'GL CONTEXT LOST'); return; }
  textOut(glEl, '');
  R.f2('uRes', R.w, R.h);
  R.f('uTime', sec);
  R.f('uShape', state.shape);
  R.f('uSize', state.size); R.f('uAspect', state.aspect);
  R.f('uRot', state.rot * DEG);              // stored in degrees for the readout, radians for the maths
  R.f('uRadius', state.radius); R.f('uWeight', state.weight);
  R.f('uHue', state.hue); R.f('uGlow', state.glow); R.f('uOpacity', state.opacity);
  R.f('uDebug', state.debugOn ? 1 : 0);
  R.f('uOutline', state.outline ? 1 : 0); R.f('uCross', state.cross ? 1 : 0);
  const c = state.ink || '#ffb454';
  R.f3('uInk', parseInt(c.slice(1, 3), 16) / 255, parseInt(c.slice(3, 5), 16) / 255,
               parseInt(c.slice(5, 7), 16) / 255);
  R.draw();
}

// 6 — THE LOOP. Stops when the tab is hidden (Windows Chrome delivers no frames there at all) and advances the
// clock past the pause on the way back, so nothing lurches.
const loop = runLoop({ draw, onTick: (fps) => textOut(fpsEl, fps + ' FPS') });

syncMode();

// The handle every lab publishes, for bench.py and the console. renderNow draws synchronously at a chosen time,
// so it reaches a tab that is not front-most. Read pixels in the same task as the call.
window.SHELL = { state, R, fit, saveState: store.save, rebuildPanel,
                 renderNow: (sec) => loop.renderNow(1 / 60, sec),
                 get time() { return loop.time; } };
</script>
</body>
</html>
