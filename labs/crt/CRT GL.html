  else if (now - lastType > 60000 / (350 * 5 * state.type) && typed < FULL) { typed++; lastType = now; }
  drawContent();   // no-ops unless the typed count or the caret phase moved
  syncLUT();
  syncCal();       // likewise: rebuilds only when a geometry control or the aspect moved

  /* THE REAL FLICKER ENGINE, not a sine.
   *
   * crt-flicker is a factory of pure functions: screenFlicker is a stochastic DIP -- a random depth and duration,
   * then a gap scaled by the rate -- and bulbFlick is a per-bulb flux model with jitter, chaos and a health-driven
   * colour strike. What was here instead was sin(t*11.3)*sin(t*2.7) cubed: periodic, so it read as a wobble rather
   * than a tube guttering, and its control was a depth where the lab's is a RATE in Hz.
   *
   * These are the same functions the DOM lab drives its lamps with, so FLICKER A/B mean here what they mean there.
   * And they arrive as uniforms, which is the point: crt-flicker's own profiling records frames that wrote these
   * values running 100.1ms against 16.7ms for frames that did not, because every write invalidated a group under a
   * reference filter. Here the number changes and nothing is invalidated. */
  /* THE POWER LEVEL RIDES ON THE FLICKER, and that is not a shortcut -- it is the same quantity.
   *
   * uFlicker is what the phosphor is putting out this frame, spent in the shader on everything the tube emits and
   * on nothing it reflects. A tube striking is putting out four times its settled output for a moment; a tube
   * collapsing is putting out nothing by the end. Both are statements about the same number, so the animation's
   * level multiplies into it rather than arriving as a second gate the shader would have to spend in the same
   * place. It is also why the moulding's screen-lit terms flash with the strike without being wired for it: they
   * already read uFlicker.
   *
   * pwr.lvl > 0 is the flicker engine's own gate -- a dead tube does not gutter. */
  /* THE FAULT IS SAMPLED ONCE AND SPENT EVERYWHERE, which is the whole reason it reads as the room rather than as
   * an effect on the screen. One `sg` feeds the tube's output, both lamps' output, both lamps' HEALTH and the
   * colour temperature the palette is built from -- so nothing in the picture can be half a frame out of step
   * with anything else in it. */
  const sg = surgeNow(now);
  /* THE GUTTERING RIDES ON HOW HARD THE FAULT IS BITING, not on a flat rate for the duration. bite is the
   * distance from normal, so the tube chops hardest through the collapse and the cut and goes quiet through the
   * BUILD -- which is the phase crt-flicker's own note says exists to buy the flash its impact. A constant rate
   * across the event would fill that silence in and take the flash with it. */
  const bite  = sg ? sg.bite : 0;
  const fHz   = state.flickHz + (state.surgeHz  - state.flickHz) * bite;
  const fStr  = state.fstr    + (state.surgeStr - state.fstr)    * bite;
  const flk = pwr.lvl * FLK.screenFlicker(now, fHz, fStr, pwr.lvl > 0) * (sg ? sg.screen : 1);
  /* THE LAMPS ARE GATED ON THE FITTING'S SWITCH AND NOTHING ELSE, and the second gate that used to be here was
   * a dead end you could not get out of.
   *
   * It was `state.lightOn && state.flickerOn`. flickerOn has a default of 1 and NO ROW ANYWHERE ON THE PANEL --
   * it is a leftover from when the fixture's flicker had its own master -- so any session that ever stored it as
   * 0 had FLICKER A, FLICK STR A, FLICKER B and FLICK STR B permanently doing nothing, with no control on screen
   * capable of turning them back on. Found exactly that way: measured over 90 frames, both lamps returned 1.000
   * with one distinct value between them while the screen's own flicker moved across 25.
   *
   * A per-lamp rate of 0 Hz is already the off switch, and bulbFlick's own guard is `hz > 0.05 && flux > 0.001`.
   * A tube that is not flickering is a tube whose FLICKER is set to zero -- that is the control, it is visible,
   * and it cannot strand anyone. */
  const lampOn = !!state.lightOn;
  /* THE LAMPS GUTTER FASTER UNDER THE FAULT TOO, and their own FLICKER rate is the floor rather than the answer:
   * a tube whose supply is collapsing does not keep failing at the leisurely rate its ballast manages on a good
   * day. Same bite, so the fixture and the screen chop in step. */
  const lampHz = (hz) => hz + (state.surgeLampHz - hz) * bite;
  const lamp = (id, hz, str, health) =>
    FLK.bulbFlick(now, id, lampHz(hz), str, lampOn, state.lfjit, state.lfchaos, health);
  /* THE BULBS ARE ADVANCED FIRST, because the two things below are read out of the machine they advance.
   *
   * This build was using ONLY bulbFlick's return value -- the brightness multiplier -- and never called
   * bulbState at all. That is the whole reason the fixture read as a lamp being dimmed rather than a lamp that
   * is broken: two thirds of what crt-flicker models per cycle was being computed and thrown away.
   *
   * HEALTH IS THE SLIDER, NOT THE LIVE VALUE, on the way IN. The reference's own note: the colour strike leans
   * warm on a dying tube, and the right signal for that is the tube's CONDITION -- the sag is this cycle's
   * weather, and feeding it back in would compound. */
  const mA = lamp('A', state.lflickA, state.lfstrA, state.healthA);
  const mB = lamp('B', state.lflickB, state.lfstrB, state.healthB);
  const bA = FLK.bulbState('A') || {}, bB = FLK.bulbState('B') || {};

  /* THE COLOUR STRIKE -- the thing that makes a failing tube read as failing rather than as dimming.
   *
   * crt-flicker picks warmTarget on a re-ignition and SNAPS to it ("an eased colour shift reads as a fade, not
   * a strike"), so the tube changes colour between one frame and the next and then holds there. It is signed on
   * purpose: positive drops kelvin for the tired pinkish cast of an old tube, negative RAISES it for the cold
   * blue-green of an arc that has struck before its phosphor caught up. A hard strike reaches 2.5 units, which
   * at 1500K each drives straight into the 2200K floor or the 9000K ceiling -- so it reads as a lamp misfiring
   * rather than as a slightly different white. FLICK CHAOS governs how often that happens.
   *
   * 1500K per unit is the reference's own constant. The surge's share keeps its own control, because that is a
   * mains fault rather than this tube's chemistry, and the two add.
   *
   * QUANTISED TO 20K, the reference's grid, so the palette memo holds still for runs of frames rather than
   * rebuilding the whole phosphor and bezel model every time a strike nudges the average. */
  /* COLOUR STRIKE is the kelvin a strike is worth, and it is a control rather than the reference's fixed 1500.
   *
   * 1500 is right for a lab where the fixture is one of a dozen things being tuned: a strike lands a few hundred
   * kelvin off nominal, which is a real drift and reads as one. It is not enough when the fitting is the thing
   * you are watching -- the machine picks strikes as large as 2.5 units, and at 1500 even those only reach the
   * rails on the hardest of them. At 2600 an ordinary strike is plainly a different colour of light and a hard
   * one drives into the 2200K floor or the 9000K ceiling, which is what "this lamp is broken" looks like. The
   * clamp is what keeps it legible however far this is pushed. */
  const kelvin = (t, warm) => {
    const dK = warm * state.lfwarmK + (sg ? sg.warm * state.surgeWarm : 0);
    return Math.round(Math.min(9000, Math.max(2200, t - dK)) / 20) * 20;
  };
  const tA = kelvin(state.tempA, bA.warm || 0), tB = kelvin(state.tempB, bB.warm || 0);
  /* AND THE HEALTH MOVES WITH IT. hmod is an instant drop to a new condition on about a fifth of cycles, then a
   * recovery halfway back on each cycle after -- so the tube loses a chunk of its coating, limps, and claws some
   * of it back, at intervals nobody can predict. It reaches the shader as uHealthA, which is what tubeSurface
   * draws its zonal pattern from, so the ENDS and the middle change independently instead of the whole tube
   * dimming together. That is the difference between a lamp on a dimmer and a lamp that is going. */
  /* HEALTH DIP deepens the excursion rather than replacing it, so WHEN the tube stumbles is still the machine's
   * decision and only HOW FAR is this panel's. hmod comes back as, say, 0.85; a gain of 2 reads that as a drop
   * to 0.70. At 1 it is the reference's own depth, which is a lamp losing a little coating and getting most of
   * it back -- true, and too subtle to see on a fitting this size. */
  const lim = (v) => Math.max(0, Math.min(1, v));
  const dip = (m) => 1 - (1 - (m == null ? 1 : m)) * state.lfhdip;
  const hA = lim(state.healthA * dip(bA.hmod) * (sg ? sg.health : 1));
  const hB = lim(state.healthB * dip(bB.hmod) * (sg ? sg.health : 1));
  const p = pal(tA, tB);

  R.draw({
    /* FIT: OVERSCAN COMPUTED SO THE PICTURE'S RIM STAYS ON THE GLASS, whatever FACE, DEPTH, CURVE AREA and
     * FALLOFF do to the projection.
     *
     * The rim is pinned, so at the reference's own depth the raster already lands exactly on the glass and there
     * is nothing to correct. Push DEPTH up and the amplitude passes what the fold test bounded: at 6x the rim
     * magnifies 1.319, so the outer third of the picture is driven past the aperture and clipped. Reaching for
     * OVERSCAN by hand every time another control moves is busywork the panel can do itself.
     *
     * The number is the face LUT's own last sample -- the scale factor at s = 1, which is where the raster edge
     * lands -- so it comes from the same table the shader gathers through rather than from a second derivation of
     * the same quantity. Clamped to the slider's own range so FIT can never ask for something OVERSCAN could not
     * have been set to by hand. */
    time: t,
    overscan: state.overscan,
    face: state.face, corner: state.corner, bend: state.bend,
    /* THE PPI RULE IS crt-controls': round(span * density / 100), the picture's HEIGHT for the horizontal pass
     * and its WIDTH for the vertical one -- MEASURED IN CSS PIXELS, which is the whole point of this note.
     *
     * This used to divide the canvas's DEVICE height, so on a 1.74x display 25 PPI produced 423 lines where the
     * reference produces 276 -- its own comment records "276 horizontal and 390 vertical subpaths" at that
     * setting. Same number on the slider, a pattern half again as fine, and because it was finer it sat closer to
     * the pixel grid and got averaged away: the mask measured about a third of the reference's amplitude and
     * looked like it only appeared where there was content to darken.
     *
     * The reference takes its span from picSizePx(), i.e. offsetWidth/offsetHeight -- CSS pixels, independent of
     * both devicePixelRatio and renderScale. A density is a statement about the tube, not about the buffer it is
     * being rasterised into, so neither of those may enter. Computed on the CPU and handed in as a line count;
     * the shader should not be deciding what a density means. */
    /* PITCH IN CSS PIXELS, NOT A DENSITY -- the same geometry, said directly.
     *
     * The old rule was crt-controls': count = round(span * density / 100), which makes pitch = span/count. Work
     * that through and pitch = 100/density exactly -- 25 PPI IS a 4px pitch, and always was, independent of the
     * window. The density was the reciprocal of the thing anyone actually wants to set, and the round() made it
     * not-quite-exact as the stage resized: a 1060px stage gives 265 lines and a 4.000px pitch, a 1063px one
     * gives 266 and 3.997px.
     *
     * WHAT IS KEPT FROM THAT IS THE MISSING round(). crt-controls rounds the count to a whole number, which makes
     * the true pitch span/round(...) rather than 100/density -- a 967px stage gives 242 lines and a 3.996px pitch,
     * a 970px one gives 243 and 3.992px. Dropping the round leaves the density meaning exactly 100/density at
     * every size. The control is the density again because a pitch and a density are the same setting said two
     * ways, and this is the way the reference says it. */
    scanN: Math.max(1, cssPx.h * state.scan / 100),
    /* WIDTH IS IN CSS PIXELS TOO, for the same reason the density is -- and it was the other half of the same bug.
     * The reference strokes with vector-effect="non-scaling-stroke" at stroke-width 1.0, and a non-scaling stroke
     * is measured in CSS pixels, so on a 1.74x display its line is 1.74 device pixels of ink. This handed the raw
     * number to a shader that measures dyPx in RENDER-TARGET pixels, so the same "1.00px" on the panel drew a line
     * 1.74x thinner and carried that much less ink. Modulation per unit brightness measured 0.033 against the
     * reference's 0.096. Converted here, once, so the readout keeps meaning CSS pixels the way the reference's
     * does. */
    scanW: state.scanw * pxScale, scanA: state.scanop / 100,
    grilleN: Math.max(1, cssPx.w * state.grille / 100),
    grilleW: state.grillew * pxScale, grilleA: state.grilleop / 100,
    phos: state.phos, bloom: state.bloom, bloomThresh: state.bloomThresh,
    /* PX -> TAP SPACING, converted here because only this side knows the ratios. The blur buffer is a
     * quarter of the render target (w >> 2), so one of its texels spans 4 render-target pixels, and the
     * thirteen taps carry a sigma of 3 -- one texel of spacing is therefore a 12-render-pixel blur. The
     * control is specified in CSS px like FRAME WIDTH and the scanline width, so pxScale converts it. */
    bloomSpread: state.bloomSize * pxScale / 12,
    /* NOT MULTIPLIED BY THE SWITCH ANY MORE. It was `state.beam * state.power`, which zeroed the content on the
     * frame the button was pressed -- so the collapse had nothing left to play over and the picture simply
     * vanished. What the beam is worth is a setting; whether the tube is emitting is the power level, and that is
     * spent once, on the flicker, where the shader already separates emission from reflection. */
    bright: state.bright, beam: state.beam,
    // THE PICTURE'S SURVIVING EXTENT. 1,1 at rest, and the shader's uniform branch tests for exactly that.
    pwr: [pwr.sx, pwr.sy],
    /* THE MAGNET'S FIELD THIS FRAME. A zero k skips the whole branch, so a tube nobody is holding a magnet
     * against pays nothing -- the same discipline the collapse follows. */
    warpK: wp.k, warpPos: wp.pos, warpR: wp.r, warpD: wp.d,
    vig: state.vig, vigFall: state.vigFall, heat: state.debugOn ? state.heat : 0,
    // GATED ON DEBUG like the guides and the heat map: an inspection view, not a setting.
    fixSolo: state.debugOn ? state.fixSolo : 0,
    /* THE SAG, SIGNED, straight from crt-projection -- the overlay must not re-derive it. */
    sagA: faceProf ? faceProf.sg * faceProf.A : 0,
    sagU0: faceProf ? faceProf.u0 : 0, sagP: faceProf ? faceProf.p : 2,
    // SECONDS -> RATE, here and nowhere else. 0s is parked, which is a period the shader cannot express.
    sweep: state.sweepSec > 0 ? 1 / state.sweepSec : 0,
    /* GATED ON THE PHASE, NOT THE LEVEL. The sweeps are additive emission, so the level already dims them with
     * everything else -- but zero here also SKIPS the tip's whole per-pixel branch, which is worth having on a
     * tube that is off and is not worth losing mid-collapse while the beam is still visibly writing. */
    sweepOn: state.beamOn && pwr.lvl > 0 ? state.sweepOn : 0,
    /* SCANLINES AND COLUMNS -> suv, converted once here. nSL and nCOL are the SAME counts handed to the shader
     * as scanN/grilleN a few lines up, so the beam cannot disagree with the pattern it is drawing: one scanline
     * is 1/nSL of the picture's height by construction, one grille column 1/nCOL of its width. */
    sweepH: state.sweepSL / Math.max(1, cssPx.h * state.scan / 100),
    dotRY:  state.dotH    / Math.max(1, cssPx.h * state.scan / 100),
    dotRX:  state.dotW    / Math.max(1, cssPx.w * state.grille / 100),
    /* PX -> suv, ONCE, HERE. The three tip distances are specified in CSS pixels because that is the only unit
     * a radius or a displacement means anything in; suv runs 0..1 over the picture, so a CSS pixel is
     * 1/cssPx.h of it. Same conversion, same reason, as the scanline width and the frame's own width. */
    hsweep: state.hsweepSec > 0 ? 1 / state.hsweepSec : 0,
    sweepSol: state.sweepSol,
    sweepDip: state.sweepDip, dipFall: state.dipFall, sweepWhite: state.sweepWhite,
    sweepRGB: state.sweepRGB / Math.max(1, cssPx.h),
    dotR:     state.dotR     / Math.max(1, cssPx.h),
    dotLvl:   state.dotNits / 100,                       // nits -> the emission scale uBright is on
    sweepStep: state.sweepStep / Math.max(1, cssPx.h * state.scan / 100),
    dotHalo:   state.dotHaloNits / 100,
    /* COLUMNS -> suv x and SCANLINES -> suv y, the units TIP WIDTH and TIP HEIGHT are in -- so a split of
     * one is one cell of misconvergence on that axis, whichever axis you are reading. */
    tipRGBX:   state.tipRGBc / Math.max(1, cssPx.w * state.grille / 100),
    tipRGBY:   state.tipRGBr / Math.max(1, cssPx.h * state.scan   / 100),
    // COLUMNS -> suv x, the unit the CONVERGENCE section's own error would be in if it were raster-based.
    beamConv:  state.beamConvC / Math.max(1, cssPx.w * state.grille / 100),
    dipNoise:  state.dipNoise, pullInk: state.pullInk,
    /* THE TUBES' SURFACE AND THEIR SUPPLY. The mains phase is wrapped HERE, in doubles, because the
     * shader cannot: a 100Hz cosine of wall-clock seconds is an argument in the millions by the time
     * anyone has left the page open, and float32 freezes it solid. */
    boxVis: state.boxVis, railVis: state.railVis, glowA: state.glowA, glowB: state.glowB, ripple: state.ripple,
    /* PARKED WHEN NOTHING IS MODULATED BY IT. Both readers -- the fitting's own trace and the main pass --
     * spend this as `1.0 - uRipple * 0.5 * (0.5 - 0.5*cos(uMainsPh*TAU))`, so at RIPPLE 0 the phase cannot
     * reach a pixel. Sending it live anyway made it a uniform that CHANGES EVERY FRAME for no visible reason,
     * which is enough on its own to defeat the fixture pass's input key and re-trace the whole fitting sixty
     * times a second at a setting where it is provably identical. A phase nothing modulates is not a phase. */
    mainsPh: state.ripple > 0 ? (t * 100) % 1 : 0,
    beamPull: state.beamPull / Math.max(1, cssPx.h),
    flicker: flk, /* px -> content uv, against the stage rather than the render target: the control is a screen distance,
     * so it must not change meaning when RENDER SCALE does. */
    /* CONVERGENCE, PER GUN, px -> content uv. Against cssPx rather than the render target: these are screen
     * distances, so they must not change meaning when RENDER SCALE moves. The master is a bypass -- off hands
     * over an empty object and the renderer's ||0 puts all three guns on the same raster. */
    conv: !state.convOn ? {} : {
      rx: state.convRX / Math.max(1, cssPx.w), ry: state.convRY / Math.max(1, cssPx.h),
      gx: state.convGX / Math.max(1, cssPx.w), gy: state.convGY / Math.max(1, cssPx.h),
      bx: state.convBX / Math.max(1, cssPx.w), by: state.convBY / Math.max(1, cssPx.h),
    },
    persist: state.persist,
    /* MILLIMETRES -> GLASS HALF-HEIGHTS, here and nowhere else. The shader keeps working in the units it
     * always did; this is the only place that knows a millimetre exists. uAspect is folded in for the two
     * x-extents because the shader compares them against an already aspect-scaled coordinate. */
    ...(function(){
      const U = 1 / MM_PER_UNIT;                            // units per mm -- fixed, see the note in state
      const asp = Math.max(0.01, cssPx.w / Math.max(1, cssPx.h));
      const tubeLenMM = Math.max(50, state.fixWmm - 2 * state.tubeInsetMM);   // DERIVED, not chosen
      return {
        openW:  (state.fixWmm * 0.5) * U / asp,
        openH:  (state.fixHmm * 0.5) * U,
        recess: Math.max(0.002, state.recessMM * U),
        fixW:   (tubeLenMM * 0.5) * U / asp,
        fixH:   (state.tubeDiaMM * 0.5) * U,
        fixGap: (state.tubeGapMM * 0.5) * U,
        /* NO ASPECT DIVISION HERE, and that was a bug. halfLen comes out of uFixW * uAspect, so the aspect
         * cancels and it is a plain length in units -- and fromEnd is measured against it. Dividing the cap by
         * the aspect put it in a different space from the thing it is compared to, so CAP LENGTH moved the cap
         * by 5px across its whole 5-80mm range instead of by about 45. */
        // AS A FRACTION OF THE TUBE'S OWN HALF-LENGTH, so it is dimensionless by the time the shader sees
        // it and cannot disagree with a coordinate about units. Still a real 25mm of moulded part.
        capLen: state.capMM / Math.max(25, tubeLenMM * 0.5),
        /* DIVIDED BY THE DISTANCE, because sp2 is an ANGLE and these are lengths.
         *
         * The ray is normalize(vec3(sp2, -1)) and the fitting sits fixDist away, so a point at sp2 lands at
         * sp2 * fixDist on the fitting's plane -- which makes sp2 a tangent, not a distance. Feeding it a plain
         * length meant POS X moved the fitting by centimetres-times-distance: the same 80cm shifted it twice as
         * far with the fitting twice as far away, when a real fitting 80cm to the left looks LESS displaced the
         * further off it is. One divide puts it in the space it is being compared against. */
        railW:  state.railMM * U,
        fixX:   (state.fixXmm * U) / Math.max(0.05, state.distMM * U),
        fixY:   (state.fixYmm * U) / Math.max(0.05, state.distMM * U),
        // A REAL DISTANCE NOW, in the same units as everything else -- the ray builder places the fitting
        // at it rather than dividing the eye's cone by it. See the note where rd is built.
        fixDist: Math.max(0.05, state.distMM * U),
        frost: state.frost, diffuse: state.diffuse, prism: state.prism, prismN: state.prismN,
      };
    })(),
    /* NOTE THE ABSENCE. fixY / fixW / fixH / fixGap / fixDepth / openW / openH used to be set from state HERE,
     * and because that was after the millimetre block above, they silently overwrote every one of its answers --
     * HOUSING W measured byte-identical at 1200mm and 600mm, and FROST was dead, for the same reason. A later
     * key in an object literal wins, so a conversion is only a conversion if nothing restates its output. */
    /* uFixture IS A GATE NOW, not a level. Each lamp carries its own output in its flux below, and how much
     * of it comes back off the glass is GLARE's job -- so a third multiplier in the middle was one scale too
     * many and made LIGHT and GLARE fight over the same result. */
    fixture: state.lightOn ? 1 : 0, fixTilt: state.fixTilt,
    /* THE LAMPS TAKE THE FAULT'S LEVEL ON TOP OF THEIR OWN FLICKER, multiplied rather than substituted -- the
     * reference's rule, and the reason a dying tube still reads as the sicker of the two right through the event.
     * A surge that REPLACED each bulb's state would make both tubes identical for four seconds and hand the
     * fixture's whole character back at the end, which reads as two lamps being swapped out mid-fault. */
    flkA: mA * state.lightA * (sg ? sg.lamp : 1),
    flkB: mB * state.lightB * (sg ? sg.lamp : 1),
    // The STARVED health, so the arc collapses toward the cathodes instead of the tube just dimming.
    healthA: hA, healthB: hB,
    sheen: state.sheen, matte: state.matte, glare: state.glare,
    // cm -> the fixture's units, by the same SCALE everything else uses.
    sheenR: Math.max(0.005, state.scatterCM * 10 / MM_PER_UNIT),
    glow: state.glow / 100, glowFall: state.glowFall, textRect: textRect, spot: state.spot,
    tubeDead: state.tubeDead,
    frame: state.frame,
    /* PX -> THE SHADER'S UNITS, where 1 is the glass half-height. The stage is cssPx.h CSS pixels tall
     * and maps to c in [-1, 1], so one unit is cssPx.h/2 px. Converted here, once, at the boundary --
     * the panel speaks px and the shader speaks half-heights, and neither has to know about the other. */
    frameW: state.frameW / Math.max(1, cssPx.h / 2),
    frameOn: state.frameOn, bzLocal: state.frameBleed, bzPhos: state.frameScreen, bzLamp: state.frameFixture,
    ink: p.ink, hi: p.hi, halo: p.halo, lamp: p.lamp, lampA: p.lampA, lampB: p.lampB,
    grilleInk: GRILLE_INK, ...bez(tA, tB),
  });

  frames++;
  if (!fpsT) fpsT = now;
  /* 250ms, and the FLICKER RATE RIDES ALONG. The DOM build's note on this is worth keeping: the window is short
   * so a cause and its cost land in the same sample, and the rate is always shown as a number because a label
   * that appears and vanishes with each burst reads as a glitch in the instrument rather than a measurement of
   * it. Zero is a reading; absent is not.
   *
   * The number is vsync-capped: it counts frames DELIVERED, and the compositor will not deliver more than 60.
   * Reading 60 means "not dropping", not "could not go faster". */
  if (now - fpsT >= 250) {
    const hz = Math.max(state.lflickA, state.lflickB, state.flickHz);
    fpsEl.textContent = Math.round(frames * 1000 / (now - fpsT)) + ' FPS \u00b7 FLK ' +
                        (hz < 0.05 ? '0' : hz.toFixed(1)) + 'Hz';
    frames = 0; fpsT = now;
  }
  if (!oneShot) requestAnimationFrame(frame);
}
/* RENDER ONE FRAME ON DEMAND, WITHOUT THE ANIMATION LOOP -- the thing this project has never been able to do.
 *
 * Chrome runs ZERO animation frames in a tab that is not front-most, so every measurement of the rendered image
 * has had to wait for a human to bring the window forward. Nothing about the renderer needs rAF though: the draw
 * is a plain function of the state, and a caller can invoke it directly and read the pixels straight back out.
 *
 * The flag suppresses the re-queue, or a hundred measurements would leave a hundred callbacks parked to fire all
 * at once the moment the tab becomes visible. */
let oneShot = false;
function renderNow(t) { oneShot = true; try { frame(t == null ? performance.now() : t); } finally { oneShot = false; } }
requestAnimationFrame(frame);
/* THE INSTRUMENT HANDLE. `textGrid` and the content canvas are here for the same reason state and the renderer
 * are: this is a measuring tool, and the text layout is the part of it whose answers most need checking against
 * the reference. `drawContent(true)` forces a re-raster, which is what makes the layout measurable in a tab that
 * is not front-most -- Chrome runs no animation frames there, so nothing else would redraw it. */
/* R IS A GETTER, because it is no longer the same object for the life of the page. A lost context is
 * recovered by REBUILDING the renderer, so a handle that captured the original by value would hand every
 * consumer -- render-probe.js reads G.R.gl -- a dead context that silently returns zeros for everything. */
window.CRTGL = { state, get R() { return R; }, resize, textGrid, drawContent, renderNow, content: cc, contentPx, cssPx,
  // A WINDOW ONTO THE TYPEWRITER, so a finished block can be inspected without waiting out the boot -- and so a
  // measurement is not at the mercy of when it happens to be taken. Writing it is what REBOOT does.
  get typed() { return typed; }, set typed(v) { typed = Math.max(0, Math.min(FULL, v | 0)); },
  get full() { return FULL; },
  /* AND ONTO THE POWER SEQUENCE, for the same reason. renderNow() draws one frame at a timestamp of the caller's
   * choosing, so with these the whole collapse can be stepped through and measured in a tab that is not
   * front-most -- which is the only place this project has ever been able to measure anything reliably. powerAt()
   * is the pose the shader is being handed, so a reading can be checked against what was asked for -- and it is
   * the PURE one, so sampling past the end of a run reports where the animation lands without ending it. */
  powerOn, powerOff, togglePower, powerAt: poseFor,
  get powerPhase() { return pwrPhase; }, get powerT0() { return pwrT0; },
  /* THE TWO EVENTS, AND THE POSE EACH IS HANDING THE SHADER. Both samplers are pure, so a whole run can be
   * stepped through and read off without driving it -- which is the only way anything here has ever been
   * measured, since Chrome runs no animation frames in a tab that is not front-most. */
  triggerWarp, warpAt, get warpT0() { return warpT0; },
  triggerSurge, surgeAt: surgeNow, get surgeT0() { return surgeT0; },
  surgeMs: () => FLK.surgeMs() };
</script>
