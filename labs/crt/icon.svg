<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="CRT GL">
  <!-- The home-screen icon, and the same tube the inline favicon draws at 16px. Generous dark margin because
       a maskable icon is cropped to whatever shape the launcher wants: everything that must survive sits
       inside the middle 80%, which is the safe zone that spec defines. -->
  <rect width="512" height="512" fill="#120c06"/>
  <g transform="translate(256 256)">
    <rect x="-150" y="-116" width="300" height="232" rx="52" fill="#1b1109" stroke="#a8734a" stroke-width="14"/>
    <g stroke="#ffb454" stroke-width="18" stroke-linecap="round" opacity="0.95">
      <path d="M-96 -46h192"/>
      <path d="M-96 6h192"/>
      <path d="M-96 58h104"/>
    </g>
  </g>
</svg>
