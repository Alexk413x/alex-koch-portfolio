<!-- Empty, and fixed black over the whole viewport from the first paint, so a cold load never flashes.
     mountLoader() fills it in; see labs/kit/lab.js. -->
<div class="kit-load" role="status" aria-live="polite"></div>

<div id="stage">
  <canvas id="tube"></canvas>
  <!-- THE INSTRUMENT STAYS VECTOR, AND DELIBERATELY NOT IN THE SHADER. It is hairlines and, eventually, labels; it
       changes only when a control moves; and it is the thing the warp is JUDGED BY. Rasterising it into the same
       pass as the picture would make it share the picture's resolution cap -- so a 0.62-scale tube would be
       measured by a 0.62-scale ruler. As an overlay it stays crisp at device resolution and costs nothing per
       frame, because nothing about it is animated. -->
  <svg id="cal" viewBox="0 0 100 100" preserveAspectRatio="none"
       style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible"></svg>
  <div id="mast"><div class="t">CRT Lab</div><div class="s">TERMINAL</div></div>
  <div id="hud"><span id="fps">-- FPS</span> <span id="scaleinfo"></span><br><span id="gpu"></span> <span id="heatread"></span> <span id="glstate"></span></div>
</div>
<div id="panel">
  <h1>CRT Lab</h1>
  <div class="btns" id="actions"></div>
  <div class="phos" id="phosrow"></div>
  <div id="controls"></div>
</div>

<script type="module">
import { faceProfile, faceShaped } from './crt-projection.js';
import { guideOutline, shapeRatio, axisWeight } from './crt-geometry.js';
import { curvedGridPaths } from './crt-grid.js';
import { PH, hexRgb, kelvinRgb } from './crt-phosphor.js';
import { bezelCols } from './crt-bezel.js';
import { bootLines } from './crt-terminal.js';
import { createFlicker } from './crt-flicker.js';
import { createPower } from './crt-power.js';
import { createMagnet } from './crt-magnet.js';
import { createSurge } from './crt-surge.js';
import { createRenderer, buildFaceLUT, buildOutlineLUT, toLinear } from './crt-gl.js';
import { defaultPreset } from './crt-presets.js';
import { makeFmt, SECTIONS } from './crt-sidebar.js';
// The one thing this lab takes from the shared kit: Escape leaves, the way the back button does.
import { escapeLeaves, labReady, mountLoader, persist } from '../kit/lab.js';
import { createPanel, buildActions, mountPanelToggle } from '../kit/panel.js';

let shownOnce = false;
mountLoader();
escapeLeaves();

const canvas = document.getElementById('tube');
// A FACTORY, because it holds machine phase -- two instruments on one page cannot share each other's state.
const FLK = createFlicker();
// NOT const: the renderer is rebuilt from scratch after a lost context. See the handlers beside resize().
let R = createRenderer(canvas);
if (!R) { document.getElementById('hud').textContent = 'needs WebGL2 + EXT_color_buffer_half_float'; throw 0; }

/* THE PALETTE IS NOT INVENTED HERE. PH.amber is crt-phosphor's table -- fg #f0a24a, hi #ffe0c0, halo 255,150,60 --
 * and #4a2c22 is crt-bezel's plastic base. Converted to LINEAR because the shader works in linear light and
 * tone-maps once at the end, which is what lets the bloom bleed instead of haze. */
/* THE PHOSPHOR IS A CHOICE, not a constant. crt-phosphor.PH carries amber, green and white with their own fg,
 * hi and glow, and the shader already takes all three as uniforms -- so this needed wiring, not inventing.
 * bootLines takes it too, which is why the boot text's label/value two-tone follows the palette automatically
 * (including its targeted rule for WHITE, where hi cannot be brighter than fg). */
let phName = 'amber';
let ph = PH[phName];

/* MEMOISED ON THEIR INPUTS. These two run crt-phosphor's kelvin lookup, crt-bezel's whole colour model, several
 * rgb() string parses and toLinear's three Math.pow per channel, then allocate fresh arrays — and nothing they
 * read changes per frame, so from inside the draw that is all of it sixty times a second for the same numbers.
 *
 * The cache key is the control inputs: TEMP, FRAME TINT, FRAME LIGHT, POWER and LIGHT. The flicker multipliers
 * stay per-frame because they genuinely are — they are applied to the result, not baked into it. */
const memo = (key, build) => { const box = { k: null, v: null };
  const f = (...a) => { const kk = key(...a); if (kk !== box.k) { box.k = kk; box.v = build(...a); }
                        return box.v; };
  f.box = box; return f; };

/* THE TEMPERATURES ARE ARGUMENTS NOW, not closure reads, and the mains fault is why.
 *
 * They used to come straight off state, which is correct for a control and wrong for an EVENT: a surge drags the
 * arc cold, so what the lamps are emitting this frame is not what the TEMP sliders say. Taking them as parameters
 * lets the caller hand over the surge-shifted pair while the sliders stay the sliders -- and because they are in
 * the memo key, the cache still holds for as long as the colour genuinely holds still. */
const pal = memo((tA, tB) => phName + '|' + tA + '|' + tB, (tA, tB) => ({
  ink:     toLinear(hexRgb(ph.fg)),
  hi:      toLinear(hexRgb(ph.hi)),
  halo:    toLinear(ph.glow.split(',').map(Number)),
  /* EACH LAMP ITS OWN COLOUR, and their average for the things that see the fitting as ONE source -- the
   * moulding's highlight, the scatter halo. Averaged in LINEAR light, which is the only space where adding two
   * colours together means anything. */
  lampA:   toLinear(kelvinRgb(tA).split(',').map(Number)),
  lampB:   toLinear(kelvinRgb(tB).split(',').map(Number)),
  lamp:    toLinear(kelvinRgb(tA).split(',').map(Number))
             .map((v, i) => (v + toLinear(kelvinRgb(tB).split(',').map(Number))[i]) * 0.5),
}));

/* THE MOULDING'S COLOURS COME FROM crt-bezel, given the same state shape it expects. fcol/ftint/fglow/fwid are
 * that module's own control names, so the numbers on this panel drive the same model the DOM lab's frame does
 * rather than a lookalike. hexRgb parses the rgb() strings it returns -- it already handles that form. */
/* FIXED IN CODE, NOT CONTROLLED -- crt/README.md records the scan pattern's inks as the one thing the
 * plotting does not leave to the component: black for the horizontal pass, warm #2a1608 for the vertical. */
const GRILLE_INK = toLinear(hexRgb('#2a1608'));

/* THE MOULDING TAKES THE FAULT'S TEMPERATURE TOO, for the same reason the palette does: it is plastic lit by the
 * fixture, so when the arc goes cold the surround it is lighting goes with it. Same argument as pal above -- the
 * pair arrives as an argument and stays in the key, so the cache is unaffected while nothing is happening. */
const bez = memo(
  (tA, tB) => state.power + '|' + state.lightOn + '|' + (tA + tB) + '|' +
        state.frameCol + '|' + view.frameW,
  (tA, tB) => {
  /* fcol AND fwid COME FROM THE PANEL. Pinned here, FRAME could change the moulding's tint and its lit edge but not
   * the plastic itself, and the shader drew the moulding at view.frameW while bezelCols was handed a constant —
   * two numbers describing one width, free to disagree.
   *
   * bezelCols uses fwid only as a RATIO: wInner is 0.42w and wOuter is w + 7, so the lit lip's share of the frame
   * moves with its thickness. frameW is a fraction of the aperture radius; scaling by the glass half-height puts
   * it back in the px bezelCols expects. */
  /* crt-bezel models the room's light as a single colour, which is the right abstraction for a moulding
   * lit by the whole fitting -- so it gets the pair's MEAN rather than either lamp's own. */
  const b = bezelCols({ power: state.power ? 'on' : 'off', lightOn: !!state.lightOn,
                        temp: (tA + tB) * 0.5,
                        fcol: state.frameCol, ftint: 0,   // the flat tint is gone -- see crt-gl
                        /* FRAME LIGHT's slider is gone -- SCREEN GLOW and LIGHT FIXTURE now say where
                         * the moulding's light comes FROM, which is what that control was reaching for
                         * without a direction. 50 is bezelCols' own neutral: the 0.28 lift it always
                         * applied, so removing the control changes nothing it was not asked to. */
                        fglow: 50,
                        fwid: Math.max(1, Math.round(view.frameW)),
                        ldim: 1 }, ph);
  return {
    bzBase: toLinear(hexRgb(b.base)), bzLo: toLinear(hexRgb(b.lo)), bzHi: toLinear(hexRgb(b.hi)),
    bzTint: toLinear(hexRgb(b.tint === 'rgba(0,0,0,0)' ? '#000000' : b.tint)),
    bzTintOp: parseFloat(b.tintOp) || 0,
    /* THE LIT LIP IS A FIXED PHYSICAL SIZE, not a fixed share of the frame. bezelCols derives it as 0.42w / (w + 7),
     * which RISES with the width — that says a deeper surround has a proportionally bigger chamfer, and a moulded
     * part does not work that way: the chamfer is a feature of the tooling, a couple of millimetres whatever sits
     * behind it. Left alone, a wide frame comes out mostly lit lip and reads washed out.
     *
     * LIP_PX is chosen so the reference's own frame width lands where bezelCols already had it, so the shipped
     * look is unchanged and only the ends of the range move: narrow frames become all chamfer, which is correct —
     * a 3px surround IS the chamfer — and wide ones gain body. */
    bzInner: Math.min(0.6, Math.max(0.06, 3.5 / Math.max(1, view.frameW))),
  };
});

const state = defaultPreset(R.gpu);

/* THE KEY IS `crtgl` AND IT STAYS THAT WAY, though the lab is now called CRT Lab. It is not a name, it is an
 * address: every visitor who has ever tuned this page has their configuration stored under it, and moving it
 * orphans all of them silently — no error, no fallback, and the shipped defaults are themselves a real saved
 * configuration, so the loss would not even show in a screenshot. Migrate it deliberately or leave it alone.
 *
 * A VERSION MISMATCH DISCARDS rather than migrates. A migration path written before there is anything to migrate
 * is a guess that has to be maintained.
 */
// v2: FRAME WIDTH changed from a fraction of the half-height to CSS px, so v1 blobs would read 0.03px.
// v3: frameInner/frameLamp renamed, frameGlow removed.
// v10: HALATION removed.
// v11: the text is measured in raster cells -- tsize/tlh (px % and a multiplier) became tcell/tgap/tcols
//      (scanlines and grille columns), and tw/tht/tjust/type arrived with them. A v10 blob's tsize would be
//      read as a 2.08-SCANLINE row height, which is legal and wrong, so the whole blob is retired.
const MM_PER_UNIT = 900;   // mm of room across one glass half-height -- see the note in state
const SAVE_KEY = 'crtgl', SAVE_V = 11;   // an address, not a name — see the note above before changing it

/* THE SHARED STORE, not a private one. A restore that type-checks a stored value but never clamps it boots the
 * panel into a state it cannot represent — the thumb pins at one end while the readout shows the old number. The
 * kit derives every clamp from SECTIONS, the same table the panel is built from, so a bound cannot disagree with
 * its slider.
 *
 * `extra` is every key in state, because this lab has far more settings than it has slider rows: the phosphor
 * name, the custom swatch, the frame colour and each section's master are all state and none of them is a row.
 */
const store = persist({ key: SAVE_KEY, version: SAVE_V, state, sections: SECTIONS, extra: Object.keys(state) });
store.restore();
const queueSave = store.queueSave;

/* THE POWER SEQUENCE, THE MAGNET AND THE MAINS FAULT all moved out to their own modules — they are three
 * time-driven effect generators with no DOM in them, which is the shape crt-flicker already had. What stays here
 * is what they touch on this page: the switch that is a saved setting, the typewriter's two deadlines, and the
 * masthead. Each is a factory, because it holds phase and two instruments on one page cannot share a clock. */
const PWR = createPower(!!state.power);
const MAG = createMagnet();
const SRG = createSurge(FLK);

/* TWO DEADLINES, READ IN THE FRAME LOOP RATHER THAN SET AS TIMERS. The typewriter is already a frame-driven
 * counter, so a deadline it compares against is one mechanism instead of two — and a timer that fires in a
 * backgrounded tab, where this page renders nothing, would advance the boot text against a screen nobody is
 * drawing. Both are absolute performance.now() stamps; 0 means no deadline. */
let typeAt = 0, wipeAt = 0;

/* THE PHASE IS NOT state.power. The switch is a setting and is saved; where the animation has got to is neither,
 * and persisting it would restore a page mid-collapse. state.power flips the instant the button is pressed —
 * which is what feeds crt-bezel, so the moulding's tone changes with the switch rather than with the picture. */

// Typing starts half a second after the tube has finished opening, derived from WARM-UP rather than flat.
function powerOn() {
  const now = performance.now();
  state.power = 1;
  PWR.strike(now);
  // Wiped on the way up as well as down, for a switch that comes back before the collapse's own wipe was due.
  typed = 0; wipeAt = 0;
  typeAt = now + state.ignite * 1000 + 500;
  syncMode();
}

/* The text is wiped AFTER the collapse, not with the switch: the text falling in with the rest of the picture is
 * the power-off animation, and clearing it on the click would play the collapse over nothing. */
function powerOff() {
  const now = performance.now();
  state.power = 0;
  PWR.collapse(now);
  typeAt = 0; wipeAt = now + state.collapse * 1000 + 60;
  syncMode();
}

function togglePower() { if (state.power) powerOff(); else powerOn(); }

// What the magnet cannot know for itself. Rebuilt per sample; every term is already read per frame.
const magEnv = () => ({
  face: view.face,
  aspect: cssPx.w / Math.max(1, cssPx.h),
  rgbScale: 1 / rasterScale() / Math.max(1, cssPx.w),
});

const triggerWarp = (now) => MAG.trigger(now);
const warpAt = (now) => MAG.at(now, state, magEnv());
const triggerSurge = (now) => SRG.trigger(now);
const surgeNow = (now) => SRG.at(now, state);
const poseFor = (now) => PWR.at(now, state);
const powerNow = (now) => PWR.advance(now, state);

// The masthead's second line, naming the mode rather than a setting -- the lab's own modeName.
const modeEl = document.querySelector('#mast .s');
function syncMode() { if (modeEl) modeEl.textContent = state.power ? 'TERMINAL' : 'POWERED DOWN'; }
syncMode();   // a session restored with the switch off has to say so before anything is pressed

document.getElementById('gpu').innerHTML =
  (R.gpu.integrated ? 'INTEGRATED' : 'DISCRETE') + ' · ' +
  String(R.gpu.name || '?').replace(/^ANGLE \(|\)$/g, '').slice(0, 44);

/* THE CONTENT LAYER, on a 2D canvas that becomes one texture. In the DOM build this was live SVG text INSIDE the
 * blend stack, so every typed character invalidated thirteen surfaces. Here it re-rasters only when the text
 * changes. Drawn in WHITE -- the phosphor colour is applied in the shader, so one texture serves any phosphor. */
const cc = document.createElement('canvas');
const ctx = cc.getContext('2d');
/* THE BOOT TEXT IS crt-terminal's, not mine. bootLines() builds the masthead, the four self-test rows with their
 * dot leaders sized to the column, and the ENTER prompt -- and it decides which segments are labels (ph.fg) and
 * which are values (ph.hi). The fourteen lines invented here before were a pastiche of that. */
let LINES = [], typed = 0, lastType = 0, FULL = 0, lastCols = 0;

/* THE FONT'S ADVANCE AS A FRACTION OF THE EM, MEASURED -- and deliberately not cached until the webfont is in.
 *
 * A monospace face advances some fixed ratio of its em per character; JetBrains Mono's is 0.6. AUTO char width
 * needs that number to know how many grille columns a cell-tall glyph naturally wants. Measured before the font
 * loads the canvas answers for the fallback instead -- 0.535 here -- and caching that pins every character 3%
 * off the column grid for the rest of the session, so check() gates the cache but not the answer. */
let _adv = 0, _advCx = null;
function advRatio() {
  if (_adv) return _adv;
  try {
    const ready = !document.fonts || document.fonts.check('100px "JetBrains Mono"');
    const cx = (_advCx || (_advCx = document.createElement('canvas').getContext('2d')));
    cx.font = '100px "JetBrains Mono", monospace';
    const w = cx.measureText('MMMMMMMMMM').width / 1000;
    if (w > 0.2 && w < 2) { if (ready) _adv = w; return w; }
  } catch (e) {}
  return 0.6;
}

/* THE CELL GRID, IN CONTENT PIXELS. One place computes it, so the wrap, the glyph placement and the AUTO block
 * size cannot disagree about what a row is.
 *
 * THE POINT OF THIS FUNCTION IS THE UNITS. Row height is in SCANLINES and char width in GRILLE COLUMNS, so the
 * text sits on the same lattice the scan pattern draws and changing the raster density resizes the type with it.
 * Sized as a percentage of the render height instead, the type knows nothing about the surface it is drawn on and
 * SCANLINES H moves the raster while leaving the glyphs where they were.
 *
 * nSL and nCOL are the SAME counts the shader rasters with, and both are computed from cssPx: a density is a
 * statement about the tube, not about the buffer it is rasterised into. */
/* HOW MANY COLUMNS OF TEXT A NARROW DISPLAY IS HELD TO. Above the width where this is satisfied the raster
 * is left exactly as authored; below it the density is scaled up so the count does not collapse. */
const TEXT_COLS_MIN = 40;
/* AND HOW FEW LINES ITS RASTER MAY COLLAPSE TO, which is the same accommodation on the other axis. A glyph is
 * `tcell` SCANLINES tall, so em/pictureHeight is exactly cell/nSL -- the line count IS the type scale, and a
 * count left to float with the viewport is a type size left to float with it.
 *
 * 100 is the shipped raster's own count on a desktop: scan is 10 lines per 100 CSS px and a desktop stage is
 * about 1000 tall, measured at exactly 100. So this is not a new opinion about size, it is the desktop's own
 * proportion held onto when the picture gets short. */
const SCANLINES_MIN = 100;
const RASTER_K_MAX = 6;         // a pathologically narrow viewport must not ask for a thousand scanlines
/* WHAT COUNTS AS A DISPLAY WITH ROOM. Shared with the panel's own breakpoint via mountPanelToggle, so "small
 * screen" means one thing here; panel.css carries the same pair in a media query, which a stylesheet cannot read
 * from here and must be kept in step.
 *
 * THE GATE IS THE CORRECTION. Written as a pure column target with no size test, the rule fires on a DESKTOP
 * whenever the authored raster is coarse enough to make text wide. Overriding a density somebody deliberately set
 * on a screen with plenty of room is not what this is for: it is an accommodation for displays that cannot fit
 * the text, not an opinion about legibility.
 *
 * TWO NUMBERS, NOT ONE, BECAUSE SCREENS ARE NOT SQUARE. A phone on its side is 852x393 — wide enough to pass any
 * width test — so a single min(w, h) test would call an ordinary laptop a phone. 500 sits in the gap, and it is
 * the number the CSS carries too. */
const NARROW_W = 820;
const SHORT_H  = 500;

/* Whether the stage has room for what was authored. One expression, because syncView and rasterScale disagreeing
 * about it is a tube drawn with one set of settings and measured with another. */
function roomy() { return cssPx.w > NARROW_W && cssPx.h > SHORT_H; }

/* WHAT A NARROW DISPLAY RENDERS INSTEAD, as a table rather than as special cases scattered through the frame.
 * The raster scale, the convergence divisor and the spot divisor are narrow-display accommodations too; they are
 * computed rather than tabulated because they are RATIOS of whatever is authored, while these are replacements.
 *
 *   frameOn  the moulding is a fixed CSS-pixel border, so on a phone it eats a far larger share of the picture.
 *            Off, uFrameFit falls to 1 and the glass gets the whole box.
 *   famp     DEPTH. A deep face spends its outer radius compressing the picture into the rim, which a small
 *            screen cannot afford. Not zero — a flat tube is a monitor, and the curve is the subject.
 *   grings   CURVE AREA, which sets the BAND the sag lives in rather than how deep it is: u0 = 1 - grings*0.05,
 *            and the profile is identically zero below u0. At the shipped value there is no flat section at all;
 *            this leaves the middle of the radius flat for the text and confines the bend to the outer band.
 *
 * EVERY KEY LISTED HERE MUST BE READ THROUGH `view`, NEVER THROUGH `state`. face/famp/frameOn/frameW appear in
 * THREE memo keys — the face LUT's, the calibration overlay's and the bezel's — and a key still reading `state`
 * would leave the memo believing nothing had changed while the value driving it had. */
const NARROW_OVERRIDES = { frameOn: 0, famp: 1.4, grings: 14 };

/* THE SETTINGS THE RENDERER READS, as opposed to the ones the PANEL EDITS.
 *
 * state stays the operator's own configuration and is what persistence writes, so a session tuned on a desktop is
 * not quietly overwritten by having been opened once on a phone. view is state on any roomy display, by identity,
 * so the desktop path allocates nothing and compares equal.
 *
 * Rebuilt in place rather than spread fresh each frame: the object carries ~150 keys and this is on the frame path.
 */
const _view = {};
let view = state;
function syncView() {
  if (roomy()) { view = state; return; }
  for (const k in state) _view[k] = state[k];
  Object.assign(_view, NARROW_OVERRIDES);
  view = _view;
}

/* THE SMALL-DISPLAY RASTER SCALE. Without it the glyph is pinned to an ABSOLUTE size: work em through to screen
 * pixels and the viewport cancels out, so a phone is handed the desktop's type on a fifth of the width.
 *
 * The cause is that the PITCH is held constant while the line COUNT floats. A real set is the other way round — a
 * 525-line tube is 525 lines whether it is nine inches or twenty-seven, and the pitch is whatever that works out
 * to. Scaling the density on small displays restores that, rather than special-casing the type away from the
 * raster it is supposed to sit on.
 *
 * k IS INDEPENDENT OF ITSELF, which makes this a closed form rather than a search. A character spans `cpc` grille
 * columns, and cpc = round(advRatio * em / colW) where em and colW both carry 1/k — so cpc is the same at every
 * scale. Columns across the block then vary linearly with k. `cell` and `gap` are in scanlines and carry no k
 * either, so the line-count solve is closed in the same way.
 *
 * BOTH AXES: a column target is satisfied by a wide box whatever its height, so a phone ON ITS SIDE passes it and
 * draws a raster whose type is several times larger relative to the screen than the same phone upright.
 *
 * NEVER BELOW 1. This only makes a cramped display finer; it cannot coarsen a roomy one. */
function rasterScale() {
  const s = state;
  if (roomy()) return 1;                         // room for what was authored: exactly that, always
  const scan = Math.max(0.001, s.scan), grille = Math.max(0.001, s.grille);
  const cpc = s.tcols < 1
    ? Math.max(1, Math.round(advRatio() * s.tcell * grille / scan))
    : s.tcols;
  const blockW = s.tw < 1 ? cssPx.w : cssPx.w * s.tw / 100;
  const kCols  = blockW > 0 ? TEXT_COLS_MIN * cpc * 100 / (blockW * grille) : 1;
  const kLines = SCANLINES_MIN * 100 / (cssPx.h * scan);
  return Math.min(RASTER_K_MAX, Math.max(1, kCols, kLines));
}

/* THE RASTER'S LINE AND COLUMN COUNTS — ONE PLACE, ELEVEN CALLERS. These two expressions were written out inline
 * eleven times: twice in textGrid and nine more in the uniform bag, where the beam's height, the tip's radii, the
 * convergence error and the sweep's step are each measured in scanlines or grille columns.
 *
 * Eleven copies of a density is eleven places for the scale above to be applied to ten of them, which would leave
 * the beam measured in a different raster from the one being drawn.
 */
function rasterN() {
  const k = rasterScale();
  return { k: k,
           sl:  Math.max(1, cssPx.h * state.scan   * k / 100),
           col: Math.max(1, cssPx.w * state.grille * k / 100) };
}

function textGrid() {
  const W = contentPx.w, H = contentPx.h;
  const R = rasterN();
  const nSL = R.sl, nCOL = R.col;
  const cell = Math.min(nSL, state.tcell);
  const gap  = Math.max(0, Math.min(nSL - cell, state.tgap));
  const colW = W / nCOL;
  const em    = cell / nSL * H;             // the glyph's em box: `cell` scanlines tall
  const pitch = (cell + gap) / nSL * H;     // row to row -- a whole number of scanlines, so every row shares a phase
  const cols  = state.tcols < 1 ? Math.max(1, Math.round(advRatio() * em / colW)) : state.tcols;
  return { W: W, H: H, em: em, pitch: pitch, colW: colW, slPx: H / nSL, charW: cols * colW, nSL: nSL, nCOL: nCOL };
}

/* WRAPPED ON WHITESPACE, THEN ON THE CELL GRID AS A LAST RESORT. The block's width is a column count, so how many
 * cells fit is the whole answer. Breaking at the column limit full stop splits words across rows and restarts
 * their tails at the left margin — the tube reads "PA" / "SS".
 *
 * Segments survive the wrap so a row can still change colour mid-way, which the boot text needs: it puts a label
 * and its value in one line and would otherwise flatten to a single colour. Words longer than the whole column
 * count are hard-broken, because the alternative is a row wider than the block.
 *
 * Every token is emitted in full including its trailing space, so the wrapped rows hold exactly the characters the
 * source did, in order — which is what lets the flat `typed` counter walk them without a mapping. */
function wrapLines(lines, cols) {
  const out = [], per = Math.max(1, cols);
  lines.forEach((segs) => {
    let row = [], used = 0;
    // A flush with nothing in it is not a row: two can fire back to back when a token lands exactly on the
    // boundary, and the second pushes a blank line that the AUTO height then pays a whole pitch for.
    const flush = () => { if (!row.length) return; out.push(row); row = []; used = 0; };
    const put = (t, c) => { row.push({ t: t, c: c }); used += t.length; };
    if (!segs.length) { out.push([]); return; }   // a deliberately empty line is content, and keeps its row
    segs.forEach((sg) => {
      const toks = sg.t.match(/\S+\s*|\s+/g) || [];
      toks.forEach((tok) => {
        if (used + tok.replace(/\s+$/, '').length > per && used > 0) flush();
        let t = tok;
        /* THE HARD BREAK, WITH THE TAKE CAPTURED BEFORE IT IS SPENT. `put` adds what it wrote to `used`, so a second
         * `per - used` evaluated after the first has been paid for always comes out zero: the token never shortens,
         * the condition never goes false, and the tab hangs with no error and no frame.
         *
         * It only fires when a token is longer than the whole column budget, so at normal widths nothing reaches
         * it. Dragging TEXT WIDTH far enough down takes the budget under the longest word.
         *
         * Floored at one character so the loop cannot fail to advance even if `used` equals `per` on entry. */
        while (t.length > per) {
          const take = Math.max(1, per - used);
          put(t.slice(0, take), sg.c); t = t.slice(take); flush();
        }
        if (t.length) put(t, sg.c);
        if (used >= per) flush();
      });
    });
    flush();
  });
  return out;
}

/* UPLOADED ONLY WHEN IT CHANGED. texImage2D of a full-size RGBA canvas is megabytes; called every frame that is
 * hundreds of MB/s of upload for text that moves once every few frames, and on a shared-memory GPU that traffic
 * competes with the rendering itself.
 *
 * The key is what is actually ON the texture — the typed count and the caret's blink phase. Nothing else in the
 * content changes, so nothing else can require a re-raster. */
let lastContentKey = '';
let textRect = [-1, -1, -1, -1];   // the active block, in content-canvas fractions
/* THE TUBE IS LIT AND THE BOOT HAS NOT BEGUN -- a terminal waiting, which is a cursor and nothing else.
 *
 * A real set does not come up blank and then start writing half a second later with no sign of life in between.
 * It comes up with a cursor sitting there, and that cursor is the first thing the strike reveals. So the gap
 * WARM-UP opens between the raster arriving and the first character is not dead air; it is the machine idling. */
const caretWaiting = () => !!(state.power && typed === 0 && typeAt && performance.now() < typeAt);
function drawContent(force) {
  const g = textGrid();
  /* THE COLUMN BUDGET IS THE BLOCK'S, AND bootLines WANTS IT. It sets where the dot leaders stop and the value
   * column starts, so the boot text re-lays itself when the block or the grille changes -- the old build passed a
   * hardcoded 44 and the masthead never reflowed with the tube. Rebuilt only when the count actually moves;
   * `typed` is a flat index into it, so it is clamped rather than left pointing past the end. */
  const blockW = state.tw < 1 ? g.W : g.W * state.tw / 100;
  const cols = Math.max(1, Math.floor(blockW / g.charW));
  if (cols !== lastCols) {
    lastCols = cols;
    LINES = bootLines(ph, cols);
    FULL = LINES.reduce((a, segs) => a + segs.reduce((b, s) => b + s.t.length, 0), 0);
    typed = Math.min(typed, FULL);
  }
  /* THE BLINK ONLY ENTERS THE KEY WHEN THERE IS A CARET TO BLINK, and that is a saving as well as a correctness
   * fix. The phase flips twice a second whether or not anything is drawing a cursor, so a tube sitting switched
   * off -- nothing typed, nothing waiting -- was re-rastering and re-uploading a black 7MB texture on every flip
   * for a caret that does not exist. Constant key, no upload. */
  const waiting  = caretWaiting();
  const caretOn  = typed > 0 || waiting;
  const key = typed + '|' + (waiting ? 'w' : '') +
              (caretOn ? Math.floor(performance.now() / 420) % 2 : 0) + '|' +
              state.tox + '|' + state.toy + '|' + state.tvert + '|' + state.tjust + '|' +
              state.tw + '|' + state.tht + '|' + cols + '|' +
              g.em.toFixed(3) + '|' + g.pitch.toFixed(3) + '|' + g.charW.toFixed(3) + '|' +
              contentPx.w + 'x' + contentPx.h;
  if (!force && key === lastContentKey) return;
  lastContentKey = key;
  /* SIZED FROM THE RENDER TARGET, not fixed. See the note where contentPx is computed. */
  const w = g.W, h = g.H;
  if (cc.width !== w || cc.height !== h) { cc.width = w; cc.height = h; }
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
  ctx.font = '500 ' + g.em.toFixed(2) + 'px "JetBrains Mono", monospace';
  ctx.textBaseline = 'alphabetic';

  /* ONLY THE ROWS THAT HAVE BEEN REVEALED, which is what makes it a terminal rather than a paragraph filling in.
   * Reserving the finished block's height from the first character on nails the top edge and fills downward;
   * counting only what has been typed puts the newest row at the anchor and lifts everything above it by a
   * pitch. Built once here so the height, the draw loop and the bounds all walk the same list. */
  const rows = wrapLines(LINES, cols);
  const shown = [];
  for (let r = 0, n = typed; r < rows.length && n > 0; r++) {
    const len = rows[r].reduce((a, sg) => a + sg.t.length, 0);
    shown.push({ segs: rows[r], n: Math.min(len, n), len: len, part: n < len });
    n -= len;
  }
  /* THE WAITING CURSOR IS A ROW WITH NOTHING TYPED IN IT YET, and saying it that way is the whole implementation.
   *
   * Everything below -- the block's height, which edge ANCHOR nails, where ALIGN puts the ragged edge, and the
   * caret's own "wherever the next character would go" -- already answers correctly for a row that is zero
   * characters in. Positioning a cursor separately would mean a second copy of that geometry, free to disagree
   * with the first, and the disagreement would show as the cursor jumping the instant the first character landed.
   * n = 0 with part = true puts it exactly on the cell that character is about to occupy. */
  if (!shown.length && waiting && rows.length) {
    shown.push({ segs: rows[0], n: 0, part: true,
                 len: rows[0].reduce((a, sg) => a + sg.t.length, 0) });
  }

  /* THE BLOCK IS CENTRED ON TEXT X / TEXT Y, as the reference's is: #crt_term sits at 50%+tox / 50%+toy and is
   * pulled back by half its own size. A centre anchor is what lets ALIGN be only the ragged edge of the lines
   * INSIDE the block -- with a corner anchor the two cannot be separated, which is why the reference's ALIGN
   * used to jump TEXT X to a side and re-anchor. AUTO width is the widest row of the FINISHED text, not of what
   * has been typed, or the block would slide sideways as the longest line arrived. */
  const wide = rows.reduce((m, r) => Math.max(m, r.reduce((a, sg) => a + sg.t.length, 0)), 0);
  // A WHOLE NUMBER OF CELLS EITHER WAY: `cols` is already the budget floor(tw / charW), so reusing it makes the
  // block exactly the columns it wraps to. Sizing it from the raw percentage instead leaves a partial cell on
  // the right that CENTER and RIGHT then align against -- half a character of drift for no reason.
  const bw = (state.tw  < 1 ? wide : cols) * g.charW;
  const bh =  state.tht < 1 ? shown.length * g.pitch : g.H * state.tht / 100;
  const bx = g.W * (0.5 + state.tox / 100) - bw / 2;
  const by = g.H * (0.5 + state.toy / 100) - bh / 2;

  /* ANCHOR picks which edge of the block is nailed down — the axis ALIGN does not speak for. BOTTOM stands the text
   * on the block's last row and grows up; TOP hangs it from the first and grows down.
   *
   * THEN SNAPPED TO THE LATTICE, which is the point of measuring in cells: pitch is a whole number of scanlines
   * and charW a whole number of grille columns, so once the ORIGIN lands on a cell boundary every glyph does too.
   * Without the snap the block floats at an arbitrary sub-scanline phase and picks a new one on every resize. */
  const align = state.tjust === 2 ? 1 : state.tjust === 1 ? 0.5 : 0;
  let y0 = state.tvert ? by : by + Math.max(0, bh - shown.length * g.pitch);
  y0 = Math.round(y0 / g.slPx) * g.slPx;

  /* THE BLOCK'S OWN BOUNDS, measured while it is drawn. The phosphor glow is a statement about the AREA of
   * coating that is being driven, and that area is this rectangle -- so it is recorded here, where the true extent
   * is already known from the text metrics, rather than recovered later by blurring the pixels and hoping. */
  let bx0 = 1e9, by0 = 1e9, bx1 = -1e9, by1 = -1e9;
  for (let k = 0; k < shown.length; k++) {
    const row = shown[k];
    const y = y0 + k * g.pitch, yb = y + g.em * 0.78;    // the baseline, inside the cell
    let x0 = bx + (bw - row.len * g.charW) * align;
    x0 = Math.round(x0 / g.colW) * g.colW;
    /* ONE CHARACTER PER CELL, PLACED -- not one fillText per run. A run drawn in a single call advances by the
     * font's own metrics, which is exactly what this element is moving away from: the cell width is a count of
     * grille columns, and the glyphs have to land ON it rather than near it. Colour still comes segment by
     * segment, because the label/value two-tone is the thing bootLines computes. */
    let col = 0, left = row.n, caretC = '#fff';
    for (const sg of row.segs) {
      if (left <= 0) break;
      const t = sg.t.slice(0, Math.min(sg.t.length, left));
      ctx.fillStyle = caretC = sg.c;
      for (let i = 0; i < t.length; i++) {
        if (t[i] !== ' ') ctx.fillText(t[i], x0 + (col + i) * g.charW, yb);
      }
      col += sg.t.length; left -= t.length;
    }
    if (row.len) {
      bx0 = Math.min(bx0, x0); bx1 = Math.max(bx1, x0 + (row.part ? row.n : row.len) * g.charW);
      by0 = Math.min(by0, y);  by1 = Math.max(by1, y + g.em);
    }
    /* THE CARET SITS WHEREVER THE NEXT CHARACTER WOULD GO, on the same phase the memo key is keyed on — and that
     * includes AFTER THE LAST ONE, which is where it lives for all the time the boot is not running.
     *
     * Gated on `row.part` alone the caret exists only while a row is half-typed, so it vanishes the moment the
     * script finishes — exactly when a terminal is most obviously waiting for you.
     *
     * Two cases, one position: mid-line it goes at the typing point, and at the end one cell past the final
     * character of the last revealed row. */
    const lastRow  = (k === shown.length - 1);
    /* A CELL PAST THE END WHEN IT IS RESTING, on the typing point when it is not. The gap is the difference
     * between a prompt and a half-drawn line: "...|" reads as the machine still writing, "... |" as the machine
     * waiting for you, and waiting is what it is doing once the script has run out. */
    const caretCol = row.part ? row.n : row.len + 1;
    if ((row.part || (lastRow && typed >= FULL)) && Math.floor(performance.now() / 420) % 2) {
      /* THE HIGHLIGHT COLOUR, NOT THE RUN IT FOLLOWS. `caretC` was whatever segment happened to be painted last,
       * so the caret inherited the DIM label colour after any line ending in one -- a cursor dimmer than the
       * text it sits beside. It is the one thing on screen that is always live, so it takes ph.hi outright.
       *
       * HALF A CELL WIDE: a full cell is a filled block the width of a character, which reads as a selected
       * glyph rather than as a bar waiting for the next one. */
      ctx.fillStyle = ph.hi;
      ctx.fillRect(x0 + caretCol * g.charW, y, g.charW * 0.5, g.em);
    }
  }
  /* NORMALISED TO THE CONTENT CANVAS, which is the space the shader samples in. Empty until something has been
   * typed, in which case the glow has nothing to describe and collapses to a point off-screen. */
  /* Y IS FLIPPED, because the two spaces disagree about which way is up. These bounds come from canvas
   * coordinates, where y grows DOWNWARD from the top; the shader samples in texture coordinates, and
   * uploadContent sets UNPACK_FLIP_Y_WEBGL so v = 0 is the canvas's BOTTOM. Handing the canvas figures over
   * unflipped put the glow at the top of the tube while the text sat at the bottom -- measured, the field read 55
   * on the top row and 6 on the bottom one, exactly upside down. */
  if (bx1 > bx0) textRect = [bx0 / w, 1 - by1 / h, bx1 / w, 1 - by0 / h];
  else textRect = [-1, -1, -1, -1];
  R.uploadContent(cc);
}

let faceKey = '', outKey = '';
function syncLUT() {
  const fk = [view.face, view.grings, state.fexp, view.famp].join('|');
  if (fk !== faceKey) {
    faceKey = fk;
    // THE PROJECTION STAYS THE AUTHORITY — crt-projection's faceProfile, unmodified. This only tabulates it.
    // fadeSpan = grings * (2/GRIDN) with GRIDN 40, exactly as the DC computes it: FULL is 1.0, not 0.85.
    faceProf = faceProfile(view.face * 90, view.grings * 0.05, state.fexp, view.famp);
    faceLUT = buildFaceLUT(faceProf, 1024);
    R.setFaceLUT(faceLUT);
  }
  /* THE OUTLINE LIKEWISE, and it depends on the ASPECT as well as the shape -- guideOutline is handed the real
   * box, so its radii come back in the same units the shader measures in. Rebuilt only when one of those three
   * moves, all of which are settle-time events. */
  const asp = (canvas.width || 1) / (canvas.height || 1);
  const ok = state.corner + '|' + state.bend + '|' + asp.toFixed(4);
  if (ok !== outKey) {
    outKey = ok;
    R.setOutlineLUT(buildOutlineLUT(guideOutline(2 * asp, 2, state.corner / 0.9, state.bend), 1024));
  }
}

/* THE INSTRUMENT, REBUILT ONLY WHEN ITS INPUTS MOVE.
 *
 * Every path here comes from the same modules the tube is drawn from — guideOutline for the rim, ringLadder for
 * the ring ladder and its heat, curvedGridPaths for the calibration grid — walked through the SAME faceShaped the
 * face LUT was built from. An instrument that derived its own geometry could agree with itself while disagreeing
 * with the tube.
 *
 * HEAT IS A NUMBER, COLOUR IS PRESENTATION. ringLadder returns bands; the ramp from gap to colour is decided here.
 */
const calSvg = document.getElementById('cal');
let calKey = '';
function syncCal() {
  const asp = (canvas.width || 1) / (canvas.height || 1);
  const k = [view.face, state.corner, state.bend, view.grings, state.fexp, state.guidesOn,
             state.gridOn, state.debugOn, view.famp, view.frameOn, view.frameW, cssPx.h,
             asp.toFixed(4)].join('|');
  if (k === calKey) return;
  calKey = k;

  const w = 2 * asp, H = 2;
  const prof = guideOutline(w, H, state.corner / 0.9, state.bend);
  /* faceShaped, not faceF: the projection reads the face's SHAPE, so the instrument must ask the same question.
   *
   * AND PINNED. The picture is gathered through a pinned map — F(u)/F(1) — so an overlay plotted through the raw
   * one stops short of the glass wherever F(1) < 1, and an instrument that disagrees with the tube it is measuring
   * is worse than no instrument.
   *
   * Pinned on .pin — the UN-bowed axis value faceShaped publishes — not on f(1, 0): dividing by the bowed value
   * would normalise BEND's bow away at precisely the ray where it is strongest. */
  /* FOLDED INTO THE FIRST QUADRANT. prof.rhoQ and prof.wQ are tables over [0, PI/2] only, because guideOutline
   * samples one quadrant — the outline is symmetric in both axes by construction. faceShaped hands them a RAW
   * theta, which is negative below the x axis and past PI/2 to the left of the y axis, so in three quadrants out
   * of four the lookup runs off the end of the table.
   *
   * crt-geometry publishes shapeRatio and axisWeight for exactly this — both apply foldQuad first — so the two
   * builds cannot disagree about which ray is a corner.
   *
   * The SHADER is never affected: aperture() folds with abs() before it indexes, which is why the picture looks
   * right while the calibration grid drawn over it does not. */
  const fRaw = faceShaped(view.face * 90, view.grings * 0.05,
                          { rho: (th) => shapeRatio(prof, th), bow: (th) => axisWeight(prof, th),
                            bend: state.bend / 100 }, state.fexp, view.famp);
  const pinK = fRaw ? (fRaw.pin == null ? fRaw(1, 0) : fRaw.pin) : 1;
  const kk = pinK > 0.01 ? pinK : 1;
  const fF = fRaw ? ((u, th) => fRaw(u, th) / kk) : null;

  /* THE OVERLAY LIVES IN THE SAME SCALED SPACE AS THE SHADER. The moulding shrinks the glass so glass + frame fills
   * the box: the shader multiplies its aperture by 1 + WIDTH, so the rim lands at 1/(1 + WIDTH) of the outline.
   * This SVG is drawn into a fixed viewBox over the whole stage and would otherwise keep plotting the tube at its
   * unshrunken size — an instrument measuring a surface the renderer is no longer drawing.
   *
   * Scaling about the viewBox centre by the same factor is the fix, and it has to be the SAME expression the
   * shader uses, not a second one that happens to agree today. */
  // MUST MATCH THE SHADER'S uFrameFit exactly -- see the note where it is uploaded.
  const fitW = view.frameW / Math.max(1, cssPx.h / 2);
  const fit = view.frameOn ? 1 / Math.max(0.35, 1 - fitW) : 1;
  const toVB = ([x, y]) => (50 + x / w * 100).toFixed(3) + ',' + (50 + y / H * 100).toFixed(3);
  /* THE GLASS, AS A CLIP PATH, from the same guideOutline points the guide is drawn from and the shader's own
   * aperture table is built from. One description of the rim, used by all three. */
  const glassD = 'M' + prof.pts.map(toVB).join('L') + 'Z';
  let out = '';

  if (state.debugOn && state.guidesOn) {
    /* THE REFERENCE'S OWN GUIDE COLOURS, not an amber hairline. CRT Lab.dc.html's guide layer is a dashed BLUE
     * edge -- #7fd0ff, 1.2 wide, 6/4 dash, 0.9 opacity -- with dashed RED centre crosshairs at #ff3c3c, 1 wide,
     * 4/4 dash. Blue for the measured edge and red for the axes reads as an instrument rather than as part of the
     * picture, which a dim amber line at 28% did not: it looked like a rim highlight the tube was drawing. */
    out += '<path d="' + glassD + '" fill="none" stroke="#7fd0ff" ' +
           'stroke-width="1.2" stroke-dasharray="6 4" opacity="0.9" vector-effect="non-scaling-stroke"/>';
    // The axes are a property of the GLASS, so they stop at its rim rather than running out over the moulding.
    out += '<defs><clipPath id="glassclipx" clipPathUnits="userSpaceOnUse">' +
           '<path d="' + glassD + '"/></clipPath></defs>' +
           '<path clip-path="url(#glassclipx)" d="M0,50H100M50,0V100" fill="none" stroke="#ff3c3c" ' +
           'stroke-width="1" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>';
  }
  /* NO RING BANDS. ringLadder samples twenty annuli and reports the worst gap in each -- twenty numbers standing
   * in for a continuous field, which is the best the DOM build can do because it PLOTS geometry rather than
   * gathering it. This shader holds the inverse map as a lookup, so it can read the surface directly at every
   * pixel; see the elevation note in crt-gl.js. Removed rather than kept as a second, coarser opinion about the
   * same quantity -- which is exactly the drift crt/README.md exists to prevent. */

  if (state.debugOn && state.gridOn) {
    /* 192 SAMPLES PER LINE, and the corners are why. A polyline chords a convex curve, cutting inside it, and the
     * error goes as the square of the step — so it concentrates wherever curvature is highest. At 48 samples the
     * corner error is an order above the axes', which reads as the grid failing to round its own corners rather
     * than the projection failing to bend them.
     *
     * 192 puts the corner error level with what the axes already had. No draft tier is needed here, because
     * syncCal is memoised on the geometry controls and only runs when one of them settles. */
    /* CLIPPED TO THE GLASS, because the grid measures the PICTURE and the picture stops at the rim. The lattice is
     * rectangular and the glass is a squircle, so the grid's corners fall outside it and would be drawn over the
     * moulding — an instrument reporting on a surface that is not there.
     *
     * The clip is guideOutline's own points — the same path the blue guide is stroked from and the same outline
     * the shader's aperture table is sampled from — so the grid cannot end anywhere the tube does not. */
    const g = curvedGridPaths(w, H, 40, fF, 192);
    out += '<defs><clipPath id="glassclip" clipPathUnits="userSpaceOnUse">' +
           '<path d="' + glassD + '"/></clipPath></defs><g clip-path="url(#glassclip)">';
    g.lines.forEach((d) => {
      out += '<path d="' + d + '" fill="none" stroke="#ffb454" stroke-opacity="0.12" ' +
             'stroke-width="1" vector-effect="non-scaling-stroke"/>';
    });
    out += '</g>';
  }
    /* ONE TRANSFORM ON THE WHOLE OVERLAY, not a scale factor threaded through every path.
   *
   * Putting the factor inside toVB reaches the guide outline but NOT the grid: curvedGridPaths emits viewBox
   * coordinates straight from radialMap and never passes through toVB, so the grid carries on covering the whole
   * stage while the guide sits correctly on the rim.
   *
   * A group transform catches everything by construction, including anything added later. Scaled about the viewBox
   * centre, with vector-effect="non-scaling-stroke" keeping the stroke widths honest through it. Identity when
   * the frame is off. */
  calSvg.innerHTML = fit === 1 ? out
    : '<g transform="translate(50,50) scale(' + (1 / fit).toFixed(5) + ') translate(-50,-50)">' + out + '</g>';
}

/* THE UNITS EACH CONTROL IS ACTUALLY IN, one fmt() per row:
 * a slider that reads "27" is ambiguous, and one that reads "27 deg" is not. SQUIRCLE runs to 90 because that is
 * where guideOutline's exponent reaches exactly 2 -- a circle, in a square box. */
/* THE ARC A BOWED EDGE SWEEPS, measured off the real outline. Sagitta is how far the edge midpoint stands proud
 * of the straight line joining its two corners; the half chord is the run from midpoint to corner. */
/* BEND STAYS A PERCENTAGE, and the attempt to make it degrees is recorded so it is not repeated.
 *
 * SQUIRCLE has an absolute landmark — at 90 the superellipse exponent is exactly 2, which IS a circle. BEND has no
 * such point: it is a bow depth, and the ARC that bow describes depends on the shape being bowed, so the same
 * percentage sweeps a different angle on a rectangle than on a rounded face, and on a wider glass than a narrower.
 *
 * A degree-labelled BEND is therefore a function of SQUIRCLE and of the window size — the number moves when you
 * touch a different control. And past what the bow can produce the request is unreachable, so the panel would read
 * a figure the glass does not deliver.
 */

let faceLUT = { u: null, r1: 1, rimK: 1 };
let faceProf = null;   // the profile itself: the elevation overlay reports its sag   // kept so the content canvas can size against the pin
/* THE STAGE IN CSS PIXELS, kept because the mask's density is defined against it -- see the PPI note
 * where scanN is computed. Device pixels are the wrong ruler for a control the reference specifies in
 * CSS pixels, and using them made the pattern 1.5x finer than the reference's at the same PPI. */
const cssPx = { w: 1600, h: 1100 };
// Render-target pixels per CSS pixel: dpr * renderScale. The mask's width is specified in CSS px.
let pxScale = 1;
/* THE CONTENT LAYER'S SIZE, DECLARED UP HERE WITH cssPx AND FOR THE SAME REASON: the panel's readouts now report
 * derived quantities -- how many columns a TEXT WIDTH buys, how many rows fit -- and to do that a formatter has to
 * call textGrid(), which reads this. Left at its natural home next to resize() it sits 90 lines BELOW the loop that
 * builds the panel, and a const is in its temporal dead zone until then: the whole page fails to boot with
 * "Cannot access 'contentPx' before initialization". Exactly the trap the px formatter hit with cssPx. */
const contentPx = { w: 1600, h: 1100 };

const FMT = makeFmt({ state, cssPx, textGrid });
const host = document.getElementById('controls');
/* THE PANEL, AS FOUR SMALL BUILDERS RATHER THAN ONE NESTED LOOP. Split by what each piece IS: each builder returns
 * its element and knows nothing about the others, so a new row type is a new function plus one line in dispatch,
 * and the section machinery never has to be touched.
 */

/* THE PANEL IS THE SHARED KIT'S, not this page's — ../kit/panel.js and ../kit/panel.css.
 *
 * THE TWO THINGS THE BUILDERS USED TO REACH IN FOR arrive as (key, kind) instead. A colour is always a bezel
 * colour, so it invalidates that memo; RENDER SCALE is the one control that reallocates the buffer. The kit stays
 * ignorant of both.
 *
 * THE FOLD MAP IS NOT PASSED, so the kit resolves state.secClosed on every read. Handing it the object is a real
 * bug: the restore replaces whole keys, so the panel folds on screen while nothing reaches storage. */
createPanel({
  host, state, sections: SECTIONS, fmt: FMT,
  onChange(key, kind) {
    if (kind === 'colour') bez.box.k = null;
    queueSave();
    if (key === 'renderScale') resize();
  },
});

/* LIGHT IS FIXTURE'S OWN MASTER, the same treatment DEBUG and FRAME get. Beside POWER it is a control for one
 * section's contents sitting several sections above them, grouped with two things that genuinely are global —
 * state.lightOn feeds exactly one uniform, and with it off every row under FIXTURE describes something that is
 * not being drawn. As a master the section collapses with it.
 *
 * POWER stays: it is the tube itself. */
/* THE LIT STATE IS ASKED FOR, NOT TOGGLED. Third element is a predicate, and an action without one is not a state
 * and never lights. POWER answers from state.power; WARP and SURGE are things that HAPPEN and are never lit.
 *
 * WARP AND SURGE DIFFER ON ONE POINT. The warp is the BEAM being bent, so it needs a beam: with the tube dark
 * there is nothing to deflect. The surge is the ROOM's supply failing, so it fires whether or not the monitor is
 * switched on — the fixture and the moulding carry the event on their own. */
/* FULLSCREEN, WHERE IT EXISTS, AND ABSENT WHERE IT DOES NOT. Safari on iPhone does not implement
 * requestFullscreen — iPad does, iPhone does not — so an unconditional button would visibly do nothing on the one
 * device most in need of the space. The manifest and the apple-mobile-web-app-capable meta cover iOS by a
 * different route: added to the home screen, the lab launches with no browser chrome at all.
 *
 * NOT DEBOUNCED AND NOT FOLLOWED BY A MANUAL resize(). Entering or leaving fullscreen fires a real window resize,
 * which the settle handler above already answers. */
const canFullscreen = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
const inFullscreen = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function toggleFullscreen() {
  const el = document.documentElement;
  if (inFullscreen()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (el.requestFullscreen || el.webkitRequestFullscreen).call(el).catch(() => {});
}

const ACTIONS = [
  ['\u23fb POWER', togglePower, () => !!state.power],
  ['\u223f WARP',  () => { if (state.power) triggerWarp(performance.now()); }],
  ['\u2301 SURGE', () => triggerSurge(performance.now())],
];
// Appended rather than written into the literal above, so the three instrument actions stay one list.
if (canFullscreen) ACTIONS.push(['\u26f6 FULL', toggleFullscreen, inFullscreen]);
const abox = document.getElementById('actions');
buildActions(abox, ACTIONS, queueSave);

/* THE FULLSCREEN BUTTON HAS TO BE TOLD, because its state is the one in this strip that changes without being
 * clicked. buildActions re-reads `lit` on click, which is right for POWER -- but fullscreen resolves a promise
 * AFTER the handler returns, and Escape leaves it with no click at all. Read on click alone the button lights
 * one gesture behind and then lies outright once Escape is used, which is precisely what buildActions' own note
 * about asking the page rather than remembering is warning against. */
if (canFullscreen) {
  const fsBtn = abox.lastElementChild;
  const syncFs = () => fsBtn.classList.toggle('on', inFullscreen());
  document.addEventListener('fullscreenchange', syncFs);
  document.addEventListener('webkitfullscreenchange', syncFs);
}

/* THE PHOSPHOR SELECTOR. Switching it re-resolves the palette, rebuilds the boot text (its two-tone is derived
 * from fg/hi, so it has to be rebuilt rather than recoloured) and invalidates the memoised palette. */
const phosRow = document.getElementById('phosrow');
function buildPhosRow() {
  phosRow.innerHTML = '';
  ['amber', 'green', 'white'].forEach((name) => {
    const b = document.createElement('button');
    b.textContent = PH[name].name;
    if (name === phName) b.classList.add('on');
    b.onclick = () => {
      phName = name; ph = PH[name]; state.phName = name; queueSave();
      lastCols = 0;                   // drawContent owns the rebuild; this just invalidates its column memo
      lastContentKey = '';            // force a re-raster: the glyph colours changed
      pal.box.k = null;               // and the palette the shader is handed
      buildPhosRow();
    };
    phosRow.appendChild(b);
  });
  const sw = document.createElement('input');
  sw.type = 'color'; sw.className = 'sw'; sw.value = ph.fg;
  sw.title = 'custom phosphor';
  sw.oninput = () => {
    ph = { fg: sw.value, hi: sw.value, glow: hexRgb(sw.value).join(','), name: 'CUSTOM' };
    phName = 'custom'; state.phName = 'custom'; state.phCustom = sw.value; queueSave();
    lastCols = 0;
    lastContentKey = ''; pal.box.k = null;
    [...phosRow.querySelectorAll('button')].forEach((b) => b.classList.remove('on'));
  };
  phosRow.appendChild(sw);
}
/* THE PHOSPHOR RESTORED HERE, not in the load block above: the boot text is coloured by it, and `ph` is not in
 * scope yet at the point the rest of the state is merged. The text itself is built by drawContent, on the column
 * count only it knows -- so all this has to do is invalidate the memo. */
if (state.phName === 'custom' && typeof state.phCustom === 'string') {
  ph = { fg: state.phCustom, hi: state.phCustom, glow: hexRgb(state.phCustom).join(','), name: 'CUSTOM' };
  phName = 'custom';
} else if (PH[state.phName]) {
  phName = state.phName; ph = PH[phName];
}
lastCols = 0;
lastContentKey = ''; pal.box.k = null;

buildPhosRow();

let rzT = 0;
function resize() {
  const r = document.getElementById('stage').getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cssPx.w = Math.max(2, Math.round(r.width));
  cssPx.h = Math.max(2, Math.round(r.height));
  // BEFORE anything below reads a setting: crossing the breakpoint is exactly what changes which set applies,
  // and R.size and the content buffer are both sized from values the overrides can move.
  syncView();
  const w = Math.max(2, Math.round(r.width * dpr * state.renderScale));
  const h = Math.max(2, Math.round(r.height * dpr * state.renderScale));
  pxScale = Math.max(0.1, h / Math.max(1, Math.round(r.height)));
  R.size(w, h);
  /* THE CONTENT BUFFER FOLLOWS THE RENDER TARGET. A fixed 1600x1100 meant the glyphs were minified to the render
   * size by the sampler and then magnified back up to the display -- two resamples the text never needed, which
   * is what made it look like a blur was being applied to it. 1.08 of the target because the projection magnifies
   * the middle of the picture slightly, so a margin keeps that from sampling under 1:1. */
  /* AND BY THE PIN, because the projection is pinned at the rim and this build GATHERS rather than plots. The lab
   * can magnify for free -- it regenerates its geometry at the new scale. Sampling a texture cannot: magnifying by
   * 1/F(1) with a 1:1 canvas means fewer than one source texel per output pixel and the middle goes soft, which is
   * precisely the "middle is being stretched" failure crt-projection warns about. Sizing the canvas by 1/F(1)
   * keeps the sampling above 1:1 at every FACE. Never below the old 1.08 -- a concave face has F(1) > 1 and would
   * otherwise shrink the canvas below the target. */
  const pinScale = Math.max(1.08, 1 / Math.max(0.35, faceLUT.r1 || 1));
  contentPx.w = Math.max(256, Math.round(w * pinScale));
  contentPx.h = Math.max(256, Math.round(h * pinScale));
  document.getElementById('scaleinfo').textContent =
    w + '×' + h + ' · ' + (w * h / 1e6).toFixed(2) + ' MP · scale ' + state.renderScale.toFixed(2);
}
// SETTLE, DON'T TRACK -- the same lesson the DOM build learned. Every resize event would reallocate four buffers.
window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(resize, 120); });
resize();

/* THE PANEL'S SWITCH. Mounted after the first resize deliberately: on a narrow screen panel.css has already lifted
 * the panel out of the flow, so the stage measures at full width whichever way the toggle starts.
 *
 * Re-sized on every toggle because the WIDE case genuinely changes the stage — hiding the sidebar grows the canvas,
 * and a renderer still sized to the old box stretches until the next window resize. The narrow case moves nothing,
 * and R.size returns immediately when the buffer dimensions are unchanged. Not debounced: a click is one event,
 * and the settle above exists for resize STREAMS. */
// NARROW_W and SHORT_H, not a second pair: the panel folding away and the raster scaling up are the same
// judgement about the display, and two constants that mean "small screen" would eventually disagree.
mountPanelToggle({ panel: document.getElementById('panel'), breakpoint: NARROW_W, shortSide: SHORT_H,
                   onToggle: () => resize() });

/* A LOST CONTEXT IS A NORMAL EVENT ON THIS HARDWARE. The page drives an integrated adapter hard enough that
 * Windows can reset the display driver under it, and Chrome then kills the WebGL context: every program, texture
 * and framebuffer is gone, and every gl call becomes a silent no-op. The loop carries on calling them against a
 * dead context, so the canvas keeps whatever pixels it died with and the instrument reads as frozen.
 *
 * THREE THINGS ARE REQUIRED.
 *
 *   preventDefault() on the lost event is what tells Chrome to attempt a restore at all. Without it
 *     'webglcontextrestored' never fires and everything below is dead code.
 *   Restoring is a REBUILD, not a resume: createRenderer allocates fresh, so every memo that remembers having
 *     uploaded something has to be cleared or the new context is left with no LUTs and buffers of the wrong size.
 *   The status message goes in its OWN span. Writing textContent on #hud replaces its children, and resize() then
 *     throws on the missing #scaleinfo — which aborts this handler before it can clear glLost and parks the
 *     instrument for good.
 *
 * Verified by driving WEBGL_lose_context: the fingerprint returns to within render-probe.js's documented noise
 * floor for a content raster settling.
 */
let glLost = false;
const glState = document.getElementById('glstate');
canvas.addEventListener('webglcontextlost', (e) => {
  e.preventDefault();
  glLost = true;
  glState.textContent = 'GPU CONTEXT LOST — the display driver reset. Restoring…';
});
canvas.addEventListener('webglcontextrestored', () => {
  R = createRenderer(canvas);
  if (!R) {
    glState.textContent = 'GPU CONTEXT LOST — could not restore. Reload the page.';
    return;
  }
  // Every upload the old context held is gone with it, so each memo that gates one is cleared.
  faceKey = ''; outKey = ''; calKey = ''; lastContentKey = ''; pal.box.k = null;
  resize();
  drawContent(true);
  glLost = false;
  glState.textContent = '';
});

let frames = 0, fpsT = 0;
const fpsEl = document.getElementById('fps');

function frame(now) {
  /* NOTHING IS DRAWN WHILE THE CONTEXT IS GONE, but the loop stays alive so the restore needs no restart.
   * Every gl call against a lost context is a no-op, so the work below would be spent building uniforms for
   * a draw that cannot happen -- and drawContent would re-raster the text canvas to upload it nowhere. */
  if (glLost) { requestAnimationFrame(frame); return; }
  /* THE VIEW IS REFRESHED PER FRAME, not only on resize, because the PANEL writes to state and the overrides
   * are laid over a copy of it -- without this a slider moved on a phone would edit state and never reach the
   * copy the renderer reads. On a roomy display this is a width comparison and an assignment. */
  syncView();
  const t = now / 1000;
  /* THE POWER SEQUENCE, EVALUATED FIRST, because both deadlines below are read against it and the picture it
   * hands out is what everything after this draws. See the pose tables in crt-power.js. */
  const pwr = powerNow(now);
  const wp  = warpAt(now);
  if (wipeAt && now >= wipeAt) { typed = 0; wipeAt = 0; }
  /* TYPE SPEED IN WORDS PER MINUTE, which is what the readout says and what the reference's `type` means: the
   * control is a multiplier on 350 WPM. A word is five characters by the usual convention, so 350 WPM is 1750
   * characters a minute and one character every 34.3ms -- close enough to the 26ms this was hardcoded at that the
   * boot reads the same, and now it is a number with a unit rather than a constant nobody could explain. */
  /* HELD UNTIL THE TUBE HAS STRUCK, AND WHILE IT IS OFF. lastType tracks forward while either hold stands, so the
   * first character lands at the deadline rather than a full interval after it -- and, more to the point, the
   * counter cannot bank the whole warm-up as owed time and dump a dozen characters onto the screen in one frame.
   *
   * The power guard is the lab's: a switched-off tube is not typing. Without it the sequence kept running behind
   * a dark screen after the wipe, so the switch coming back found a boot half-finished -- invisible, because
   * powerOn wipes anyway, and wrong in the way a thing that is only invisible by luck is wrong. */
  if (!state.power || (typeAt && now < typeAt)) lastType = now;
  else if (now - lastType > 60000 / (350 * 5 * state.type) && typed < FULL) { typed++; lastType = now; }
  drawContent();   // no-ops unless the typed count or the caret phase moved
  syncLUT();
  syncCal();       // likewise: rebuilds only when a geometry control or the aspect moved

  /* THE REAL FLICKER ENGINE, not a sine. crt-flicker is a factory of pure functions: screenFlicker is a stochastic
   * DIP — a random depth and duration, then a gap scaled by the rate — and bulbFlick is a per-bulb flux model with
   * jitter, chaos and a health-driven colour strike. A product of sines is periodic, so it reads as a wobble rather
   * than a tube guttering, and its control is a depth where this one is a RATE in Hz.
   *
   * They arrive as uniforms, which is the point: writing these values into CSS invalidates a group under a filter
   * and costs most of the frame. Here the number changes and nothing is invalidated. */
  /* THE POWER LEVEL RIDES ON THE FLICKER, and that is not a shortcut — it is the same quantity. uFlicker is what the
   * phosphor is putting out this frame, spent in the shader on everything the tube emits and nothing it reflects.
   * A tube striking is putting out several times its settled output for a moment; a tube collapsing is putting out
   * nothing by the end.
   *
   * It is also why the moulding's screen-lit terms flash with the strike without being wired for it: they already
   * read uFlicker. pwr.lvl > 0 is the flicker engine's own gate — a dead tube does not gutter. */
  /* THE FAULT IS SAMPLED ONCE AND SPENT EVERYWHERE, which is the whole reason it reads as the room rather than as
   * an effect on the screen. One `sg` feeds the tube's output, both lamps' output, both lamps' HEALTH and the
   * colour temperature the palette is built from -- so nothing in the picture can be half a frame out of step
   * with anything else in it. */
  const sg = surgeNow(now);
  /* THE GUTTERING RIDES ON HOW HARD THE FAULT IS BITING, not on a flat rate for the duration. bite is the
   * distance from normal, so the tube chops hardest through the collapse and the cut and goes quiet through the
   * BUILD -- which is the phase crt-flicker's own note says exists to buy the flash its impact. A constant rate
   * across the event would fill that silence in and take the flash with it. */
  const bite  = sg ? sg.bite : 0;
  const fHz   = state.flickHz + (state.surgeHz  - state.flickHz) * bite;
  const fStr  = state.fstr    + (state.surgeStr - state.fstr)    * bite;
  const flk = pwr.lvl * FLK.screenFlicker(now, fHz, fStr, pwr.lvl > 0) * (sg ? sg.screen : 1);
  /* THE LAMPS ARE GATED ON THE FITTING'S SWITCH AND NOTHING ELSE. A second gate on `flickerOn` is a dead end you
   * cannot get out of: it has a default of 1 and NO ROW ANYWHERE ON THE PANEL, so any session that ever stored it
   * as 0 has all four flicker controls permanently doing nothing, with nothing on screen able to turn them back on.
   *
   * A per-lamp rate of 0 Hz is already the off switch, and bulbFlick's own guard is `hz > 0.05 && flux > 0.001`.
   * A tube that is not flickering is a tube whose FLICKER is zero — that is the control, it is visible, and it
   * cannot strand anyone. */
  const lampOn = !!state.lightOn;
  /* THE LAMPS GUTTER FASTER UNDER THE FAULT TOO, and their own FLICKER rate is the floor rather than the answer:
   * a tube whose supply is collapsing does not keep failing at the leisurely rate its ballast manages on a good
   * day. Same bite, so the fixture and the screen chop in step. */
  const lampHz = (hz) => hz + (state.surgeLampHz - hz) * bite;
  const lamp = (id, hz, str, health) =>
    FLK.bulbFlick(now, id, lampHz(hz), str, lampOn, state.lfjit, state.lfchaos, health);
  /* THE BULBS ARE ADVANCED FIRST, because the two things below are read out of the machine they advance. Using only
   * bulbFlick's return value — the brightness multiplier — and never calling bulbState is what makes a fixture read
   * as a lamp being dimmed rather than a lamp that is broken.
   *
   * HEALTH IS THE SLIDER, NOT THE LIVE VALUE, on the way IN: the colour strike leans warm on a dying tube, and the
   * right signal for that is the tube's CONDITION. The sag is this cycle's weather, and feeding it back compounds. */
  const mA = lamp('A', state.lflickA, state.lfstrA, state.healthA);
  const mB = lamp('B', state.lflickB, state.lfstrB, state.healthB);
  const bA = FLK.bulbState('A') || {}, bB = FLK.bulbState('B') || {};

  /* THE COLOUR STRIKE — what makes a failing tube read as failing rather than as dimming.
   *
   * crt-flicker picks warmTarget on a re-ignition and SNAPS to it, because an eased colour shift reads as a fade
   * rather than a strike. It is signed on purpose: positive drops kelvin for the tired pinkish cast of an old tube,
   * negative RAISES it for the cold blue-green of an arc that has struck before its phosphor caught up. A hard
   * strike drives straight into the floor or the ceiling, so it reads as a lamp misfiring rather than as a
   * slightly different white. FLICK CHAOS governs how often that happens.
   *
   * QUANTISED, so the palette memo holds still for runs of frames rather than rebuilding the whole phosphor and
   * bezel model every time a strike nudges the average. */
  /* COLOUR STRIKE is the kelvin a strike is worth, and it is a control rather than a fixed constant. A small value
   * is right for a lab where the fixture is one of a dozen things being tuned — a strike lands a few hundred kelvin
   * off nominal, which is a real drift and reads as one. It is not enough when the fitting is the thing you are
   * watching. Larger, an ordinary strike is plainly a different colour of light and a hard one drives into the
   * floor or the ceiling, which is what "this lamp is broken" looks like. The clamp keeps it legible however far
   * this is pushed. */
  const kelvin = (t, warm) => {
    const dK = warm * state.lfwarmK + (sg ? sg.warm * state.surgeWarm : 0);
    return Math.round(Math.min(9000, Math.max(2200, t - dK)) / 20) * 20;
  };
  const tA = kelvin(state.tempA, bA.warm || 0), tB = kelvin(state.tempB, bB.warm || 0);
  /* AND THE HEALTH MOVES WITH IT. hmod is an instant drop to a new condition on about a fifth of cycles, then a
   * recovery halfway back on each cycle after -- so the tube loses a chunk of its coating, limps, and claws some
   * of it back, at intervals nobody can predict. It reaches the shader as uHealthA, which is what tubeSurface
   * draws its zonal pattern from, so the ENDS and the middle change independently instead of the whole tube
   * dimming together. That is the difference between a lamp on a dimmer and a lamp that is going. */
  /* HEALTH DIP deepens the excursion rather than replacing it, so WHEN the tube stumbles is still the machine's
   * decision and only HOW FAR is this panel's. hmod comes back as, say, 0.85; a gain of 2 reads that as a drop
   * to 0.70. At 1 it is the reference's own depth, which is a lamp losing a little coating and getting most of
   * it back -- true, and too subtle to see on a fitting this size. */
  const lim = (v) => Math.max(0, Math.min(1, v));
  const dip = (m) => 1 - (1 - (m == null ? 1 : m)) * state.lfhdip;
  const hA = lim(state.healthA * dip(bA.hmod) * (sg ? sg.health : 1));
  const hB = lim(state.healthB * dip(bB.hmod) * (sg ? sg.health : 1));
  const p = pal(tA, tB);
  /* THE RASTER, RESOLVED ONCE FOR THE WHOLE FRAME. Named RN because R is the renderer. Every line-count and
   * column-count below reads this rather than recomputing the density, so the beam, the tip, the convergence
   * and the text are all measured in the same raster the shader is told to draw. */
  const RN = rasterN();

  R.draw({
    /* FIT: OVERSCAN COMPUTED SO THE PICTURE'S RIM STAYS ON THE GLASS, whatever FACE, DEPTH, CURVE AREA and FALLOFF do
     * to the projection. The rim is pinned, so at the shipped depth the raster already lands exactly on the glass;
     * push DEPTH up and the amplitude passes what the fold test bounded, and the outer part of the picture is
     * driven past the aperture and clipped.
     *
     * The number is the face LUT's own last sample — the scale factor at s = 1, where the raster edge lands — so it
     * comes from the same table the shader gathers through. Clamped to the slider's range, so FIT can never ask for
     * something OVERSCAN could not have been set to by hand. */
    time: t,
    overscan: state.overscan,
    face: view.face, corner: state.corner, bend: state.bend,
    /* THE PPI RULE: round(span * density / 100), the picture's HEIGHT for the horizontal pass and its WIDTH for the
     * vertical one — MEASURED IN CSS PIXELS, which is the point of this note.
     *
     * Dividing the canvas's DEVICE height instead makes the pattern finer on a high-DPI display for the same number
     * on the slider, and because it is finer it sits closer to the pixel grid and gets averaged away — the mask then
     * looks like it only appears where there is content to darken.
     *
     * A density is a statement about the tube, not about the buffer it is rasterised into, so neither
     * devicePixelRatio nor renderScale may enter. Computed on the CPU and handed in as a line count. */
    /* PITCH IN CSS PIXELS, NOT A DENSITY — the same geometry, said directly. count = round(span * density / 100) makes
     * pitch = span/count, and working that through gives pitch = 100/density exactly, independent of the window.
     * The density is the reciprocal of the thing anyone actually wants to set.
     *
     * WHAT IS KEPT IS THE MISSING round(). Rounding the count to a whole number makes the true pitch span/round(…)
     * rather than 100/density, which drifts as the stage resizes. Dropping the round leaves the density meaning
     * exactly 100/density at every size. */
    scanN: RN.sl,
    /* WIDTH IS IN CSS PIXELS TOO, for the same reason the density is -- and it was the other half of the same bug.
     * The reference strokes with vector-effect="non-scaling-stroke" at stroke-width 1.0, and a non-scaling stroke
     * is measured in CSS pixels, so on a 1.74x display its line is 1.74 device pixels of ink. This handed the raw
     * number to a shader that measures dyPx in RENDER-TARGET pixels, so the same "1.00px" on the panel drew a line
     * 1.74x thinner and carried that much less ink. Modulation per unit brightness measured 0.033 against the
     * reference's 0.096. Converted here, once, so the readout keeps meaning CSS pixels the way the reference's
     * does. */
    scanW: state.scanw * pxScale, scanA: state.scanop / 100,
    grilleN: RN.col,
    grilleW: state.grillew * pxScale, grilleA: state.grilleop / 100,
    phos: state.phos, bloom: state.bloom, bloomThresh: state.bloomThresh,
    /* PX -> TAP SPACING, converted here because only this side knows the ratios. The blur buffer is a
     * quarter of the render target (w >> 2), so one of its texels spans 4 render-target pixels, and the
     * thirteen taps carry a sigma of 3 -- one texel of spacing is therefore a 12-render-pixel blur. The
     * control is specified in CSS px like FRAME WIDTH and the scanline width, so pxScale converts it. */
    bloomSpread: state.bloomSize * pxScale / 12,
    /* NOT MULTIPLIED BY THE SWITCH ANY MORE. It was `state.beam * state.power`, which zeroed the content on the
     * frame the button was pressed -- so the collapse had nothing left to play over and the picture simply
     * vanished. What the beam is worth is a setting; whether the tube is emitting is the power level, and that is
     * spent once, on the flicker, where the shader already separates emission from reflection. */
    bright: state.bright, beam: state.beam,
    // THE PICTURE'S SURVIVING EXTENT. 1,1 at rest, and the shader's uniform branch tests for exactly that.
    pwr: [pwr.sx, pwr.sy],
    /* THE MAGNET'S FIELD THIS FRAME. A zero k skips the whole branch, so a tube nobody is holding a magnet
     * against pays nothing -- the same discipline the collapse follows. */
    warpK: wp.k, warpPos: wp.pos, warpR: wp.r, warpD: wp.d,
    vig: state.vig, vigFall: state.vigFall, heat: state.debugOn ? state.heat : 0,
    // GATED ON DEBUG like the guides and the heat map: an inspection view, not a setting.
    fixSolo: state.debugOn ? state.fixSolo : 0,
    /* THE SAG, SIGNED, straight from crt-projection -- the overlay must not re-derive it. */
    sagA: faceProf ? faceProf.sg * faceProf.A : 0,
    sagU0: faceProf ? faceProf.u0 : 0, sagP: faceProf ? faceProf.p : 2,
    // SECONDS -> RATE, here and nowhere else. 0s is parked, which is a period the shader cannot express.
    sweep: state.sweepSec > 0 ? 1 / state.sweepSec : 0,
    /* GATED ON THE PHASE, NOT THE LEVEL. The sweeps are additive emission, so the level already dims them with
     * everything else -- but zero here also SKIPS the tip's whole per-pixel branch, which is worth having on a
     * tube that is off and is not worth losing mid-collapse while the beam is still visibly writing. */
    sweepOn: state.beamOn && pwr.lvl > 0 ? state.sweepOn : 0,
    /* SCANLINES AND COLUMNS -> suv, converted once here. nSL and nCOL are the SAME counts handed to the shader
     * as scanN/grilleN a few lines up, so the beam cannot disagree with the pattern it is drawing: one scanline
     * is 1/nSL of the picture's height by construction, one grille column 1/nCOL of its width. */
    sweepH: state.sweepSL / RN.sl,
    dotRY:  state.dotH    / RN.sl,
    dotRX:  state.dotW    / RN.col,
    /* PX -> suv, ONCE, HERE. The three tip distances are specified in CSS pixels because that is the only unit
     * a radius or a displacement means anything in; suv runs 0..1 over the picture, so a CSS pixel is
     * 1/cssPx.h of it. Same conversion, same reason, as the scanline width and the frame's own width. */
    hsweep: state.hsweepSec > 0 ? 1 / state.hsweepSec : 0,
    sweepSol: state.sweepSol,
    sweepDip: state.sweepDip, dipFall: state.dipFall, sweepWhite: state.sweepWhite,
    /* THE BEAM'S OWN MISCONVERGENCE, OVER THE RASTER SCALE. The tip's split (uTipRGBX/Y) and the beam's
     * convergence error are already measured in grille columns and scanlines, so they followed the raster the
     * moment it started scaling; this one was still a flat screen distance and was the last RGB fringe on the
     * picture that did not shrink with the type it sits across. */
    sweepRGB: state.sweepRGB / RN.k / Math.max(1, cssPx.h),
    /* NO dotR. It was `state.dotR / cssPx.h` -- and there is no dotR: not in defaultPreset, not a row on the
     * panel, and no uDotR for it to arrive at (the shader declares uDotRX and uDotRY, which are fed from dotH
     * and dotW in raster units). So this computed undefined/height = NaN, every frame, into a bag entry
     * nothing reads. Harmless only because the uniform it was aimed at does not exist. crt-sidebar.js still
     * carries a `dotR` formatter with no row to format; left alone, since it is that file's to remove. */
    dotLvl:   state.dotNits / 100,                       // nits -> the emission scale uBright is on
    sweepStep: state.sweepStep / RN.sl,
    dotHalo:   state.dotHaloNits / 100,
    /* COLUMNS -> suv x and SCANLINES -> suv y, the units TIP WIDTH and TIP HEIGHT are in -- so a split of
     * one is one cell of misconvergence on that axis, whichever axis you are reading. */
    tipRGBX:   state.tipRGBc / RN.col,
    tipRGBY:   state.tipRGBr / RN.sl,
    // COLUMNS -> suv x, the unit the CONVERGENCE section's own error would be in if it were raster-based.
    beamConv:  state.beamConvC / RN.col,
    dipNoise:  state.dipNoise, pullInk: state.pullInk,
    /* THE TUBES' SURFACE AND THEIR SUPPLY. The mains phase is wrapped HERE, in doubles, because the
     * shader cannot: a 100Hz cosine of wall-clock seconds is an argument in the millions by the time
