<script type="module">
import { faceProfile, faceShaped } from './crt-projection.js';
import { guideOutline, shapeRatio, axisWeight } from './crt-geometry.js';
import { curvedGridPaths } from './crt-grid.js';
import { PH, hexRgb, kelvinRgb } from './crt-phosphor.js';
import { bezelCols } from './crt-bezel.js';
import { bootLines } from './crt-terminal.js';
import { createFlicker } from './crt-flicker.js';
import { createPower } from './crt-power.js';
import { createMagnet } from './crt-magnet.js';
import { createSurge } from './crt-surge.js';
import { createRenderer, buildFaceLUT, buildOutlineLUT, toLinear } from './crt-gl.js';
import { defaultPreset } from './crt-presets.js';
import { makeFmt, SECTIONS } from './crt-sidebar.js';
// The one thing this lab takes from the shared kit: Escape leaves, the way the back button does.
import { escapeLeaves, labReady, mountLoader, persist } from '../kit/lab.js';
import { createPanel, buildActions, mountPanelToggle } from '../kit/panel.js';

let shownOnce = false;
mountLoader();
escapeLeaves();

const canvas = document.getElementById('tube');
// A FACTORY, because it holds machine phase -- two instruments on one page cannot share each other's state.
const FLK = createFlicker();
// NOT const: the renderer is rebuilt from scratch after a lost context. See the handlers beside resize().
let R = createRenderer(canvas);
if (!R) { document.getElementById('hud').textContent = 'needs WebGL2 + EXT_color_buffer_half_float'; throw 0; }

/* The active phosphor: crt-phosphor.PH carries amber/green/white presets (plus a custom swatch), each with its
 * own fg/hi/glow. The shader takes them as uniforms and bootLines colors its two-tone text from the same pair. */
let phName = 'amber';
let ph = PH[phName];

/* Caches a value keyed by its own inputs, so an expensive rebuild (color parsing, kelvin lookups, toLinear's
 * Math.pow per channel) runs only when TEMP/FRAME/POWER/LIGHT actually change, not every frame at 60fps. */
const memo = (key, build) => { const box = { k: null, v: null };
  const f = (...a) => { const kk = key(...a); if (kk !== box.k) { box.k = kk; box.v = build(...a); }
                        return box.v; };
  f.box = box; return f; };

/* Temperatures are passed as arguments, not read from state, because a surge drags the arc cold: the caller
 * hands over the surge-shifted pair while the sliders keep their own values, and the memo key still catches it. */
const pal = memo((tA, tB) => phName + '|' + tA + '|' + tB, (tA, tB) => ({
  ink:     toLinear(hexRgb(ph.fg)),
  hi:      toLinear(hexRgb(ph.hi)),
  halo:    toLinear(ph.glow.split(',').map(Number)),
  // Each lamp keeps its own color, plus their average for parts that see the fitting as one source; averaged
  // in linear light, the only space where adding two colors together is meaningful.
  lampA:   toLinear(kelvinRgb(tA).split(',').map(Number)),
  lampB:   toLinear(kelvinRgb(tB).split(',').map(Number)),
  lamp:    toLinear(kelvinRgb(tA).split(',').map(Number))
             .map((v, i) => (v + toLinear(kelvinRgb(tB).split(',').map(Number))[i]) * 0.5),
}));

// Scan-pattern inks are fixed, not controlled -- black for horizontal, warm #2a1608 for vertical; see crt/README.md.
const GRILLE_INK = toLinear(hexRgb('#2a1608'));

/* The molding's colors, via crt-bezel with this panel's own control names (fcol/ftint/fglow/fwid) so the same
 * model drives it as the DOM build's frame did. Takes the fault's temperature too, since the molding is plastic
 * lit by the fixture and cools with it; kept in the memo key so nothing rebuilds while the fault is quiet. */
const bez = memo(
  (tA, tB) => state.power + '|' + state.lightOn + '|' + (tA + tB) + '|' +
        state.frameCol + '|' + view.frameW,
  (tA, tB) => {
  // frameW is a fraction of the aperture radius; bezelCols wants px (it uses fwid only as a ratio), so scale
  // by the glass half-height first, or the shader and bezelCols draw the same frame at two disagreeing widths.
  // crt-bezel models the room as one light source, so it gets the lamps' mean rather than either one's own color.
  const b = bezelCols({ power: state.power ? 'on' : 'off', lightOn: !!state.lightOn,
                        temp: (tA + tB) * 0.5,
                        fcol: state.frameCol, ftint: 0,   // the flat tint is gone -- see crt-gl
                        // FRAME LIGHT's slider is gone; SCREEN GLOW and LIGHT FIXTURE now say where the
                        // molding's light comes from. 50 is bezelCols' own neutral value.
                        fglow: 50,
                        fwid: Math.max(1, Math.round(view.frameW)),
                        ldim: 1 }, ph);
  return {
    bzBase: toLinear(hexRgb(b.base)), bzLo: toLinear(hexRgb(b.lo)), bzHi: toLinear(hexRgb(b.hi)),
    bzTint: toLinear(hexRgb(b.tint === 'rgba(0,0,0,0)' ? '#000000' : b.tint)),
    bzTintOp: parseFloat(b.tintOp) || 0,
    /* The lit lip is a fixed physical size (a chamfer, a couple mm), not a fixed share of the frame -- bezelCols'
     * own 0.42w/(w+7) formula grows it with width, which reads washed out on wide frames. 3.5/frameW calibrates
     * the lip back to bezelCols' original size at the reference's own frame width. */
    bzInner: Math.min(0.6, Math.max(0.06, 3.5 / Math.max(1, view.frameW))),
  };
});

const state = defaultPreset(R.gpu);

/* SAVE_KEY stays `crtgl` -- an address, not a name. Renaming it silently orphans every visitor's saved settings
 * (the shipped defaults are themselves a real saved configuration, so the loss wouldn't even show on screen).
 * A version mismatch DISCARDS rather than migrates: a migration path written before anything needs migrating
 * is a guess that has to be maintained forever. */
const MM_PER_UNIT = 900;   // mm of room across one glass half-height -- see the note in state
const SAVE_KEY = 'crtgl', SAVE_V = 11;   // an address, not a name — see the note above before changing it

/* Shared kit store, not a private one: clamps every restored value against SECTIONS so a stale blob can't put a
 * slider thumb somewhere the readout disagrees with. `extra` covers every key in state, since this lab has more
 * settings (phosphor name, swatch, frame color, per-section masters) than it has slider rows. */
const store = persist({ key: SAVE_KEY, version: SAVE_V, state, sections: SECTIONS, extra: Object.keys(state) });
store.restore();
const queueSave = store.queueSave;

/* Power sequence, magnet and mains fault are pure time-driven generators with no DOM, the same shape crt-flicker
 * already had. Each is a factory since it holds its own phase and two instruments on one page can't share a
 * clock. */
const PWR = createPower(!!state.power);
const MAG = createMagnet();
const SRG = createSurge(FLK);

/* Two typewriter deadlines, checked in the frame loop rather than set as timers: a backgrounded tab renders
 * nothing here, so a timer would advance the boot text against a screen nobody draws. Absolute performance.now()
 * stamps; 0 means no deadline. */
let typeAt = 0, wipeAt = 0;

// state.power flips instantly on click (feeding crt-bezel's tone); the animation PHASE is separate and unsaved,
// so a reload never restores mid-collapse.

// Starts the strike; typing begins WARM-UP + 0.5s after, so the tube looks like it's warming up before it types.
function powerOn() {
  const now = performance.now();
  state.power = 1;
  PWR.strike(now);
  // Wiped on the way up as well as down, for a switch that comes back before the collapse's own wipe was due.
  typed = 0; wipeAt = 0;
  typeAt = now + state.ignite * 1000 + 500;
  syncMode();
}

// Text wipes AFTER the collapse finishes, not on the click -- wiping immediately would play the collapse over a blank screen.
function powerOff() {
  const now = performance.now();
  state.power = 0;
  PWR.collapse(now);
  typeAt = 0; wipeAt = now + state.collapse * 1000 + 60;
  syncMode();
}

function togglePower() { if (state.power) powerOff(); else powerOn(); }

// What the magnet cannot know for itself. Rebuilt per sample; every term is already read per frame.
const magEnv = () => ({
  face: view.face,
  aspect: cssPx.w / Math.max(1, cssPx.h),
  rgbScale: 1 / rasterScale() / Math.max(1, cssPx.w),
});

const triggerWarp = (now) => MAG.trigger(now);
const warpAt = (now) => MAG.at(now, state, magEnv());
const triggerSurge = (now) => SRG.trigger(now);
const surgeNow = (now) => SRG.at(now, state);
const poseFor = (now) => PWR.at(now, state);
const powerNow = (now) => PWR.advance(now, state);

// The masthead's second line, naming the mode rather than a setting -- the lab's own modeName.
const modeEl = document.querySelector('#mast .s');
function syncMode() { if (modeEl) modeEl.textContent = state.power ? 'TERMINAL' : 'POWERED DOWN'; }
syncMode();   // a session restored with the switch off has to say so before anything is pressed

document.getElementById('gpu').innerHTML =
  (R.gpu.integrated ? 'INTEGRATED' : 'DISCRETE') + ' · ' +
  String(R.gpu.name || '?').replace(/^ANGLE \(|\)$/g, '').slice(0, 44);

/* Content layer: a 2D canvas rasterized once as a texture, so typing a character re-rasters this canvas rather
 * than invalidating the WebGL blend stack the way live SVG text did. Drawn in white; the shader applies phosphor
 * color. */
const cc = document.createElement('canvas');
const ctx = cc.getContext('2d');
// Boot text comes from crt-terminal's bootLines(): masthead, four self-test rows with dot leaders sized to the
// column, and the ENTER prompt, pre-split into label (ph.fg) and value (ph.hi) segments for the two-tone color.
let LINES = [], typed = 0, lastType = 0, FULL = 0, lastCols = 0;

/* Font advance ratio, measured rather than hardcoded and NOT cached until the webfont has actually loaded --
 * caching the pre-load fallback (0.535) would pin every glyph ~3% off the column grid for the rest of the
 * session. */
let _adv = 0, _advCx = null;
function advRatio() {
  if (_adv) return _adv;
  try {
    const ready = !document.fonts || document.fonts.check('100px "JetBrains Mono"');
    const cx = (_advCx || (_advCx = document.createElement('canvas').getContext('2d')));
    cx.font = '100px "JetBrains Mono", monospace';
    const w = cx.measureText('MMMMMMMMMM').width / 1000;
    if (w > 0.2 && w < 2) { if (ready) _adv = w; return w; }
  } catch (e) {}
  return 0.6;
}

// Row height is in SCANLINES and char width in GRILLE COLUMNS -- computed from cssPx, the same counts the
// shader rasters with, so the type sits on the scan lattice and resizes with SCANLINES H rather than floating free.
const TEXT_COLS_MIN = 40;    // narrow-display floor: below this width the density scales up so columns can't collapse
const SCANLINES_MIN = 100;   // the desktop raster's own line count (scan=10/100px on a ~1000px stage), held onto when short
const RASTER_K_MAX = 6;      // caps how far a pathologically narrow viewport can scale the raster up
/* Shared breakpoint with the panel's own (mountPanelToggle) and with panel.css's media query -- a stylesheet
 * can't read this file, so all three must be kept in step by hand. Two numbers, not one, because a phone on its
 * side is 852x393 -- wide enough to pass any width test alone -- so height must be checked too. */
const NARROW_W = 820;
const SHORT_H  = 500;

// Whether the stage has room for what was authored; syncView and rasterScale must agree on this, or the tube
// renders with one set of settings and gets measured with another.
function roomy() { return cssPx.w > NARROW_W && cssPx.h > SHORT_H; }

/* Narrow-display replacements (qualitative changes, not ratios -- those are computed elsewhere):
 * frameOn 0 -- the molding is a fixed CSS-px border, too big a share of a phone's picture.
 * famp 1.4 -- DEPTH's curve compression costs more room on a small screen, but never zero (a flat tube isn't the
 * point).
 * grings 14 -- CURVE AREA, widening the band so the bend stays confined to the outer band.
 * Read every key here through `view`, never `state` -- these appear in three memo keys (face LUT, calibration
 * overlay, bezel), and a key still reading `state` would miss when an override actually took effect. */
const NARROW_OVERRIDES = { frameOn: 0, famp: 1.4, grings: 14 };

/* `state` is the operator's own saved configuration; `view` applies NARROW_OVERRIDES on top of a copy when the
 * display is small, so a desktop session isn't overwritten just because the page was once opened on a phone. On
 * a roomy display view === state by identity. Mutated in place (~150 keys) rather than spread fresh, since this
 * runs on the frame path. */
const _view = {};
let view = state;
function syncView() {
  if (roomy()) { view = state; return; }
  for (const k in state) _view[k] = state[k];
  Object.assign(_view, NARROW_OVERRIDES);
  view = _view;
}

/* Small-display raster scale. Without it the glyph em is pinned to an absolute screen size, so a phone gets the
 * desktop's type on a fifth of the width -- the pitch should be what varies while the line count stays fixed,
 * the way a real CRT's line count is fixed and its pitch follows the tube size. Closed-form: cpc (grille columns
 * per char) and cell/gap (scanlines) don't depend on k, so solving for k directly works. Checks both axes, since
 * a phone on its side is wide enough to pass a column-only test. Never below 1 -- this only sharpens a cramped
 * display, never coarsens a roomy one. */
function rasterScale() {
  const s = state;
  if (roomy()) return 1;                         // room for what was authored: exactly that, always
  const scan = Math.max(0.001, s.scan), grille = Math.max(0.001, s.grille);
  const cpc = s.tcols < 1
    ? Math.max(1, Math.round(advRatio() * s.tcell * grille / scan))
    : s.tcols;
  const blockW = s.tw < 1 ? cssPx.w : cssPx.w * s.tw / 100;
  const kCols  = blockW > 0 ? TEXT_COLS_MIN * cpc * 100 / (blockW * grille) : 1;
  const kLines = SCANLINES_MIN * 100 / (cssPx.h * scan);
  return Math.min(RASTER_K_MAX, Math.max(1, kCols, kLines));
}

// Raster line/column counts, computed once here rather than the eleven separate places (beam height, tip
// radii, convergence error, sweep step) that used to inline this and could drift out of the same scale.
function rasterN() {
  const k = rasterScale();
  return { k: k,
           sl:  Math.max(1, cssPx.h * state.scan   * k / 100),
           col: Math.max(1, cssPx.w * state.grille * k / 100) };
}

// The cell grid in content pixels: one place computing row height (scanlines) and char width (grille columns),
// so wrap, glyph placement and AUTO sizing can't disagree about what a row is.
function textGrid() {
  const W = contentPx.w, H = contentPx.h;
  const R = rasterN();
  const nSL = R.sl, nCOL = R.col;
  const cell = Math.min(nSL, state.tcell);
  const gap  = Math.max(0, Math.min(nSL - cell, state.tgap));
  const colW = W / nCOL;
  const em    = cell / nSL * H;             // the glyph's em box: `cell` scanlines tall
  const pitch = (cell + gap) / nSL * H;     // row to row -- a whole number of scanlines, so every row shares a phase
  const cols  = state.tcols < 1 ? Math.max(1, Math.round(advRatio() * em / colW)) : state.tcols;
  return { W: W, H: H, em: em, pitch: pitch, colW: colW, slPx: H / nSL, charW: cols * colW, nSL: nSL, nCOL: nCOL };
}

/* Wraps on whitespace, falling back to a hard break only when a single word exceeds the whole column budget --
 * breaking at the column limit otherwise splits words mid-token. Segments (and their colors) survive the wrap
 * intact and in order, which is what lets the flat `typed` counter walk the wrapped rows with no separate
 * mapping. */
function wrapLines(lines, cols) {
  const out = [], per = Math.max(1, cols);
  lines.forEach((segs) => {
    let row = [], used = 0;
    // Guards against firing flush twice for one boundary token, which would push a spurious blank row that
    // the AUTO height then pays a whole pitch for.
    const flush = () => { if (!row.length) return; out.push(row); row = []; used = 0; };
    const put = (t, c) => { row.push({ t: t, c: c }); used += t.length; };
    if (!segs.length) { out.push([]); return; }   // a deliberately empty line is content, and keeps its row
    segs.forEach((sg) => {
      const toks = sg.t.match(/\S+\s*|\s+/g) || [];
      toks.forEach((tok) => {
        if (used + tok.replace(/\s+$/, '').length > per && used > 0) flush();
        let t = tok;
        /* The take is captured BEFORE `put` spends it: `put` advances `used`, so a `per - used` evaluated after
         * would always read zero and hang with no error. Only reached when one token exceeds the whole column
         * budget; floored at 1 so the loop still advances if `used` already equals `per`. */
        while (t.length > per) {
          const take = Math.max(1, per - used);
          put(t.slice(0, take), sg.c); t = t.slice(take); flush();
        }
        if (t.length) put(t, sg.c);
        if (used >= per) flush();
      });
    });
    flush();
  });
  return out;
}

// Uploaded only when the content actually changed (typed count or caret blink phase) -- a full texImage2D
// upload every frame for text that rarely moves would be hundreds of MB/s wasted, worse on shared-memory GPUs.
let lastContentKey = '';
let textRect = [-1, -1, -1, -1];   // the active block, in content-canvas fractions
// True while the tube is lit but hasn't started typing -- a terminal isn't blank in that gap, it's idling with
// a cursor showing, the same as a real set on strike.
const caretWaiting = () => !!(state.power && typed === 0 && typeAt && performance.now() < typeAt);
// Re-rasters the boot text onto the content canvas and uploads it, but only when the key below actually changed.
function drawContent(force) {
  const g = textGrid();
  // bootLines needs the column budget to place its dot leaders and value column; rebuilt only when the count
  // moves, and `typed` is clamped since it indexes flatly into the new layout.
  const blockW = state.tw < 1 ? g.W : g.W * state.tw / 100;
  const cols = Math.max(1, Math.floor(blockW / g.charW));
  if (cols !== lastCols) {
    lastCols = cols;
    LINES = bootLines(ph, cols);
    FULL = LINES.reduce((a, segs) => a + segs.reduce((b, s) => b + s.t.length, 0), 0);
    typed = Math.min(typed, FULL);
  }
  // Blink phase only enters the key when a caret is actually shown -- otherwise a powered-off tube re-uploaded
  // a ~7MB texture twice a second for a cursor that isn't drawn.
  const waiting  = caretWaiting();
  const caretOn  = typed > 0 || waiting;
  const key = typed + '|' + (waiting ? 'w' : '') +
              (caretOn ? Math.floor(performance.now() / 420) % 2 : 0) + '|' +
              state.tox + '|' + state.toy + '|' + state.tvert + '|' + state.tjust + '|' +
              state.tw + '|' + state.tht + '|' + cols + '|' +
              g.em.toFixed(3) + '|' + g.pitch.toFixed(3) + '|' + g.charW.toFixed(3) + '|' +
              contentPx.w + 'x' + contentPx.h;
  if (!force && key === lastContentKey) return;
  lastContentKey = key;
  // Sized from the render target, not fixed -- see the note where contentPx is computed.
  const w = g.W, h = g.H;
  if (cc.width !== w || cc.height !== h) { cc.width = w; cc.height = h; }
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
  ctx.font = '500 ' + g.em.toFixed(2) + 'px "JetBrains Mono", monospace';
  ctx.textBaseline = 'alphabetic';

  // Only rows revealed so far, built once here so height, draw and bounds all walk the same list rather than
  // three separate lists that could disagree.
  const rows = wrapLines(LINES, cols);
  const shown = [];
  for (let r = 0, n = typed; r < rows.length && n > 0; r++) {
    const len = rows[r].reduce((a, sg) => a + sg.t.length, 0);
    shown.push({ segs: rows[r], n: Math.min(len, n), len: len, part: n < len });
    n -= len;
  }
  /* The waiting cursor is modeled as a row with zero characters typed, so the same ANCHOR/ALIGN geometry that
   * places real text also places it -- a separately positioned cursor would jump the instant the first
   * character landed, having disagreed with this geometry the whole time. */
  if (!shown.length && waiting && rows.length) {
    shown.push({ segs: rows[0], n: 0, part: true,
                 len: rows[0].reduce((a, sg) => a + sg.t.length, 0) });
  }

  // Block centers on TEXT X/Y (matching the reference's own layout) so ALIGN only affects the ragged edge
  // inside it. AUTO width uses the FINISHED text's widest row, not what's typed so far, or the block would
  // slide sideways as longer lines arrive.
  const wide = rows.reduce((m, r) => Math.max(m, r.reduce((a, sg) => a + sg.t.length, 0)), 0);
  // Reuses `cols` (already floor(tw/charW)) rather than the raw percentage, so the block is a whole number of
  // cells and CENTER/RIGHT don't align against a half-character partial cell.
  const bw = (state.tw  < 1 ? wide : cols) * g.charW;
  const bh =  state.tht < 1 ? shown.length * g.pitch : g.H * state.tht / 100;
  const bx = g.W * (0.5 + state.tox / 100) - bw / 2;
  const by = g.H * (0.5 + state.toy / 100) - bh / 2;

  // ANCHOR picks which block edge is nailed down (BOTTOM grows up, TOP grows down); ALIGN only affects the
  // other axis. Snapped to the scanline lattice after -- without it the block floats at an arbitrary
  // sub-scanline phase that shifts on every resize.
  const align = state.tjust === 2 ? 1 : state.tjust === 1 ? 0.5 : 0;
  let y0 = state.tvert ? by : by + Math.max(0, bh - shown.length * g.pitch);
  y0 = Math.round(y0 / g.slPx) * g.slPx;

  // Block bounds recorded here, from the known text metrics -- the phosphor glow uniform needs this rectangle,
  // and recovering it later by blurring pixels would be a guess.
  let bx0 = 1e9, by0 = 1e9, bx1 = -1e9, by1 = -1e9;
  for (let k = 0; k < shown.length; k++) {
    const row = shown[k];
    const y = y0 + k * g.pitch, yb = y + g.em * 0.78;    // the baseline, inside the cell
    let x0 = bx + (bw - row.len * g.charW) * align;
    x0 = Math.round(x0 / g.colW) * g.colW;
    // Placed one character per cell rather than drawn as a run -- a run advances by font metrics, but each
    // glyph must land exactly on a grille column. Color still comes per-segment for the label/value two-tone.
    let col = 0, left = row.n, caretC = '#fff';
    for (const sg of row.segs) {
      if (left <= 0) break;
      const t = sg.t.slice(0, Math.min(sg.t.length, left));
      ctx.fillStyle = caretC = sg.c;
      for (let i = 0; i < t.length; i++) {
        if (t[i] !== ' ') ctx.fillText(t[i], x0 + (col + i) * g.charW, yb);
      }
      col += sg.t.length; left -= t.length;
    }
    if (row.len) {
      bx0 = Math.min(bx0, x0); bx1 = Math.max(bx1, x0 + (row.part ? row.n : row.len) * g.charW);
      by0 = Math.min(by0, y);  by1 = Math.max(by1, y + g.em);
    }
    // Caret sits where the next character would go: mid-line while a row is half-typed, or one cell past the
    // end once the boot has finished -- gating on `row.part` alone would vanish it exactly when the terminal
    // is waiting for input, which is the moment it's most needed.
    const lastRow  = (k === shown.length - 1);
    const caretCol = row.part ? row.n : row.len + 1;   // one cell past the end when resting, on the typing point mid-line
    if ((row.part || (lastRow && typed >= FULL)) && Math.floor(performance.now() / 420) % 2) {
      // Uses ph.hi outright rather than the last-painted segment color, which could leave the caret dimmer
      // than the text beside it. Half a cell wide so it reads as a cursor, not a selected glyph.
      ctx.fillStyle = ph.hi;
      ctx.fillRect(x0 + caretCol * g.charW, y, g.charW * 0.5, g.em);
    }
  }
  // Normalized to content-canvas space (empty until something's typed) with Y flipped: canvas y grows
  // downward, but uploadContent's UNPACK_FLIP_Y_WEBGL makes v=0 the canvas bottom. Unflipped, the glow
  // measured 55 at the top row and 6 at the bottom -- exactly inverted.
  if (bx1 > bx0) textRect = [bx0 / w, 1 - by1 / h, bx1 / w, 1 - by0 / h];
  else textRect = [-1, -1, -1, -1];
  R.uploadContent(cc);
}

// Rebuilds the face LUT and outline LUT only when their own inputs move -- both are gathering tables the
// shader samples, expensive to build and wrong to rebuild every frame.
let faceKey = '', outKey = '';
function syncLUT() {
  const fk = [view.face, view.grings, state.fexp, view.famp].join('|');
  if (fk !== faceKey) {
    faceKey = fk;
    // crt-projection's faceProfile stays the authority; this only tabulates it. fadeSpan = grings*(2/GRIDN),
    // GRIDN=40, matching the DC's own math (FULL is 1.0, not 0.85).
    faceProf = faceProfile(view.face * 90, view.grings * 0.05, state.fexp, view.famp);
    faceLUT = buildFaceLUT(faceProf, 1024);
    R.setFaceLUT(faceLUT);
  }
  // The outline LUT likewise, keyed on aspect too since guideOutline needs the real box to return radii in
  // the shader's own units.
  const asp = (canvas.width || 1) / (canvas.height || 1);
  const ok = state.corner + '|' + state.bend + '|' + asp.toFixed(4);
  if (ok !== outKey) {
    outKey = ok;
    R.setOutlineLUT(buildOutlineLUT(guideOutline(2 * asp, 2, state.corner / 0.9, state.bend), 1024));
  }
}

/* Calibration overlay, rebuilt only when its geometry inputs move. Walks the same guideOutline/faceShaped the
 * tube's own face LUT comes from, so the instrument can't drift into disagreeing with what it's measuring. */
const calSvg = document.getElementById('cal');
let calKey = '';
function syncCal() {
  const asp = (canvas.width || 1) / (canvas.height || 1);
  const k = [view.face, state.corner, state.bend, view.grings, state.fexp, state.guidesOn,
             state.gridOn, state.debugOn, view.famp, view.frameOn, view.frameW, cssPx.h,
             asp.toFixed(4)].join('|');
  if (k === calKey) return;
  calKey = k;

  const w = 2 * asp, H = 2;
  const prof = guideOutline(w, H, state.corner / 0.9, state.bend);
  /* Uses faceShaped (not faceF) and pins it the same way the picture is gathered -- F(u)/F(1) -- or the overlay
   * stops short of the glass wherever F(1) < 1. Pinned on .pin (the un-bowed axis value), not f(1,0): dividing
   * by the bowed value would normalize away BEND's bow exactly where it's strongest. */
  // guideOutline's tables cover one quadrant only; shapeRatio/axisWeight fold theta into it first so the lookup
  // can't run off the table in the other three quadrants (the shader folds separately in aperture(), which is
  // why the calibration grid needed this fix even though the picture itself never had the bug).
  const fRaw = faceShaped(view.face * 90, view.grings * 0.05,
                          { rho: (th) => shapeRatio(prof, th), bow: (th) => axisWeight(prof, th),
                            bend: state.bend / 100 }, state.fexp, view.famp);
  const pinK = fRaw ? (fRaw.pin == null ? fRaw(1, 0) : fRaw.pin) : 1;
  const kk = pinK > 0.01 ? pinK : 1;
  const fF = fRaw ? ((u, th) => fRaw(u, th) / kk) : null;

  /* The overlay must scale into the same shrunk space the shader draws in -- the molding shrinks the glass by
   * 1/(1+WIDTH), so an SVG drawn into a fixed viewBox would otherwise keep plotting the tube at its unshrunken
   * size. Scaled about the viewBox center; MUST match the shader's uFrameFit expression exactly, not a second
   * one that happens to agree today -- see where uFrameFit is uploaded. */
  const fitW = view.frameW / Math.max(1, cssPx.h / 2);
  const fit = view.frameOn ? 1 / Math.max(0.35, 1 - fitW) : 1;
  const toVB = ([x, y]) => (50 + x / w * 100).toFixed(3) + ',' + (50 + y / H * 100).toFixed(3);
  // One rim description (guideOutline's points) feeds the clip path, the guide stroke and the shader's own
  // aperture table.
  const glassD = 'M' + prof.pts.map(toVB).join('L') + 'Z';
  let out = '';

  if (state.debugOn && state.guidesOn) {
    // Dashed blue rim (#7fd0ff) and red crosshairs (#ff3c3c) read as an instrument overlay; a dim amber line
    // looked like a rim highlight the tube itself was drawing.
    out += '<path d="' + glassD + '" fill="none" stroke="#7fd0ff" ' +
           'stroke-width="1.2" stroke-dasharray="6 4" opacity="0.9" vector-effect="non-scaling-stroke"/>';
    // The axes are a property of the GLASS, so they stop at its rim rather than running out over the molding.
    out += '<defs><clipPath id="glassclipx" clipPathUnits="userSpaceOnUse">' +
           '<path d="' + glassD + '"/></clipPath></defs>' +
           '<path clip-path="url(#glassclipx)" d="M0,50H100M50,0V100" fill="none" stroke="#ff3c3c" ' +
           'stroke-width="1" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>';
  }
  // No ring bands: ringLadder's 20-annulus sampling was the DOM build's best approximation of a field this
  // shader can read directly per-pixel via its inverse-map lookup (see the elevation note in crt-gl.js).

  if (state.debugOn && state.gridOn) {
    // 192 samples/line: a polyline's chording error goes as the square of the step and concentrates at highest
    // curvature -- at 48 samples the corners were an order of magnitude worse than the axes, reading as the
    // grid failing to round its own corners rather than the projection failing to bend them.
    // Clipped to the glass (the same guideOutline points as the blue guide and the shader's own aperture
    // table), since the rectangular lattice's corners would otherwise fall outside the squircle and draw over
    // the molding.
    const g = curvedGridPaths(w, H, 40, fF, 192);
    out += '<defs><clipPath id="glassclip" clipPathUnits="userSpaceOnUse">' +
           '<path d="' + glassD + '"/></clipPath></defs><g clip-path="url(#glassclip)">';
    g.lines.forEach((d) => {
      out += '<path d="' + d + '" fill="none" stroke="#ffb454" stroke-opacity="0.12" ' +
             'stroke-width="1" vector-effect="non-scaling-stroke"/>';
    });
    out += '</g>';
  }
  // One group transform on the whole overlay rather than threading the scale through toVB, which the grid's
  // own coordinates (from curvedGridPaths/radialMap) never pass through and would leave unscaled.
  // non-scaling-stroke keeps stroke widths honest through it; identity when the frame is off.
  calSvg.innerHTML = fit === 1 ? out
    : '<g transform="translate(50,50) scale(' + (1 / fit).toFixed(5) + ') translate(-50,-50)">' + out + '</g>';
}

// Every control's readout states its unit ("27 deg", not "27") via fmt() per row. SQUIRCLE runs to 90 because
// guideOutline's exponent hits exactly 2 -- a circle -- there.
/* BEND stays a percentage rather than degrees: the arc it sweeps depends on the shape being bowed (SQUIRCLE) and
 * on the window size, so a degree readout would change meaning whenever another control moved, and could show
 * a figure the glass can't actually reach past what the bow can produce. */

let faceLUT = { u: null, r1: 1, rimK: 1 };
let faceProf = null;   // kept so the elevation overlay and content-canvas sizing can read the pin/sag
// CSS pixels, not device pixels -- the mask density is specified in CSS px (see scanN below), and using device
// pixels made the pattern 1.5x finer than the reference at the same PPI.
const cssPx = { w: 1600, h: 1100 };
// Render-target pixels per CSS pixel: dpr * renderScale. The mask's width is specified in CSS px.
let pxScale = 1;
// Declared here (not near resize(), its natural home) because panel formatters call textGrid(), which reads
// this before resize() runs -- moving it below would throw "Cannot access 'contentPx' before initialization"
// at boot, the same TDZ trap cssPx hit.
const contentPx = { w: 1600, h: 1100 };

const FMT = makeFmt({ state, cssPx, textGrid });
const host = document.getElementById('controls');
/* Uses the shared kit's panel (../kit/panel.js), not a local one. (key, kind) are passed explicitly rather than
 * having the builder reach into page state: a color always invalidates the bezel memo, and RENDER SCALE is the
 * one control that reallocates the buffer. The fold map is read live via state.secClosed rather than passed by
 * reference -- handing over the object would let the panel fold on screen while nothing reaches storage. */
createPanel({
  host, state, sections: SECTIONS, fmt: FMT,
  onChange(key, kind) {
    if (kind === 'color') bez.box.k = null;
    queueSave();
    if (key === 'renderScale') resize();
  },
});

/* LIGHT is FIXTURE's own master (like DEBUG for its section and FRAME for its own), so the section collapses
 * with it; POWER stays outside that pattern since it's the tube itself, not one section's setting.
 * The lit state is asked for via a predicate, not tracked: POWER reads state.power; WARP needs a beam to bend
 * so it never lights with the tube dark, while SURGE is the room's supply failing and fires whether or not the
 * tube is on. */
/* Fullscreen button omitted where requestFullscreen doesn't exist (iPhone Safari; iPad has it) -- an
 * unconditional button would visibly do nothing on the device most needing the space. Home-screen launch (see
 * the meta tags above) covers iOS instead. Not debounced and no manual resize() after: entering/leaving
 * fullscreen fires a real window resize the settle handler above already answers. */
const canFullscreen = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
const inFullscreen = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function toggleFullscreen() {
  const el = document.documentElement;
  if (inFullscreen()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (el.requestFullscreen || el.webkitRequestFullscreen).call(el).catch(() => {});
}

const ACTIONS = [
  ['\u23fb POWER', togglePower, () => !!state.power],
  ['\u223f WARP',  () => { if (state.power) triggerWarp(performance.now()); }],
  ['\u2301 SURGE', () => triggerSurge(performance.now())],
];
// Appended rather than written into the literal above, so the three instrument actions stay one list.
if (canFullscreen) ACTIONS.push(['\u26f6 FULL', toggleFullscreen, inFullscreen]);
const abox = document.getElementById('actions');
buildActions(abox, ACTIONS, queueSave);

// Fullscreen's own state changes without a click (Escape, or the promise resolving after the handler returns),
// so it needs its own listener rather than relying on buildActions' click-time re-read of `lit`.
if (canFullscreen) {
  const fsBtn = abox.lastElementChild;
  const syncFs = () => fsBtn.classList.toggle('on', inFullscreen());
  document.addEventListener('fullscreenchange', syncFs);
  document.addEventListener('webkitfullscreenchange', syncFs);
}

// Switching phosphor rebuilds the boot text (its two-tone comes from fg/hi, so it can't just be recolored) and
// invalidates the memoized palette.
const phosRow = document.getElementById('phosrow');
function buildPhosRow() {
  phosRow.innerHTML = '';
  ['amber', 'green', 'white'].forEach((name) => {
    const b = document.createElement('button');
    b.textContent = PH[name].name;
    if (name === phName) b.classList.add('on');
    b.onclick = () => {
      phName = name; ph = PH[name]; state.phName = name; queueSave();
      lastCols = 0;                   // drawContent owns the rebuild; this just invalidates its column memo
      lastContentKey = '';            // force a re-raster: the glyph colors changed
      pal.box.k = null;               // and the palette the shader is handed
      buildPhosRow();
    };
    phosRow.appendChild(b);
  });
  const sw = document.createElement('input');
  sw.type = 'color'; sw.className = 'sw'; sw.value = ph.fg;
  sw.title = 'custom phosphor';
  sw.oninput = () => {
    ph = { fg: sw.value, hi: sw.value, glow: hexRgb(sw.value).join(','), name: 'CUSTOM' };
    phName = 'custom'; state.phName = 'custom'; state.phCustom = sw.value; queueSave();
    lastCols = 0;
    lastContentKey = ''; pal.box.k = null;
    [...phosRow.querySelectorAll('button')].forEach((b) => b.classList.remove('on'));
  };
  phosRow.appendChild(sw);
}
// Restored here rather than in the earlier load block: `ph` isn't in scope yet when state is merged, so this
// just invalidates the memo and lets drawContent rebuild the text.
if (state.phName === 'custom' && typeof state.phCustom === 'string') {
  ph = { fg: state.phCustom, hi: state.phCustom, glow: hexRgb(state.phCustom).join(','), name: 'CUSTOM' };
  phName = 'custom';
} else if (PH[state.phName]) {
  phName = state.phName; ph = PH[phName];
}
lastCols = 0;
lastContentKey = ''; pal.box.k = null;

buildPhosRow();

let rzT = 0;
// Resizes the render target and content canvas together, since both depend on renderScale and the
// narrow-display overrides.
function resize() {
  const r = document.getElementById('stage').getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cssPx.w = Math.max(2, Math.round(r.width));
  cssPx.h = Math.max(2, Math.round(r.height));
  // Must run before anything below reads a setting -- crossing the breakpoint is exactly what changes which
  // values (R.size, the content buffer) apply.
  syncView();
  const w = Math.max(2, Math.round(r.width * dpr * state.renderScale));
  const h = Math.max(2, Math.round(r.height * dpr * state.renderScale));
  pxScale = Math.max(0.1, h / Math.max(1, Math.round(r.height)));
  R.size(w, h);
  /* Content buffer sized from the render target (not fixed 1600x1100) and by the projection's own pin
   * (1/F(1)), so text is never minified then re-magnified through two lossy resamples. 1.08 margin accounts
   * for the projection magnifying the picture's middle; never below 1.08, since a concave face (F(1) > 1)
   * would otherwise shrink the canvas under the target. */
  const pinScale = Math.max(1.08, 1 / Math.max(0.35, faceLUT.r1 || 1));
  contentPx.w = Math.max(256, Math.round(w * pinScale));
  contentPx.h = Math.max(256, Math.round(h * pinScale));
  document.getElementById('scaleinfo').textContent =
    w + '×' + h + ' · ' + (w * h / 1e6).toFixed(2) + ' MP · scale ' + state.renderScale.toFixed(2);
}
// Debounced rather than tracked live -- every resize event would otherwise reallocate four buffers.
window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(resize, 120); });
resize();

/* Mounted after the first resize deliberately: on a narrow screen panel.css already lifted the panel out of
 * flow, so the stage measures full width regardless of the toggle's starting state. Re-sized on every toggle
 * since hiding the sidebar (wide case) genuinely grows the canvas; the narrow case is a no-op through R.size. */
// Reuses NARROW_W/SHORT_H rather than a second breakpoint -- panel folding and raster scaling are the same
// judgment about the display.
mountPanelToggle({ panel: document.getElementById('panel'), breakpoint: NARROW_W, shortSide: SHORT_H,
                   onToggle: () => resize() });

/* A lost WebGL context is a normal event here: this page drives the integrated adapter hard enough that
 * Windows resets the display driver under it, after which every gl call is a silent no-op and the canvas just
 * looks frozen.
 *
 * Three things are required: preventDefault() on the lost event, or 'webglcontextrestored' never fires;
 * restoring REBUILDS the renderer (createRenderer allocates fresh), so every memo that remembers an upload
 * must be cleared; and the status message needs its own span, since writing #hud.textContent replaces
 * #scaleinfo and throws inside resize() before glLost can be cleared.
 *
 * Verified with WEBGL_lose_context: the render fingerprint returns within render-probe.js's documented noise
 * floor. */
let glLost = false;
const glState = document.getElementById('glstate');
canvas.addEventListener('webglcontextlost', (e) => {
  e.preventDefault();
  glLost = true;
  glState.textContent = 'GPU CONTEXT LOST — the display driver reset. Restoring…';
});
canvas.addEventListener('webglcontextrestored', () => {
  R = createRenderer(canvas);
  if (!R) {
    glState.textContent = 'GPU CONTEXT LOST — could not restore. Reload the page.';
    return;
  }
  // Every upload the old context held is gone with it, so each memo that gates one is cleared.
  faceKey = ''; outKey = ''; calKey = ''; lastContentKey = ''; pal.box.k = null;
  resize();
  drawContent(true);
  glLost = false;
  glState.textContent = '';
});

let frames = 0, fpsT = 0;
const fpsEl = document.getElementById('fps');

// Main draw loop: builds this frame's uniform bag from state/pose/flicker/fault and calls R.draw.
function frame(now) {
  // Nothing drawn while the context is lost (every gl call would be a no-op), but the loop keeps running so
  // a restore doesn't need a manual restart.
  if (glLost) { requestAnimationFrame(frame); return; }
  // Refreshed per frame, not just on resize: the panel writes to state, and without this a slider moved on a
  // phone would never reach the override copy the renderer reads.
  syncView();
  const t = now / 1000;
  // Power sequence evaluated first -- both deadlines below read against it, and everything drawn after
  // depends on its pose (see the pose tables in crt-power.js).
  const pwr = powerNow(now);
  const wp  = warpAt(now);
  if (wipeAt && now >= wipeAt) { typed = 0; wipeAt = 0; }
  /* Type speed is in WORDS PER MINUTE (a word = 5 chars, so 350 WPM = 1 char/34.3ms) -- close to the 26ms this
   * was hardcoded at before, but now a labeled unit rather than an unexplained constant. lastType tracks
   * forward while the tube hasn't struck or is off, so the first character lands at the deadline rather than
   * the counter banking the whole warm-up as owed time and dumping a dozen characters onto one frame. The
   * power guard is the lab's own: without it the boot kept running behind a dark screen, invisible only by luck. */
  if (!state.power || (typeAt && now < typeAt)) lastType = now;
  else if (now - lastType > 60000 / (350 * 5 * state.type) && typed < FULL) { typed++; lastType = now; }
  drawContent();   // no-ops unless the typed count or the caret phase moved
  syncLUT();
  syncCal();       // likewise: rebuilds only when a geometry control or the aspect moved

  /* crt-flicker's screenFlicker/bulbFlick are stochastic (random dip depth/duration, per-bulb flux with jitter
   * and a health-driven color strike), not a sine product -- a sine reads as a periodic wobble, not a tube
   * guttering, and its control would be a depth rather than a rate in Hz. Arrive as uniforms so nothing needs
   * CSS invalidation. */
  // pwr.lvl feeds directly into uFlicker rather than a separate uniform, since it IS the phosphor's output
  // this frame -- which is also why the molding's screen-lit terms flash with a strike without being wired
  // for it separately (pwr.lvl > 0 is the flicker engine's own gate: a dead tube does not gutter).
  // Sampled once as `sg` and spent everywhere (screen output, both lamps, health, palette temperature) -- the
  // whole reason a fault reads as the room failing rather than just the screen.
  const sg = surgeNow(now);
  // Guttering scales with `bite` (distance from normal) rather than a flat rate, so it chops hardest through
  // the collapse/cut and stays quiet through the build -- a constant rate would fill in that silence and
  // blunt the flash.
  const bite  = sg ? sg.bite : 0;
  const fHz   = state.flickHz + (state.surgeHz  - state.flickHz) * bite;
  const fStr  = state.fstr    + (state.surgeStr - state.fstr)    * bite;
  const flk = pwr.lvl * FLK.screenFlicker(now, fHz, fStr, pwr.lvl > 0) * (sg ? sg.screen : 1);
  // Gated only on the fitting's switch, not a separate `flickerOn` flag -- that flag has no panel row, so a
  // session with it ever stored as 0 would strand all flicker controls with no way to re-enable them. A 0Hz
  // rate is already the off switch (bulbFlick guards on hz > 0.05).
  const lampOn = !!state.lightOn;
  // Lamps gutter faster under the fault too (same `bite`, so fixture and screen chop in step) -- their own
  // FLICKER rate is just the floor, not what a collapsing supply actually does.
  const lampHz = (hz) => hz + (state.surgeLampHz - hz) * bite;
  const lamp = (id, hz, str, health) =>
    FLK.bulbFlick(now, id, lampHz(hz), str, lampOn, state.lfjit, state.lfchaos, health);
  // Bulbs advanced first since the two reads below come out of the machine they advance. HEALTH passed in is
  // the slider (the tube's condition), not the live sagged value -- feeding the live value back would compound.
  const mA = lamp('A', state.lflickA, state.lfstrA, state.healthA);
  const mB = lamp('B', state.lflickB, state.lfstrB, state.healthB);
  const bA = FLK.bulbState('A') || {}, bB = FLK.bulbState('B') || {};

  /* Color strike snaps (rather than eases) to warmTarget on re-ignition, since an eased shift reads as a fade,
   * not a strike. Signed: positive drops kelvin for a tired pinkish cast, negative raises it for a cold
   * blue-green arc. COLOR STRIKE is a control (not a constant) so the strike's size can read as anything from
   * a minor drift to a lamp visibly misfiring. Quantized to 20K so the palette memo holds across a run of
   * frames instead of rebuilding the whole phosphor/bezel model every strike. */
  const kelvin = (t, warm) => {
    const dK = warm * state.lfwarmK + (sg ? sg.warm * state.surgeWarm : 0);
    return Math.round(Math.min(9000, Math.max(2200, t - dK)) / 20) * 20;
  };
  const tA = kelvin(state.tempA, bA.warm || 0), tB = kelvin(state.tempB, bB.warm || 0);
  /* hmod drops to a new condition on ~1/5 of cycles then recovers halfway each cycle after, reaching the
   * shader as uHealthA so tubeSurface's zonal pattern can dim ends and middle independently -- the difference
   * between a lamp on a dimmer and one that's actually failing. HEALTH DIP scales the excursion depth (WHEN
   * stays the machine's call, HOW FAR is this panel's); at 1 it's the reference's own depth, true but too
   * subtle to see at this size. */
  const lim = (v) => Math.max(0, Math.min(1, v));
  const dip = (m) => 1 - (1 - (m == null ? 1 : m)) * state.lfhdip;
  const hA = lim(state.healthA * dip(bA.hmod) * (sg ? sg.health : 1));
  const hB = lim(state.healthB * dip(bB.hmod) * (sg ? sg.health : 1));
  const p = pal(tA, tB);
  // Resolved once per frame (named RN since R is the renderer) so beam, tip, convergence and text all read
  // the same raster.
  const RN = rasterN();

  R.draw({
    // FIT is the face LUT's own last sample (the scale at s=1, where the raster edge lands) so it comes from
    // the same table the shader gathers through, clamped to OVERSCAN's own slider range.
    time: t,
    overscan: state.overscan,
    face: view.face, corner: state.corner, bend: state.bend,
    /* Line/column counts computed as round(span * density / 100), MEASURED IN CSS PIXELS (picture height for
     * the horizontal pass, width for the vertical) -- device pixels would make the pattern finer on high-DPI
     * displays for the same slider value and get averaged away. The round() keeps pitch = span/round(...)
     * stable as the stage resizes rather than drifting to 100/density. */
    scanN: RN.sl,
    /* scanW converted from CSS px, matching the reference's non-scaling-stroke width-1.0 semantics -- handing
     * the raw CSS number to a shader that measures in render-target pixels drew a 1.74x-thinner line on a
     * 1.74x display. Measured: modulation came out 0.033 against the reference's 0.096 before this conversion. */
    scanW: state.scanw * pxScale, scanA: state.scanop / 100,
    grilleN: RN.col,
    grilleW: state.grillew * pxScale, grilleA: state.grilleop / 100,
    phos: state.phos, bloom: state.bloom, bloomThresh: state.bloomThresh,
    // CSS px -> tap spacing: the blur buffer is w>>2, so 1 texel = 4 render px, and 13 taps at sigma 3 make 1
    // texel of spacing a 12-render-px blur.
    bloomSpread: state.bloomSize * pxScale / 12,
    // No longer *state.power -- that zeroed the content the instant the button was pressed, so the collapse
    // had nothing left to play over. Power is spent once, on the flicker uniform, instead.
    bright: state.bright, beam: state.beam,
    // THE PICTURE'S SURVIVING EXTENT. 1,1 at rest, and the shader's uniform branch tests for exactly that.
    pwr: [pwr.sx, pwr.sy],
    // warpK=0 skips the whole shader branch, so an untriggered magnet costs nothing.
    warpK: wp.k, warpPos: wp.pos, warpR: wp.r, warpD: wp.d,
    vig: state.vig, vigFall: state.vigFall, heat: state.debugOn ? state.heat : 0,
    // GATED ON DEBUG like the guides and the heat map: an inspection view, not a setting.
    fixSolo: state.debugOn ? state.fixSolo : 0,
    // THE SAG, SIGNED, straight from crt-projection -- the overlay must not re-derive it.
    sagA: faceProf ? faceProf.sg * faceProf.A : 0,
    sagU0: faceProf ? faceProf.u0 : 0, sagP: faceProf ? faceProf.p : 2,
    // SECONDS -> RATE, here and nowhere else. 0s is parked, which is a period the shader cannot express.
    sweep: state.sweepSec > 0 ? 1 / state.sweepSec : 0,
    // Gated on phase (not power level) so it also skips the tip's per-pixel branch when the tube is fully
    // off, without losing it mid-collapse while the beam still visibly writes.
    sweepOn: state.beamOn && pwr.lvl > 0 ? state.sweepOn : 0,
    // Converted to suv using the same nSL/nCOL handed to the shader as scanN/grilleN, so the beam can't
    // disagree with the pattern it's drawing.
    sweepH: state.sweepSL / RN.sl,
    dotRY:  state.dotH    / RN.sl,
    dotRX:  state.dotW    / RN.col,
    // CSS px -> suv (0..1 over the picture), same conversion as the scanline and frame widths.
    hsweep: state.hsweepSec > 0 ? 1 / state.hsweepSec : 0,
    sweepSol: state.sweepSol,
    sweepDip: state.sweepDip, dipFall: state.dipFall, sweepWhite: state.sweepWhite,
    // Divided by the raster scale too -- unlike uTipRGBX/Y and the convergence error (already in
    // grille/scanline units), this was the last RGB fringe still a flat screen distance that didn't shrink
    // with the raster.
    sweepRGB: state.sweepRGB / RN.k / Math.max(1, cssPx.h),
    // dotR removed: it computed undefined/height = NaN every frame into a uniform (uDotR) that doesn't exist
    // -- harmless only because nothing read it. crt-sidebar.js still has an orphaned `dotR` formatter.
    dotLvl:   state.dotNits / 100,                       // nits -> the emission scale uBright is on
    sweepStep: state.sweepStep / RN.sl,
    dotHalo:   state.dotHaloNits / 100,
    // TIP WIDTH/HEIGHT are in columns/scanlines, so a value of 1 is one cell of misconvergence on that axis.
    tipRGBX:   state.tipRGBc / RN.col,
    tipRGBY:   state.tipRGBr / RN.sl,
    // COLUMNS -> suv x, the unit the CONVERGENCE section's own error would be in if it were raster-based.
    beamConv:  state.beamConvC / RN.col,
    dipNoise:  state.dipNoise, pullInk: state.pullInk,
    // Mains phase wrapped here in doubles, not in the shader: a 100Hz cosine of wall-clock seconds reaches
    // millions in the argument over a long session, and float32 there would freeze it solid.
    boxVis: state.boxVis, railVis: state.railVis, glowA: state.glowA, glowB: state.glowB, ripple: state.ripple,
    // Parked at 0 when RIPPLE is 0, since sending a live phase that reaches no pixel still changes a uniform
    // every frame -- enough to defeat the fixture pass's input key and re-trace it 60x/s for an identical result.
    mainsPh: state.ripple > 0 ? (t * 100) % 1 : 0,
    beamPull: state.beamPull / Math.max(1, cssPx.h),
    flicker: flk, // px -> content uv, against the stage rather than the render target, so it doesn't change meaning when RENDER SCALE does.
    /* Convergence per gun, px -> content uv against cssPx (not the render target), so it doesn't change
     * meaning when RENDER SCALE moves, and divided by the raster scale (1/k) so a misconvergence stays the
     * same fraction of a glyph rather than the same screen distance -- authored against a desktop glyph, it
     * would otherwise be a quarter of a phone's glyph width instead of a couple percent. convOn off hands
     * over {} so all three guns fall back to the same raster via ||0. */
    conv: !state.convOn ? {} : {
      rx: state.convRX / RN.k / Math.max(1, cssPx.w), ry: state.convRY / RN.k / Math.max(1, cssPx.h),
      gx: state.convGX / RN.k / Math.max(1, cssPx.w), gy: state.convGY / RN.k / Math.max(1, cssPx.h),
      bx: state.convBX / RN.k / Math.max(1, cssPx.w), by: state.convBY / RN.k / Math.max(1, cssPx.h),
    },
    persist: state.persist,
    // mm -> glass half-heights, the only place a millimeter exists; the shader keeps working in its own
    // units. Aspect folded into the x-extents since the shader compares them against an already
    // aspect-scaled coordinate.
    ...(function(){
      const U = 1 / MM_PER_UNIT;                            // units per mm -- fixed, see the note in state
      const asp = Math.max(0.01, cssPx.w / Math.max(1, cssPx.h));
      const tubeLenMM = Math.max(50, state.fixWmm - 2 * state.tubeInsetMM);   // DERIVED, not chosen
      return {
        openW:  (state.fixWmm * 0.5) * U / asp,
        openH:  (state.fixHmm * 0.5) * U,
        recess: Math.max(0.002, state.recessMM * U),
        fixW:   (tubeLenMM * 0.5) * U / asp,
        fixH:   (state.tubeDiaMM * 0.5) * U,
        fixGap: (state.tubeGapMM * 0.5) * U,
        // No aspect division here -- dividing by it (a real past bug) put capLen in a different space than
        // halfLen, which it's compared against, and made CAP LENGTH move the cap ~5px across its whole
        // 5-80mm range instead of ~45. Expressed as a fraction of the tube's own half-length so it's
        // dimensionless by the time the shader sees it, though the floor is still a real 25mm molded part.
        capLen: state.capMM / Math.max(25, tubeLenMM * 0.5),
        // Divided by distance: sp2 is a tangent/angle (ray = normalize(vec3(sp2,-1)) at fixDist away), so
        // feeding it a plain length made POS X move the fitting proportionally to distance -- backwards from
        // a real fitting, which looks LESS displaced the farther away it sits.
        railW:  state.railMM * U,
        fixX:   (state.fixXmm * U) / Math.max(0.05, state.distMM * U),
        fixY:   (state.fixYmm * U) / Math.max(0.05, state.distMM * U),
        // A real distance in the same units as everything else; the ray builder places the fitting at it
        // rather than dividing the eye's cone by it.
        fixDist: Math.max(0.05, state.distMM * U),
        frost: state.frost, diffuse: state.diffuse, prism: state.prism, prismN: state.prismN,
      };
    })(),
    // fixY/fixW/fixH/fixGap/openW/openH deliberately NOT restated here -- a later key in the object literal
    // wins, so restating them would silently overwrite the mm block's answers (measured: HOUSING W came out
    // identical at 1200mm and 600mm before this was fixed).
    // uFixture is a gate (on/off), not a level -- each lamp's own flux carries its output and GLARE covers
    // what comes back off the glass, so a third multiplier here made LIGHT and GLARE fight over the same result.
    fixture: state.lightOn ? 1 : 0, fixTilt: state.fixTilt,
    // Multiplied by the surge, not replaced by it -- replacing would make both bulbs identical for the
    // fault's duration and read as two lamps being swapped mid-event, instead of the sicker one staying
    // visibly sicker.
    flkA: mA * state.lightA * (sg ? sg.lamp : 1),
    flkB: mB * state.lightB * (sg ? sg.lamp : 1),
    // The STARVED health, so the arc collapses toward the cathodes instead of the tube just dimming.
    healthA: hA, healthB: hB,
    sheen: state.sheen, matte: state.matte, glare: state.glare,
    // cm -> the fixture's units, by the same SCALE everything else uses.
    sheenR: Math.max(0.005, state.scatterCM * 10 / MM_PER_UNIT),
    glow: state.glow / 100, glowFall: state.glowFall, textRect: textRect,
    // Divided by raster scale k like convergence: spreads each gun by ~1.3 CSS px at every size (a fixed
    // content-texel spread once the scale factors cancel) -- 4% of a desktop glyph but 10% of a phone's,
    // which was the other half of why small text read out of focus.
    spot: state.spot / RN.k,
    tubeDead: state.tubeDead,
    frame: state.frame,
    // px -> the shader's units (1 = glass half-height = cssPx.h/2 px), converted once at this boundary so
    // the panel and shader don't need to know each other's units.
    frameW: view.frameW / Math.max(1, cssPx.h / 2),
    frameOn: view.frameOn, bzLocal: state.frameBleed, bzPhos: state.frameScreen, bzLamp: state.frameFixture,
    ink: p.ink, hi: p.hi, halo: p.halo, lamp: p.lamp, lampA: p.lampA, lampB: p.lampB,
    grilleInk: GRILLE_INK, ...bez(tA, tB),
  });

  frames++;
  if (!fpsT) fpsT = now;
  /* 250ms window keeps a cause and its cost in the same sample. Always shown as a number (0 is a reading, not
   * absent) so it doesn't read as an instrument glitch. Counts frames delivered, vsync-capped at 60 -- reading
   * 60 means "not dropping", not "could not go faster". */
  if (now - fpsT >= 250) {
    const hz = Math.max(state.lflickA, state.lflickB, state.flickHz);
    fpsEl.textContent = Math.round(frames * 1000 / (now - fpsT)) + ' FPS \u00b7 FLK ' +
                        (hz < 0.05 ? '0' : hz.toFixed(1)) + 'Hz';
    frames = 0; fpsT = now;
  }
  if (!oneShot) requestAnimationFrame(frame);
  // This lab has its own loop rather than the kit's, so it dismisses the loading ring itself.
  if (!shownOnce) { shownOnce = true; labReady(); }
}
/* Draws one frame synchronously with no animation frame needed -- Chrome delivers ZERO rAF callbacks to a
 * backgrounded tab, so measurement would otherwise have to wait for the window to be brought forward. `oneShot`
 * suppresses the requestAnimationFrame re-queue so repeated calls don't stack up callbacks. */
let oneShot = false;
function renderNow(t) { oneShot = true; try { frame(t == null ? performance.now() : t); } finally { oneShot = false; } }
requestAnimationFrame(frame);
/* Debug/measurement handle. `R` is a getter, not a captured value, since a lost context is recovered by
 * rebuilding the renderer entirely -- render-probe.js reads G.R.gl and a captured original would silently
 * return zeros after a restore. */
window.CRTGL = { state, get R() { return R; }, resize, textGrid, drawContent, renderNow, content: cc, contentPx, cssPx,
  // Published since "how many scanlines is it actually drawing" stopped being answerable from the panel once
  // narrow displays could scale the density; rasterScale()===1 is also the check that a change is inert at a
  // given size.
  rasterN, rasterScale,
  // A getter, not a captured value: view is reassigned between state and the override copy, so capturing it
  // once would freeze whichever was current at load.
  get view() { return view; },
  // Published as the only way to catch a stale face LUT: if u0/A here disagree with what `view` reports, the
  // memo didn't actually re-run.
  get faceProf() { return faceProf; },
  // Lets a finished block be inspected without waiting out the boot; writing it is what REBOOT does.
  get typed() { return typed; }, set typed(v) { typed = Math.max(0, Math.min(FULL, v | 0)); },
  get full() { return FULL; },
  // Same reason: with renderNow() drawing at a chosen timestamp, the whole power collapse can be stepped
  // through and measured in a backgrounded tab. powerAt() is pure, so sampling past a run's end just reports
  // where it lands.
  powerOn, powerOff, togglePower, powerAt: poseFor,
  get powerPhase() { return PWR.phase; }, get powerT0() { return PWR.t0; },
  // Both samplers are pure, so a whole warp/surge event can be stepped through and read off without driving it.
  triggerWarp, warpAt, get warpT0() { return MAG.t0; },
  triggerSurge, surgeAt: surgeNow, get surgeT0() { return SRG.t0; },
  surgeMs: () => FLK.surgeMs() };
</script>
</body>
</html>
