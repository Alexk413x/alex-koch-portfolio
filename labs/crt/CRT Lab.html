     * anyone has left the page open, and float32 freezes it solid. */
    boxVis: state.boxVis, railVis: state.railVis, glowA: state.glowA, glowB: state.glowB, ripple: state.ripple,
    /* PARKED WHEN NOTHING IS MODULATED BY IT. Both readers -- the fitting's own trace and the main pass --
     * spend this as `1.0 - uRipple * 0.5 * (0.5 - 0.5*cos(uMainsPh*TAU))`, so at RIPPLE 0 the phase cannot
     * reach a pixel. Sending it live anyway made it a uniform that CHANGES EVERY FRAME for no visible reason,
     * which is enough on its own to defeat the fixture pass's input key and re-trace the whole fitting sixty
     * times a second at a setting where it is provably identical. A phase nothing modulates is not a phase. */
    mainsPh: state.ripple > 0 ? (t * 100) % 1 : 0,
    beamPull: state.beamPull / Math.max(1, cssPx.h),
    flicker: flk, /* px -> content uv, against the stage rather than the render target: the control is a screen distance,
     * so it must not change meaning when RENDER SCALE does. */
    /* CONVERGENCE, PER GUN, px -> content uv. Against cssPx rather than the render target: these are screen
     * distances, so they must not change meaning when RENDER SCALE moves. The master is a bypass -- off hands
     * over an empty object and the renderer's ||0 puts all three guns on the same raster. */
    /* AND DIVIDED BY THE RASTER SCALE, so a misconvergence stays the same fraction of a GLYPH rather than the same
     * number of screen pixels.
     *
     * These are authored in CSS px because that is the unit a service manual uses, and on a desktop a pixel or two
     * against a 30px glyph is the couple of percent that reads as a well-set-up tube. Against a 12px glyph on a
     * phone the same split is a quarter of its width, and the text stops being readable — not a subtler version of
     * the same effect but a different one.
     *
     * So the error follows the raster like everything else that shrank with it: 1/k. On a stage with room — see
     * roomy() — k is 1 and these are byte-for-byte the values they always were. */
    conv: !state.convOn ? {} : {
      rx: state.convRX / RN.k / Math.max(1, cssPx.w), ry: state.convRY / RN.k / Math.max(1, cssPx.h),
      gx: state.convGX / RN.k / Math.max(1, cssPx.w), gy: state.convGY / RN.k / Math.max(1, cssPx.h),
      bx: state.convBX / RN.k / Math.max(1, cssPx.w), by: state.convBY / RN.k / Math.max(1, cssPx.h),
    },
    persist: state.persist,
    /* MILLIMETRES -> GLASS HALF-HEIGHTS, here and nowhere else. The shader keeps working in the units it
     * always did; this is the only place that knows a millimetre exists. uAspect is folded in for the two
     * x-extents because the shader compares them against an already aspect-scaled coordinate. */
    ...(function(){
      const U = 1 / MM_PER_UNIT;                            // units per mm -- fixed, see the note in state
      const asp = Math.max(0.01, cssPx.w / Math.max(1, cssPx.h));
      const tubeLenMM = Math.max(50, state.fixWmm - 2 * state.tubeInsetMM);   // DERIVED, not chosen
      return {
        openW:  (state.fixWmm * 0.5) * U / asp,
        openH:  (state.fixHmm * 0.5) * U,
        recess: Math.max(0.002, state.recessMM * U),
        fixW:   (tubeLenMM * 0.5) * U / asp,
        fixH:   (state.tubeDiaMM * 0.5) * U,
        fixGap: (state.tubeGapMM * 0.5) * U,
        /* NO ASPECT DIVISION HERE, and that was a bug. halfLen comes out of uFixW * uAspect, so the aspect
         * cancels and it is a plain length in units -- and fromEnd is measured against it. Dividing the cap by
         * the aspect put it in a different space from the thing it is compared to, so CAP LENGTH moved the cap
         * by 5px across its whole 5-80mm range instead of by about 45. */
        // AS A FRACTION OF THE TUBE'S OWN HALF-LENGTH, so it is dimensionless by the time the shader sees
        // it and cannot disagree with a coordinate about units. Still a real 25mm of moulded part.
        capLen: state.capMM / Math.max(25, tubeLenMM * 0.5),
        /* DIVIDED BY THE DISTANCE, because sp2 is an ANGLE and these are lengths.
         *
         * The ray is normalize(vec3(sp2, -1)) and the fitting sits fixDist away, so a point at sp2 lands at
         * sp2 * fixDist on the fitting's plane -- which makes sp2 a tangent, not a distance. Feeding it a plain
         * length meant POS X moved the fitting by centimetres-times-distance: the same 80cm shifted it twice as
         * far with the fitting twice as far away, when a real fitting 80cm to the left looks LESS displaced the
         * further off it is. One divide puts it in the space it is being compared against. */
        railW:  state.railMM * U,
        fixX:   (state.fixXmm * U) / Math.max(0.05, state.distMM * U),
        fixY:   (state.fixYmm * U) / Math.max(0.05, state.distMM * U),
        // A REAL DISTANCE NOW, in the same units as everything else -- the ray builder places the fitting
        // at it rather than dividing the eye's cone by it. See the note where rd is built.
        fixDist: Math.max(0.05, state.distMM * U),
        frost: state.frost, diffuse: state.diffuse, prism: state.prism, prismN: state.prismN,
      };
    })(),
    /* NOTE THE ABSENCE. fixY / fixW / fixH / fixGap / fixDepth / openW / openH used to be set from state HERE,
     * and because that was after the millimetre block above, they silently overwrote every one of its answers --
     * HOUSING W measured byte-identical at 1200mm and 600mm, and FROST was dead, for the same reason. A later
     * key in an object literal wins, so a conversion is only a conversion if nothing restates its output. */
    /* uFixture IS A GATE NOW, not a level. Each lamp carries its own output in its flux below, and how much
     * of it comes back off the glass is GLARE's job -- so a third multiplier in the middle was one scale too
     * many and made LIGHT and GLARE fight over the same result. */
    fixture: state.lightOn ? 1 : 0, fixTilt: state.fixTilt,
    /* THE LAMPS TAKE THE FAULT'S LEVEL ON TOP OF THEIR OWN FLICKER, multiplied rather than substituted -- the
     * reference's rule, and the reason a dying tube still reads as the sicker of the two right through the event.
     * A surge that REPLACED each bulb's state would make both tubes identical for four seconds and hand the
     * fixture's whole character back at the end, which reads as two lamps being swapped out mid-fault. */
    flkA: mA * state.lightA * (sg ? sg.lamp : 1),
    flkB: mB * state.lightB * (sg ? sg.lamp : 1),
    // The STARVED health, so the arc collapses toward the cathodes instead of the tube just dimming.
    healthA: hA, healthB: hB,
    sheen: state.sheen, matte: state.matte, glare: state.glare,
    // cm -> the fixture's units, by the same SCALE everything else uses.
    sheenR: Math.max(0.005, state.scatterCM * 10 / MM_PER_UNIT),
    glow: state.glow / 100, glowFall: state.glowFall, textRect: textRect,
    /* THE BEAM'S SPOT FOLLOWS THE RASTER TOO, for the same reason the convergence does. It spreads each gun
     * by a fixed number of content texels -- so, once the two scale factors cancel, a near-constant ~1.3 CSS
     * px whatever the display. That is 4% of a desktop glyph and 10% of a phone's, and it is the other half
     * of why the small text read as out of focus rather than merely small. Divided by k, it is the same
     * fraction of a glyph at every size; at k = 1 it is untouched. */
    spot: state.spot / RN.k,
    tubeDead: state.tubeDead,
    frame: state.frame,
    /* PX -> THE SHADER'S UNITS, where 1 is the glass half-height. The stage is cssPx.h CSS pixels tall
     * and maps to c in [-1, 1], so one unit is cssPx.h/2 px. Converted here, once, at the boundary --
     * the panel speaks px and the shader speaks half-heights, and neither has to know about the other. */
    frameW: view.frameW / Math.max(1, cssPx.h / 2),
    frameOn: view.frameOn, bzLocal: state.frameBleed, bzPhos: state.frameScreen, bzLamp: state.frameFixture,
    ink: p.ink, hi: p.hi, halo: p.halo, lamp: p.lamp, lampA: p.lampA, lampB: p.lampB,
    grilleInk: GRILLE_INK, ...bez(tA, tB),
  });

  frames++;
  if (!fpsT) fpsT = now;
  /* 250ms, and the FLICKER RATE RIDES ALONG. The DOM build's note on this is worth keeping: the window is short
   * so a cause and its cost land in the same sample, and the rate is always shown as a number because a label
   * that appears and vanishes with each burst reads as a glitch in the instrument rather than a measurement of
   * it. Zero is a reading; absent is not.
   *
   * The number is vsync-capped: it counts frames DELIVERED, and the compositor will not deliver more than 60.
   * Reading 60 means "not dropping", not "could not go faster". */
  if (now - fpsT >= 250) {
    const hz = Math.max(state.lflickA, state.lflickB, state.flickHz);
    fpsEl.textContent = Math.round(frames * 1000 / (now - fpsT)) + ' FPS \u00b7 FLK ' +
                        (hz < 0.05 ? '0' : hz.toFixed(1)) + 'Hz';
    frames = 0; fpsT = now;
  }
  if (!oneShot) requestAnimationFrame(frame);
  // This lab has its own loop rather than the kit's, so it dismisses the loading ring itself.
  if (!shownOnce) { shownOnce = true; labReady(); }
}
/* RENDER ONE FRAME ON DEMAND, WITHOUT THE ANIMATION LOOP. Chrome runs ZERO animation frames in a tab that is not
 * front-most, so every measurement of the rendered image would otherwise wait for a human to bring the window
 * forward. Nothing about the renderer needs rAF: the draw is a plain function of the state.
 *
 * The flag suppresses the re-queue, or a hundred measurements leave a hundred callbacks parked to fire at once the
 * moment the tab becomes visible. */
let oneShot = false;
function renderNow(t) { oneShot = true; try { frame(t == null ? performance.now() : t); } finally { oneShot = false; } }
requestAnimationFrame(frame);
/* THE INSTRUMENT HANDLE. `textGrid` and the content canvas are here for the same reason state and the renderer
 * are: this is a measuring tool, and the text layout is the part of it whose answers most need checking against
 * the reference. `drawContent(true)` forces a re-raster, which is what makes the layout measurable in a tab that
 * is not front-most -- Chrome runs no animation frames there, so nothing else would redraw it. */
/* R IS A GETTER, because it is no longer the same object for the life of the page. A lost context is
 * recovered by REBUILDING the renderer, so a handle that captured the original by value would hand every
 * consumer -- render-probe.js reads G.R.gl -- a dead context that silently returns zeros for everything. */
window.CRTGL = { state, get R() { return R; }, resize, textGrid, drawContent, renderNow, content: cc, contentPx, cssPx,
  /* THE RASTER AND THE SMALL-DISPLAY SCALE APPLIED TO IT. Published for the same reason textGrid is: this is a
   * measuring tool, and "how many scanlines is it actually drawing" stopped being answerable from the panel the
   * moment a narrow display could scale the density. rasterScale() === 1 is also the check that a change is
   * inert at a given size -- which is how the render fingerprint was shown to be unaffected by it. */
  rasterN, rasterScale,
  /* THE SETTINGS THE RENDERER ACTUALLY READ, which on a narrow display are not the ones the panel is showing.
   * A getter, because `view` is reassigned between state and the override copy -- capturing it by value would
   * hand a caller whichever one happened to be current at load. */
  get view() { return view; },
  /* THE FACE PROFILE THE LUT WAS LAST BUILT FROM. Published because it is the only way to see whether a memo
   * actually re-ran: u0 and A are what CURVE AREA and DEPTH resolve to, so a stale face LUT shows up here as
   * the old numbers while `view` reports the new ones -- which is exactly the failure the override contract
   * is written to prevent, and otherwise invisible until someone looks at the glass. */
  get faceProf() { return faceProf; },
  // A WINDOW ONTO THE TYPEWRITER, so a finished block can be inspected without waiting out the boot -- and so a
  // measurement is not at the mercy of when it happens to be taken. Writing it is what REBOOT does.
  get typed() { return typed; }, set typed(v) { typed = Math.max(0, Math.min(FULL, v | 0)); },
  get full() { return FULL; },
  /* AND ONTO THE POWER SEQUENCE, for the same reason. renderNow() draws one frame at a timestamp of the caller's
   * choosing, so with these the whole collapse can be stepped through and measured in a tab that is not
   * front-most -- which is the only place this project has ever been able to measure anything reliably. powerAt()
   * is the pose the shader is being handed, so a reading can be checked against what was asked for -- and it is
   * the PURE one, so sampling past the end of a run reports where the animation lands without ending it. */
  powerOn, powerOff, togglePower, powerAt: poseFor,
  get powerPhase() { return PWR.phase; }, get powerT0() { return PWR.t0; },
  /* THE TWO EVENTS, AND THE POSE EACH IS HANDING THE SHADER. Both samplers are pure, so a whole run can be
   * stepped through and read off without driving it -- which is the only way anything here has ever been
   * measured, since Chrome runs no animation frames in a tab that is not front-most. */
  triggerWarp, warpAt, get warpT0() { return MAG.t0; },
  triggerSurge, surgeAt: surgeNow, get surgeT0() { return SRG.t0; },
  surgeMs: () => FLK.surgeMs() };
</script>
</body>
