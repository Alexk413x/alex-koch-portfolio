<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reactor Lab</title>
<!-- AN INLINE FAVICON, because a browser asks for /favicon.ico whether or not one exists and logs a 404 when it
     does not. A data URI answers the question in the document rather than needing a file beside it. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23070a07'/%3E%3Cellipse cx='8' cy='8' rx='6.5' ry='2.2' fill='none' stroke='%238fff6a' stroke-width='1'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%2328ff1a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Archivo:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../kit/panel.css">
<link rel="stylesheet" href="../kit/lab.css">
<!-- Only what is true of this lab: it is green where the kit's default is amber, and it has a vent schedule. -->
<style>
  :root{--panel-accent:#8fff6a;--panel-accent-soft:rgba(143,255,106,.35);--panel-accent-lit:#c6ffb0;
        --panel-fill:#0c120a;--panel-hot:#16260f;--panel-hover:#101a0d;--panel-focus-edge:#274a1c}
  #panel h1{font-size:12px}
  #vent{margin-top:6px;white-space:pre;line-height:1.5;color:rgba(255,255,255,.4)}
  #keys{margin-top:6px;color:rgba(255,255,255,.28)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="core"></canvas>
  <div id="mast"><div class="t">REACTOR&nbsp;LAB</div><div class="s" id="modename">containment core</div></div>
  <div id="hud">
    <div><b id="fps">-- FPS</b> <span id="scaleinfo"></span> <span id="glstate"></span></div>
    <div id="inst">INSTABILITY <b>0%</b></div>
    <div>CORE&nbsp;PRESSURE <b id="pressure">--</b> kPa</div>
    <div>RING&nbsp;INTEGRITY <b id="integrity">--</b> %</div>
    <div id="vent"></div>
    <div id="keys">↑↓ select slider · ←→ adjust</div>
  </div>
</div>
<div id="panel">
  <h1>REACTION STATE</h1>
  <div class="btns" id="presets"></div>
  <div class="btns" id="actions"></div>
  <div id="controls"></div>
</div>

<script type="module">
import { createQuad } from '../kit/glquad.js';
import { createPanel, buildActions, mountPanelToggle } from '../kit/panel.js';
import { persist, fitCanvas, runLoop, textOut, reportNoGL } from '../kit/lab.js';
import { FRAG, UNIFORMS } from './reactor-shader.js';
import { SECTIONS, FMT } from './reactor-sidebar.js';
import { PRESETS, MODES, CAM_KEYS, defaultPreset, matchIdx } from './reactor-presets.js';
import { createSim, ventTimings } from './reactor-sim.js';

const stage = document.getElementById('stage');
const R = createQuad(document.getElementById('core'), {
  frag: FRAG, uniforms: UNIFORMS, ext: ['OES_standard_derivatives'], onRestore: () => fit(true),
});
if (!R) { reportNoGL(); throw new Error('WebGL unavailable'); }

const state = defaultPreset(R.gpu);
const sim = createSim();

// persist() derives ranges from the panel layout, so these three are invisible to it: mode belongs to the preset
// strip, ringOn is a section master, and a colour row has no range.
const store = persist({ key: 'reactor', version: 1, state, sections: SECTIONS,
                        extra: ['mode', 'ringOn', 'coreHex'] });
store.restore();
state.mode = Math.max(0, Math.min(MODES.length - 1, Math.round(state.mode)));

// CUSTOM is a real answer here: the active preset is derived from the values, so editing one slider says so.
const modeEl = document.getElementById('modename');
function syncMode() {
  const i = matchIdx(state);
  textOut(modeEl, 'containment core · ' + (i < 0 ? 'CUSTOM' : MODES[i]));
  syncPresets();
}

/* An actions strip rather than a `choice` row: `choice` lights the button whose index state holds, which would
 * keep MELTDOWN lit after the values were edited away from it. These light off matchIdx instead, and the returned
 * sync() is re-run on every change because any slider can extinguish them. */
const syncPresets = buildActions(document.getElementById('presets'),
  MODES.map((name, i) => [name, () => applyPreset(i), () => matchIdx(state) === i]));

// The camera survives a preset: having framed the core, pressing MELTDOWN should not spin the view back.
function applyPreset(i) {
  const p = { ...PRESETS[i] };
  CAM_KEYS.forEach((k) => delete p[k]);
  Object.assign(state, p, { mode: i });
  rebuildPanel();
  syncMode();
  store.queueSave();
}

// Rebuilt, not updated, and only when a preset lands: panel.js's rows read state once and own their DOM after,
// so a value written from outside leaves its row stale. Folds survive because they live in state.
const host = document.getElementById('controls');
function rebuildPanel() {
  host.innerHTML = '';
  createPanel({ host, state, sections: SECTIONS, fmt: FMT, onChange });
}

function onChange(key, kind) {
  if (key === 'renderScale') fit(true);
  if (kind !== 'fold') syncMode();      // a fold is not a value, so it cannot change which preset is active
  store.queueSave();
}
rebuildPanel();

buildActions(document.getElementById('actions'), [
  ['↯ PULSE', () => sim.firePulse(state)],
  ['◎ VENT',  () => sim.fireVent()],
]);

const scaleEl = document.getElementById('scaleinfo');
const fit = fitCanvas({
  stage, R, scale: () => state.renderScale,
  onFit: (w, h) => textOut(scaleEl, w + '×' + h + ' @ ' + Math.round(state.renderScale * 100) + '%'),
});
fit(true);

mountPanelToggle({ panel: document.getElementById('panel'), onToggle: () => fit(true) });

// ---------------------------------------------------------------- the readouts
const fpsEl = document.getElementById('fps'), instEl = document.getElementById('inst');
const pressEl = document.getElementById('pressure'), integEl = document.getElementById('integrity');
const ventEl = document.getElementById('vent'), glEl = document.getElementById('glstate');

function syncVentHUD() {
  const vd = state.ventDur || 6, T = ventTimings(vd);
  if (sim.venting) {
    const t = sim.ventT;
    const ph = t < T.b1e ? 'PULSE 1' : t < T.b2s ? 'gap' : t < T.b2e ? 'PULSE 2'
             : t < T.boom ? 'CHARGE' : t < T.boom + T.hold ? 'PEAK' : 'FADE';
    textOut(ventEl, 'VENT ' + t.toFixed(2) + 's · ' + ph);
  } else {
    textOut(ventEl, 'VENT SCHEDULE (' + vd.toFixed(1) + 's)\n'
      + 'P1 ' + T.b1s.toFixed(2) + '–' + T.b1e.toFixed(2) + '  P2 ' + T.b2s.toFixed(2) + '–' + T.b2e.toFixed(2) + '\n'
      + 'CHARGE→' + T.build.toFixed(2) + '\n'
      + 'BOOM ' + T.boom.toFixed(2) + '  FADE→' + T.end.toFixed(2));
  }
}

// Gauges on the outside of a vessel: derived from the settings, not measurements of the simulation.
function syncGauges() {
  const s = state;
  textOut(pressEl, String(Math.round(180 + s.rate * 90 + s.turb * 400 + Math.max(0, s.mode) * 120)));
  textOut(integEl, String(Math.max(10, Math.round(100 - Math.max(0, s.mode) * 22 - s.turb * 40
                                   - (Math.abs(s.orbit) + Math.abs(s.orbitX)) * 3))));
}

// ---------------------------------------------------------------- the loop
let pose = null;

function draw(dt, sec) {
  if (R.lost) { textOut(glEl, 'GL CONTEXT LOST'); return; }
  textOut(glEl, '');
  const p = pose = sim.step(state, dt, sec);

  R.f2('uRes', R.w, R.h);
  R.f('uTime', sec);
  R.f('uSize', state.size); R.f('uVisc', p.visc); R.f('uTurb', p.turb); R.f('uRate', state.rate);
  R.f('uGlow', state.glow); R.f('uZoom', state.zoom); R.f('uHue', state.hue);
  R.f('uAmp', state.amp); R.f('uOct', state.octaves); R.f('uShape', state.shape);
  R.f('uCamAngle', state.camAngle); R.f('uCamEl', state.camEl);
  R.f('uCoreAngle', state.coreAngle); R.f('uCoreAngleX', state.coreAngleX);
  R.f('uPulseBright', state.pulseBright); R.f('uPulseSize', state.pulseSize);
  R.f('uVentSize', state.ventSize); R.f('uVentBright', state.ventBright);
  R.f('uRingLight', state.ringLight); R.f('uRingOn', state.ringOn ? 1 : 0);
  R.f('uSubVT', state.subVT != null ? state.subVT : 1);
  R.f('uSwellAmt', state.ventSwellPct != null ? state.ventSwellPct : 0.9);

  R.f('uPulse', p.pulse); R.f('uVent', p.vent); R.f('uVentBurst', p.ventBurst); R.f('uVentSwell', p.ventSwell);
  R.f('uWobble', p.wobble);
  R.f('uRingR', p.ringR); R.f('uSwellRingBase', p.swellRingBase); R.f('uSwellTarget', p.swellTarget);
  R.f('uRingGlow', p.ringGlow); R.f('uShieldExpand', p.shieldExpand); R.f('uScatter', p.scatter);
  R.f('uBreakBurst', p.breakBurst); R.f('uFragFly', p.fragFly); R.f('uSnap', p.snap);
  R.f('uPhOrbit', p.phOrbit); R.f('uPhOrbitX', p.phOrbitX); R.f('uPhWob', p.phWob); R.f('uPhCam', p.phCam);
  R.f('uPhCoreY', p.phCoreY); R.f('uPhCoreX', p.phCoreX); R.f('uPhRate', p.phRate);
  R.f('uRingAngleY', state.ringAngleY); R.f('uRingAngleX', state.ringAngleX);

  const c = state.coreHex || '#28ff1a';
  R.f3('uCoreCol', parseInt(c.slice(1, 3), 16) / 255, parseInt(c.slice(3, 5), 16) / 255,
                   parseInt(c.slice(5, 7), 16) / 255);

  // dropN is 0 at rest, so the shader's droplet loop breaks immediately and eighty floats are never uploaded.
  R.f('uDropN', p.dropN);
  if (p.dropN) R.fv4('uDropData', p.dropData);

  R.draw();
  // A running vent's readout is a clock, so it alone updates per frame; everything else waits for the tick.
  if (sim.venting) syncVentHUD();
}

const loop = runLoop({
  draw,
  onTick: (fps) => {
    textOut(fpsEl, fps + ' FPS');
    if (pose) instEl.innerHTML = 'INSTABILITY <b>' + Math.round(pose.inst * 100) + '%</b> · RING <b>'
                               + pose.ringSpin.toFixed(1) + ' RPM</b>';
    syncGauges();
    syncVentHUD();
  },
});

syncMode(); syncGauges(); syncVentHUD();

/* The handle bench.py and the console reach for.
 *
 * renderNow's first argument is dt, NOT a timestamp — renderNow(8) steps the sim eight seconds in one frame. It is
 * also not reproducible, because sim.step carries phase forward. Read pixels in the same task as the call: the
 * context is preserveDrawingBuffer:false, so a later readPixels returns a cleared buffer. */
window.REACTOR = { state, R, sim, fit, saveState: store.save, rebuildPanel,
                   renderNow: (dt, sec) => loop.renderNow(dt, sec),
                   get time() { return loop.time; } };
</script>
</body>
</html>
