<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Archivo:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:#000;color:#fff;font-family:'JetBrains Mono',monospace;overflow:hidden}
  input[type=range]{-webkit-appearance:none;appearance:none;height:3px;border-radius:3px;background:rgba(255,255,255,.18);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#ffb454;cursor:pointer;box-shadow:0 0 8px rgba(255,180,84,.8)}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:#ffb454;cursor:pointer}
</style>
</helmet>

<div style="position:fixed;inset:0;background:#000;overflow:hidden">
  <canvas id="wl_cv" style="position:absolute;inset:0;width:100%;height:100%;display:block"></canvas>

  <div style="position:absolute;top:0;left:0;padding:20px 26px;pointer-events:none">
    <div style="font-family:'Archivo';font-weight:900;font-size:20px;letter-spacing:1px;color:#fff">WORMHOLE&nbsp;LAB</div>
    <div style="font-size:11px;letter-spacing:1px;color:rgba(255,180,84,.85);margin-top:2px">WebGL shader · {{ modeName }}</div>
  </div>

  <div id="wl_fps" style="position:absolute;bottom:16px;left:26px;pointer-events:none;font-size:10px;letter-spacing:1px;color:#ffb454">-- FPS</div>

  <dc-import name="../../lab/Sidebar" title="WORMHOLE FIELD" accent="#ffb454"
    sections="{{ panelSections }}" presets="{{ panelPresets }}"
    on-change="{{ onChange }}" on-preset="{{ onPreset }}" hint-size="308px,100%"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { mode: 2, speed: 5.0, turb: 1.2, twist: 1.4, chroma: 1.0, glow: 1.3, hue: 0.02, rot: 0.3 };
  META = {
    speed:  { key: 'speed',  label: 'SPEED',      min: -12, max: 12, step: 0.05, fmt: (v) => v.toFixed(1) + 'c', parse: (r) => parseFloat(r) },
    turb:   { key: 'turb',   label: 'TURBULENCE', min: 0,   max: 3,  step: 0.05, fmt: (v) => Math.round(v / 3 * 100) + '%', parse: (r) => parseFloat(r) / 100 * 3 },
    twist:  { key: 'twist',  label: 'TWIST',      min: -4,  max: 4,  step: 0.05, fmt: (v) => Math.round(v * 90) + '°', parse: (r) => parseFloat(r) / 90 },
    rot:    { key: 'rot',    label: 'ROTATION',   min: -2,  max: 2,  step: 0.02, fmt: (v) => Math.round(v * 90) + '°/s', parse: (r) => parseFloat(r) / 90 },
    chroma: { key: 'chroma', label: 'CHROMA',     min: 0,   max: 3,  step: 0.05, fmt: (v) => Math.round(v / 3 * 100) + '%', parse: (r) => parseFloat(r) / 100 * 3 },
    glow:   { key: 'glow',   label: 'GLOW',       min: 0.2, max: 3,  step: 0.05, fmt: (v) => Math.round(v / 3 * 100) + '%', parse: (r) => parseFloat(r) / 100 * 3 },
    hue:    { key: 'hue',    label: 'HUE',        min: 0,   max: 1,  step: 0.01, fmt: (v) => Math.round(v * 360) + '°', parse: (r) => parseFloat(r) / 360 },
  };
  onChange = (k, v) => this.setState({ [k]: v });
  onPreset = (i) => this.setState({ mode: i });

  componentDidMount() {
    try { const s = JSON.parse(localStorage.getItem('wl_state') || 'null'); if (s) Object.assign(this.state, s); } catch (e) {}
    // THE SIDEBAR OWNS ITS OWN WIDTH. It publishes --sidebar-w and fires sidebar-width when it changes, so the panel width
    // is CACHED here instead of measured. The shader needs it to offset the field's centre, and the old code called
    // getBoundingClientRect() on the panel inside the draw loop -- a forced layout read every single frame, for a number
    // that changes only when the window resizes. It is a FETCHED child DC, so it lands after this method and after the
    // first frame; the event is what makes the first value arrive.
    this._panelPx = 0;
    this._onSidebar = (e) => { this._panelPx = (e && e.detail) || parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-w')) || 0; };
    window.addEventListener('sidebar-width', this._onSidebar);
    this._onSidebar();
    this._vis = () => this.onVis(); document.addEventListener('visibilitychange', this._vis);
    this.initGL();
  }
  componentDidUpdate() { try { localStorage.setItem('wl_state', JSON.stringify(this.state)); } catch (e) {} }
  componentWillUnmount() { if (this.raf) cancelAnimationFrame(this.raf); window.removeEventListener('resize', this._rz); window.removeEventListener('sidebar-width', this._onSidebar); document.removeEventListener('visibilitychange', this._vis); }
  onVis() {                                            // pause GPU work when tab is hidden
    if (document.hidden) { if (this.raf) { cancelAnimationFrame(this.raf); this.raf = 0; } this._pausedAt = performance.now(); }
    else if (this.gl && !this.raf) { this.t0 += performance.now() - (this._pausedAt || performance.now()); this.raf = requestAnimationFrame(this.frame); }
  }

  FRAG = `
precision highp float;
uniform vec2 uRes; uniform float uTime, uSpeed, uTurb, uTwist, uChroma, uGlow, uHue, uMode, uRot, uPanelPx;

float hash(vec3 p){ p=fract(p*0.3183099+0.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float noise(vec3 x){
  vec3 p=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(hash(p+vec3(0,0,0)),hash(p+vec3(1,0,0)),f.x),
                 mix(hash(p+vec3(0,1,0)),hash(p+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash(p+vec3(0,0,1)),hash(p+vec3(1,0,1)),f.x),
                 mix(hash(p+vec3(0,1,1)),hash(p+vec3(1,1,1)),f.x),f.y),f.z);
}
float fbm(vec3 p){ float v=0.0, a=0.5; for(int i=0;i<3;i++){ v+=a*noise(p); p*=2.03; a*=0.5; } return v; }
vec3 pal(float t){ return 0.5+0.5*cos(6.28318*(vec3(1.0,0.85,0.65)*t + vec3(0.0,0.12,0.28) + uHue)); }

vec3 tunnel(vec2 uv){
  float r=length(uv)+1e-4;
  float z=uTime*uSpeed + 0.85/r;                       // fly down the throat
  float ang=atan(uv.y,uv.x) + uTwist*z*0.05 + uRot*uTime;
  vec2 dir=vec2(cos(ang),sin(ang));                    // seamless around the tube (no atan seam)

  vec3 q=vec3(dir*2.6, z*0.5);
  float density;
  if(uMode<0.5){                                       // NEBULA
    float w=fbm(q + uTurb*noise(q*0.5+uTime*0.05));
    density = w*0.85 + fbm(vec3(dir*7.0, z*4.0))*0.30;
  } else if(uMode<1.5){                                // LIGHTSPEED
    density = fbm(vec3(dir*7.0, z*4.0))*1.15 + noise(q)*0.20;
  } else {                                             // PLASMA vortex (cheapest)
    density = fbm(q*1.4 + 1.5*sin(vec3(dir*2.0,z)) + uTurb*noise(q*0.5));
  }

  float glow=uGlow*(0.16/(r+0.06));
  float throat=smoothstep(0.0,0.5,0.5-r);
  float bright=density*glow + throat*1.4;
  vec3 col=pal(z*0.12 + density*0.25)*bright;
  col += vec3(1.0,0.94,0.82)*smoothstep(0.16,0.0,r)*3.2;   // hot core
  return col;
}
void main(){
  vec2 uv=(gl_FragCoord.xy - vec2(0.5*(uRes.x-uPanelPx),0.5*uRes.y))/uRes.y;   // center in the area left of the sidebar
  vec3 col=tunnel(uv);                              // one evaluation (fast)
  float r=length(uv);
  float ca=uChroma*0.22*r;                          // cheap chromatic fringe
  col.r*=1.0+ca; col.b*=1.0-0.7*ca;
  col*=smoothstep(1.35,0.15,r);                    // vignette
  col=col/(col+0.9); col=pow(col,vec3(0.82));       // tone map
  gl_FragColor=vec4(col,1.0);
}`;

  initGL() {
    const cv = document.getElementById('wl_cv');
    if (!cv) { setTimeout(() => this.initGL(), 40); return; }
    const gl = cv.getContext('webgl') || cv.getContext('experimental-webgl');
    if (!gl) { return; }
    this.gl = gl; this.cv = cv;
    if (!this._ctxHooked) {                            // survive GPU context loss on static pages
      this._ctxHooked = true;
      cv.addEventListener('webglcontextlost', (e) => { e.preventDefault(); if (this.raf) { cancelAnimationFrame(this.raf); this.raf = 0; } });
      cv.addEventListener('webglcontextrestored', () => this.initGL());
    }
    const vs = 'attribute vec2 p; void main(){ gl_Position=vec4(p,0.0,1.0); }';
    const mk = (t, s) => { const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh); if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(sh)); return sh; };
    const pr = gl.createProgram();
    gl.attachShader(pr, mk(gl.VERTEX_SHADER, vs));
    gl.attachShader(pr, mk(gl.FRAGMENT_SHADER, this.FRAG));
    gl.linkProgram(pr); gl.useProgram(pr); this.pr = pr;
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    this.U = {};
    for (const n of ['uRes', 'uTime', 'uSpeed', 'uTurb', 'uTwist', 'uChroma', 'uGlow', 'uHue', 'uMode', 'uRot', 'uPanelPx']) this.U[n] = gl.getUniformLocation(pr, n);
    this._rz = () => this.resize(); window.addEventListener('resize', this._rz); this.resize();
    this.t0 = performance.now();
    this.raf = requestAnimationFrame(this.frame);
  }
  resize() {
    if (!this.gl || !this.cv) return;
    const dpr = Math.min(1, window.devicePixelRatio || 1), rs = 0.7;  // render below native res, CSS upscales (soft nebula hides it)
    this.cv.width = Math.max(2, Math.floor(innerWidth * dpr * rs)); this.cv.height = Math.max(2, Math.floor(innerHeight * dpr * rs));
    this.gl.viewport(0, 0, this.cv.width, this.cv.height);
  }
  frame = (now) => {
    const gl = this.gl, s = this.state, U = this.U;
    gl.uniform2f(U.uRes, this.cv.width, this.cv.height);
    gl.uniform1f(U.uTime, (now - this.t0) / 1000);
    gl.uniform1f(U.uSpeed, s.speed); gl.uniform1f(U.uTurb, s.turb); gl.uniform1f(U.uTwist, s.twist);
    gl.uniform1f(U.uChroma, s.chroma); gl.uniform1f(U.uGlow, s.glow); gl.uniform1f(U.uHue, s.hue); gl.uniform1f(U.uMode, s.mode); gl.uniform1f(U.uRot, s.rot);
    gl.uniform1f(U.uPanelPx, (this._panelPx || 0) * (this.cv.width / Math.max(1, window.innerWidth)));
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    this._fc = (this._fc || 0) + 1; if (!this._ft) this._ft = now;
    if (now - this._ft >= 500) { const el = document.getElementById('wl_fps'); if (el) el.textContent = Math.round(this._fc * 1000 / (now - this._ft)) + ' FPS'; this._fc = 0; this._ft = now; }
    this.raf = requestAnimationFrame(this.frame);
  };

  set(k) { return (e) => this.setState({ [k]: parseFloat(e.target.value) }); }
  btn(active) {
    const base = 'flex:1;font-family:JetBrains Mono;font-size:10px;letter-spacing:.5px;padding:8px 4px;border-radius:8px;cursor:pointer;transition:all .2s;';
    return base + (active
      ? 'background:#ffb454;color:#1a0f04;border:1px solid #ffb454;font-weight:700'
      : 'background:rgba(255,255,255,.05);color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.14)');
  }
  renderVals() {
    const s = this.state, names = ['NEBULA WORMHOLE', 'LIGHTSPEED', 'PLASMA VORTEX'], M = this.META;
    const sec = (name, keys) => ({ name, sliders: keys.map((k) => ({ ...M[k], value: s[k] })) });
    return {
      modeName: names[s.mode],
      panelSections: [
        sec('FLOW', ['speed', 'turb', 'twist', 'rot']),
        sec('COLOR', ['chroma', 'glow', 'hue']),
      ],
      panelPresets: [
        { label: 'NEBULA', active: s.mode === 0 },
        { label: 'LIGHTSPEED', active: s.mode === 1 },
        { label: 'PLASMA', active: s.mode === 2 },
      ],
      onChange: this.onChange, onPreset: this.onPreset,
    };
  }
}
</script>
</body>
</html>
