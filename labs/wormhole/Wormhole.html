<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wormhole Lab</title>
<!-- AN INLINE FAVICON, because a browser asks for /favicon.ico whether or not one exists and logs a 404 when it
     does not. A data URI answers the question in the document rather than needing a file beside it. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23070707'/%3E%3Ccircle cx='8' cy='8' r='6' fill='none' stroke='%23ffb454' stroke-width='1'/%3E%3Ccircle cx='8' cy='8' r='3' fill='none' stroke='%23ffb454' stroke-width='1' opacity='.6'/%3E%3Ccircle cx='8' cy='8' r='1' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Archivo:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../kit/panel.css">
<link rel="stylesheet" href="../kit/lab.css">
<!-- Only what is true of this lab; the page shell is lab.css and the panel is panel.css. -->
<style>
  #panel h1{font-size:12px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="field"></canvas>
  <div id="mast"><div class="t">WORMHOLE&nbsp;LAB</div><div class="s" id="modename">WebGL shader</div></div>
  <div id="hud"><b id="fps">-- FPS</b> <span id="scaleinfo"></span> <span id="glstate"></span><br><span class="dim" id="gpu"></span></div>
</div>
<div id="panel">
  <h1>WORMHOLE FIELD</h1>
  <!-- No button strips: each switchable section carries its own master in its header, which panel.js builds. -->
  <div id="controls"></div>
</div>

<script type="module">
import { createQuad, valueNoiseTexture } from '../kit/glquad.js';
import { createPanel, mountPanelToggle } from '../kit/panel.js';
import { persist, fitCanvas, runLoop, textOut, reportNoGL, escapeLeaves } from '../kit/lab.js';

// Escape leaves the instrument, the way the back button does.
escapeLeaves();
import { FRAG, UNIFORMS, fragFor } from './wormhole-shader.js';
import { SECTIONS, FMT, EFFECTS } from './wormhole-sidebar.js';
import { defaultPreset } from './wormhole-presets.js';

const stage = document.getElementById('stage');
// The noise lattice lives in a texture rather than being hashed per sample — see valueNoiseTexture. Built once
// here; glquad re-uploads it if the context is lost.
/* THE SHADER IS REBUILT FOR WHICHEVER LAYERS ARE ON, because a layer costs even with its uniform at zero —
 * plasma alone measured 9.14 ms in the three-layer shader against 4.88 in a plasma-only one, for the same frame.
 * FRAG is the superset and draws correctly at any setting, so it covers the frames while a narrower build
 * compiles. The key is DERIVED from the same flags the uniforms are sent from, in layerKey below: a key that
 * disagrees with the uniforms would silently drop a layer. */
const R = createQuad(document.getElementById('field'), {
  frag: FRAG, uniforms: UNIFORMS,
  textures: { uNoise: valueNoiseTexture(256) },
  variant: (key) => fragFor(key.indexOf('N') >= 0, key.indexOf('L') >= 0, key.indexOf('P') >= 0),
  onRestore: () => fit(true),
});
if (!R) { reportNoGL(); throw new Error('WebGL unavailable'); }

/* Neither a colour swatch nor a section master is a slider row, so persist() cannot derive either from the panel
 * layout. The masters are READ BACK OUT OF THE SECTION TABLE rather than listed again — a second list is a second
 * description of the same set, and the one that gets forgotten is the one that silently stops being saved. */
const SWATCHES = ['nebCol', 'nebColB', 'lsCol', 'lsColB', 'plCol', 'plColB', 'coreCol'];
const MASTERS = SECTIONS.map(([, , master]) => master).filter(Boolean);
const state = defaultPreset(R.gpu);
const store = persist({ key: 'wormhole', version: 8, state, sections: SECTIONS,
                        extra: MASTERS.concat(SWATCHES) });
store.restore();

/* The mast names the LAYERS that are lit, and only those. CORE has a master too, but it is the far end of the
 * tunnel rather than something the march mixes — a frame with the core switched off is still whatever layers are
 * running, not a different scene. */
const modeEl = document.getElementById('modename');
function syncMode() {
  const on = EFFECTS.filter((e) => state[e.key]).map((e) => e.label);
  textOut(modeEl, on.length ? on.join(' + ') : 'ALL LAYERS OFF');
}

// Rebuilt, not updated: panel.js's rows read state once and own their DOM after, so a value written from outside
// leaves its row stale. Folds survive because they live in state.
const host = document.getElementById('controls');
function rebuildPanel() {
  host.innerHTML = '';
  createPanel({ host, state, sections: SECTIONS, fmt: FMT, onChange });
}

function onChange(key, kind) {
  if (key === 'renderScale') fit(true);
  if (kind !== 'fold') syncMode();
  store.queueSave();
}
rebuildPanel();

const scaleEl = document.getElementById('scaleinfo');
const fit = fitCanvas({
  stage, R, scale: () => state.renderScale,
  onFit: (w, h) => textOut(scaleEl, w + '×' + h + ' @ ' + Math.round(state.renderScale * 100) + '%'),
});
fit(true);

mountPanelToggle({ panel: document.getElementById('panel'), onToggle: () => fit(true) });

textOut(document.getElementById('gpu'),
        (R.gpu.integrated ? 'INTEGRATED' : 'DISCRETE') + ' · ' +
        String(R.gpu.name || '?').replace(/^ANGLE \(|\)$/g, '').slice(0, 44));

const fpsEl = document.getElementById('fps'), glEl = document.getElementById('glstate');

// Hex to linear-ish rgb. Cached per string, because six swatches parsed every frame is six string scans for
// values that change when someone opens a colour picker.
const rgbCache = new Map();
function rgb(hex) {
  let v = rgbCache.get(hex);
  if (!v) {
    v = [parseInt(hex.slice(1, 3), 16) / 255, parseInt(hex.slice(3, 5), 16) / 255, parseInt(hex.slice(5, 7), 16) / 255];
    rgbCache.set(hex, v);
  }
  return v;
}
const col3 = (name, hex) => { const c = rgb(hex || '#ffffff'); R.f3(name, c[0], c[1], c[2]); };

// The layer set as a string, read from the same flags that drive uLsOn and friends below.
const layerKey = (s) => (s.nebOn ? 'N' : '') + (s.lsOn ? 'L' : '') + (s.plOn ? 'P' : '');

function draw(dt, sec) {
  if (R.lost) { textOut(glEl, 'GL CONTEXT LOST'); return; }
  textOut(glEl, '');
  const s = state;

  // Before the uniforms, not after: a switch lands on a program whose uniforms are all zero, and these sends
  // are what fill it in.
  R.use(layerKey(s));

  R.f2('uRes', R.w, R.h);
  R.f('uTime', sec);
  R.f('uSteps', s.steps); R.f('uSpread', s.stepSpread);
  R.f('uBend', s.bend); R.f('uBendFlow', s.bendFlow); R.f('uBendScale', s.bendScale);
  // ONE COVERAGE, SENT THREE TIMES. The shader keeps a uniform per layer because wallProfile is evaluated per
  // layer inside the march; what changed is that one control stands behind all three.
  R.f('uNebCov', s.coverage); R.f('uLsCov', s.coverage); R.f('uPlCov', s.coverage);
  // CORE's master rides on uGlow rather than a uniform of its own: the core is added as throat * uGlow, so a glow
  // of zero already IS off, and the shader needs nothing it does not already have.
  R.f('uGlow', s.coreOn ? s.glow : 0);
  R.f('uChroma', s.chroma); R.f('uVignette', s.vignette); R.f('uExposure', s.exposure);
  R.f('uThroatTint', s.throatTint); R.f('uThroatRays', s.throatRays);
  R.f('uCoreAuto', s.coreAuto); R.f('uCoreSpin', s.coreSpin);
  R.f('uCorePulse', s.corePulse); R.f('uCorePulseRate', s.corePulseRate);
  R.f('uCoreFade', s.coreFade); R.f('uCoreFadeRate', s.coreFadeRate);
  col3('uCoreCol', s.coreCol);

  R.f('uNebOn', s.nebOn ? 1 : 0);
  R.f('uNebMode', s.nebMode); R.f('uNebHue', s.nebHue);
  R.f('uNebDensity', s.nebDensity); R.f('uNebFill', s.nebFill); R.f('uNebFluff', s.nebFluff);
  R.f('uNebStreak', s.nebStreak); R.f('uNebVar', s.nebVar); R.f('uNebScale', s.nebScale); R.f('uNebOct', s.nebOct);
  R.f('uNebSpeed', s.nebSpeed); R.f('uNebTwist', s.nebTwist); R.f('uNebSpin', s.nebSpin);
  col3('uNebCol', s.nebCol); col3('uNebColB', s.nebColB);

  R.f('uLsOn', s.lsOn ? 1 : 0);
  R.f('uLsMode', s.lsMode); R.f('uLsHue', s.lsHue);
  R.f('uLsDensity', s.lsDensity); R.f('uLsCount', s.lsCount); R.f('uLsLen', s.lsLen);
  R.f('uLsThick', s.lsThick); R.f('uLsVar', s.lsVar); R.f('uLsRadial', s.lsRadial);
  R.f('uLsSpeed', s.lsSpeed); R.f('uLsTwist', s.lsTwist); R.f('uLsSpin', s.lsSpin);
  col3('uLsCol', s.lsCol); col3('uLsColB', s.lsColB);

  R.f('uPlOn', s.plOn ? 1 : 0);
  R.f('uPlMode', s.plMode); R.f('uPlHue', s.plHue);
  R.f('uPlDensity', s.plDensity); R.f('uPlCrackle', s.plCrackle);
  R.f('uPlScale', s.plScale); R.f('uPlStreak', s.plStreak);
  R.f('uPlFill', s.plFill); R.f('uPlOcclude', s.plOcclude);
  R.f('uPlFlash', s.plFlash); R.f('uPlFlashRate', s.plFlashRate); R.f('uPlLight', s.plLight);
  R.f('uPlSpeed', s.plSpeed); R.f('uPlTwist', s.plTwist); R.f('uPlSpin', s.plSpin);
  col3('uPlCol', s.plCol); col3('uPlColB', s.plColB);

  R.draw();
}

const loop = runLoop({ draw, onTick: (fps) => textOut(fpsEl, fps + ' FPS') });

syncMode();

// The handle bench.py and the console reach for. Read pixels in the same task as renderNow — the context is
// preserveDrawingBuffer:false, so a later readPixels returns a cleared buffer.
window.WORMHOLE = { state, R, fit, saveState: store.save, rebuildPanel,
                    renderNow: (sec) => loop.renderNow(1 / 60, sec),
                    get time() { return loop.time; } };
</script>
</body>
</html>
