<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wormhole Lab</title>
<!-- AN INLINE FAVICON, because a browser asks for /favicon.ico whether or not one exists and logs a 404 when it
     does not. A data URI answers the question in the document rather than needing a file beside it. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23070707'/%3E%3Ccircle cx='8' cy='8' r='6' fill='none' stroke='%23ffb454' stroke-width='1'/%3E%3Ccircle cx='8' cy='8' r='3' fill='none' stroke='%23ffb454' stroke-width='1' opacity='.6'/%3E%3Ccircle cx='8' cy='8' r='1' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Archivo:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../kit/panel.css">
<link rel="stylesheet" href="../kit/lab.css">
<!-- Only what is true of this lab; the page shell is lab.css and the panel is panel.css. -->
<style>
  #panel h1{font-size:12px}
  #layers{margin-bottom:2px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="field"></canvas>
  <div id="mast"><div class="t">WORMHOLE&nbsp;LAB</div><div class="s" id="modename">WebGL shader</div></div>
  <div id="hud"><b id="fps">-- FPS</b> <span id="scaleinfo"></span> <span id="glstate"></span><br><span class="dim" id="gpu"></span></div>
</div>
<div id="panel">
  <h1>WORMHOLE FIELD</h1>
  <!-- The layer toggles: any combination may be lit, because the march mixes whatever is enabled by depth. -->
  <div class="btns" id="layers"></div>
  <div class="btns" id="presets"></div>
  <div id="controls"></div>
</div>

<script type="module">
import { createQuad, valueNoiseTexture } from '../kit/glquad.js';
import { createPanel, buildActions, mountPanelToggle } from '../kit/panel.js';
import { persist, fitCanvas, runLoop, textOut, reportNoGL } from '../kit/lab.js';
import { FRAG, UNIFORMS } from './wormhole-shader.js';
import { SECTIONS, FMT, EFFECTS } from './wormhole-sidebar.js';
import { PRESETS, defaultPreset, matchIdx } from './wormhole-presets.js';

const stage = document.getElementById('stage');
// The noise lattice lives in a texture rather than being hashed per sample — see valueNoiseTexture. Built once
// here; glquad re-uploads it if the context is lost.
const R = createQuad(document.getElementById('field'), {
  frag: FRAG, uniforms: UNIFORMS,
  textures: { uNoise: valueNoiseTexture(256) },
  onRestore: () => fit(true),
});
if (!R) { reportNoGL(); throw new Error('WebGL unavailable'); }

// The colour swatches and the three layer flags are not slider rows, so persist() cannot find them from the
// panel layout.
const SWATCHES = ['nebCol', 'nebColB', 'lsCol', 'lsColB', 'plCol', 'plColB'];
const state = defaultPreset(R.gpu);
const store = persist({ key: 'wormhole', version: 3, state, sections: SECTIONS,
                        extra: EFFECTS.map((e) => e.key).concat(SWATCHES) });
store.restore();

const modeEl = document.getElementById('modename');
function syncMode() {
  const on = EFFECTS.filter((e) => state[e.key]).map((e) => e.label);
  const i = matchIdx(state);
  textOut(modeEl, (on.length ? on.join(' + ') : 'ALL LAYERS OFF') + (i < 0 ? '' : ' · ' + PRESETS[i].label));
  syncLayers(); syncPresets();
}

/* The layer strip is multi-select: each button owns one flag and lights off that flag, so any combination can be
 * live at once. buildActions gives exactly this — `lit` is a predicate, not a radio group. */
const syncLayers = buildActions(document.getElementById('layers'),
  EFFECTS.map((e) => [e.label, () => { state[e.key] = state[e.key] ? 0 : 1; syncMode(); store.queueSave(); },
                               () => !!state[e.key]]));

const syncPresets = buildActions(document.getElementById('presets'),
  PRESETS.map((p, i) => [p.label, () => applyPreset(i), () => matchIdx(state) === i]));

function applyPreset(i) {
  Object.assign(state, PRESETS[i].values);
  rebuildPanel(); syncMode(); store.queueSave();
}

// Rebuilt, not updated, and only when a preset lands: panel.js's rows read state once and own their DOM after,
// so a value written from outside leaves its row stale. Folds survive because they live in state.
const host = document.getElementById('controls');
function rebuildPanel() {
  host.innerHTML = '';
  createPanel({ host, state, sections: SECTIONS, fmt: FMT, onChange });
}

function onChange(key, kind) {
  if (key === 'renderScale') fit(true);
  if (kind !== 'fold') syncMode();
  store.queueSave();
}
rebuildPanel();

const scaleEl = document.getElementById('scaleinfo');
const fit = fitCanvas({
  stage, R, scale: () => state.renderScale,
  onFit: (w, h) => textOut(scaleEl, w + '×' + h + ' @ ' + Math.round(state.renderScale * 100) + '%'),
});
fit(true);

mountPanelToggle({ panel: document.getElementById('panel'), onToggle: () => fit(true) });

textOut(document.getElementById('gpu'),
        (R.gpu.integrated ? 'INTEGRATED' : 'DISCRETE') + ' · ' +
        String(R.gpu.name || '?').replace(/^ANGLE \(|\)$/g, '').slice(0, 44));

const fpsEl = document.getElementById('fps'), glEl = document.getElementById('glstate');

// Hex to linear-ish rgb. Cached per string, because six swatches parsed every frame is six string scans for
// values that change when someone opens a colour picker.
const rgbCache = new Map();
function rgb(hex) {
  let v = rgbCache.get(hex);
  if (!v) {
    v = [parseInt(hex.slice(1, 3), 16) / 255, parseInt(hex.slice(3, 5), 16) / 255, parseInt(hex.slice(5, 7), 16) / 255];
    rgbCache.set(hex, v);
  }
  return v;
}
const col3 = (name, hex) => { const c = rgb(hex || '#ffffff'); R.f3(name, c[0], c[1], c[2]); };

function draw(dt, sec) {
  if (R.lost) { textOut(glEl, 'GL CONTEXT LOST'); return; }
  textOut(glEl, '');
  const s = state;

  R.f2('uRes', R.w, R.h);
  R.f('uTime', sec);
  R.f('uSteps', s.steps);
  R.f('uGlow', s.glow); R.f('uChroma', s.chroma); R.f('uVignette', s.vignette); R.f('uExposure', s.exposure);
  R.f('uThroatTint', s.throatTint); R.f('uThroatRays', s.throatRays);

  R.f('uNebOn', s.nebOn ? 1 : 0);
  R.f('uNebMode', s.nebMode); R.f('uNebHue', s.nebHue);
  R.f('uNebDensity', s.nebDensity); R.f('uNebFill', s.nebFill); R.f('uNebFluff', s.nebFluff);
  R.f('uNebStreak', s.nebStreak); R.f('uNebVar', s.nebVar); R.f('uNebScale', s.nebScale); R.f('uNebOct', s.nebOct);
  R.f('uNebSpeed', s.nebSpeed); R.f('uNebTwist', s.nebTwist); R.f('uNebSpin', s.nebSpin); R.f('uNebCov', s.nebCov);
  col3('uNebCol', s.nebCol); col3('uNebColB', s.nebColB);

  R.f('uLsOn', s.lsOn ? 1 : 0);
  R.f('uLsMode', s.lsMode); R.f('uLsHue', s.lsHue);
  R.f('uLsDensity', s.lsDensity); R.f('uLsCount', s.lsCount); R.f('uLsLen', s.lsLen);
  R.f('uLsThick', s.lsThick); R.f('uLsVar', s.lsVar); R.f('uLsRadial', s.lsRadial);
  R.f('uLsSpeed', s.lsSpeed); R.f('uLsTwist', s.lsTwist); R.f('uLsSpin', s.lsSpin); R.f('uLsCov', s.lsCov);
  col3('uLsCol', s.lsCol); col3('uLsColB', s.lsColB);

  R.f('uPlOn', s.plOn ? 1 : 0);
  R.f('uPlMode', s.plMode); R.f('uPlHue', s.plHue);
  R.f('uPlDensity', s.plDensity); R.f('uPlCrackle', s.plCrackle); R.f('uPlCrawl', s.plCrawl);
  R.f('uPlFlash', s.plFlash); R.f('uPlStrike', s.plStrike); R.f('uPlLight', s.plLight);
  R.f('uPlSpeed', s.plSpeed); R.f('uPlTwist', s.plTwist); R.f('uPlSpin', s.plSpin); R.f('uPlCov', s.plCov);
  col3('uPlCol', s.plCol); col3('uPlColB', s.plColB);

  R.draw();
}

const loop = runLoop({ draw, onTick: (fps) => textOut(fpsEl, fps + ' FPS') });

syncMode();

// The handle bench.py and the console reach for. Read pixels in the same task as renderNow — the context is
// preserveDrawingBuffer:false, so a later readPixels returns a cleared buffer.
window.WORMHOLE = { state, R, fit, saveState: store.save, rebuildPanel,
                    renderNow: (sec) => loop.renderNow(1 / 60, sec),
                    get time() { return loop.time; } };
</script>
</body>
</html>
