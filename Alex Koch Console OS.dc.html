<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:#07060a;color:#fff;font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
  a{color:#dd6a20;text-decoration:none}
  a:hover{color:#f0894f}
  @keyframes coRingSpin{to{transform:rotate(360deg)}}
  @keyframes coRingSpinR{to{transform:rotate(-360deg)}}
  @keyframes coCorePulse{0%,100%{transform:scale(1);opacity:.92}50%{transform:scale(1.05);opacity:1}}
  @keyframes coHalo{0%{transform:scale(1);opacity:.5}70%{opacity:0}100%{transform:scale(1.55);opacity:0}}
  @keyframes coHalo2{0%{transform:scale(1);opacity:.35}70%{opacity:0}100%{transform:scale(1.9);opacity:0}}
  @keyframes coSpokeDash{to{stroke-dashoffset:-40}}
  @keyframes coNodeIn{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:scale(1)}}
  @keyframes coFade{0%{opacity:0}100%{opacity:1}}
  @keyframes coRise{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:none}}
  @keyframes coCoreIn{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
  @keyframes coBootLine{0%{opacity:0;transform:translateX(-10px)}100%{opacity:1;transform:none}}
  @keyframes coBlink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes coBar{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
  @keyframes coScan{0%{transform:translateY(-8px);opacity:0}12%{opacity:.9}100%{transform:translateY(90px);opacity:0}}
  @keyframes coTitleIn{0%{opacity:0;letter-spacing:26px;filter:blur(8px)}100%{opacity:1;letter-spacing:8px;filter:blur(0)}}
  @keyframes coFadeOut{0%{opacity:1}100%{opacity:0}}
  @keyframes coNameCycle{0%{opacity:0;letter-spacing:28px;filter:blur(9px)}26%{opacity:1;letter-spacing:8px;filter:blur(0)}68%{opacity:1;letter-spacing:8px;filter:blur(0)}100%{opacity:0;letter-spacing:14px;filter:blur(5px)}}
  @keyframes coSubCycle{0%{opacity:0}30%{opacity:1}66%{opacity:1}100%{opacity:0}}
  @keyframes coType1{from{width:0}to{width:42ch}}
  @keyframes coType2{from{width:0}to{width:45ch}}
  @keyframes coType3{from{width:0}to{width:38ch}}
  @keyframes coType4{from{width:0}to{width:23ch}}
</style>
</helmet>

<div style="position:relative;width:100%;height:100vh;overflow:hidden;background:radial-gradient(120% 100% at 50% 42%,#150c06 0%,#0a0709 55%,#060509 100%)">

  <!-- ================= HERO / OS MENU ================= -->
  <section style="position:absolute;inset:0;overflow:hidden">

    <!-- ambient far rings -->
    <div style="position:absolute;top:50%;left:50%;width:min(150vh,1500px);height:min(150vh,1500px);transform:translate(-50%,-50%);pointer-events:none;opacity:.5">
      <svg viewBox="0 0 800 800" style="width:100%;height:100%">
        <circle cx="400" cy="400" r="380" fill="none" stroke="rgba(221,106,32,.06)" stroke-width="1"></circle>
        <circle cx="400" cy="400" r="300" fill="none" stroke="rgba(221,106,32,.05)" stroke-width="1" stroke-dasharray="2 12" style="transform-origin:400px 400px;animation:coRingSpin 90s linear infinite"></circle>
      </svg>
    </div>

    <!-- top bar -->
    <nav style="position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:24px 34px;font-family:'JetBrains Mono';font-size:12px;letter-spacing:1px;z-index:8;opacity:0;animation: {{ aNav }}">
      <span style="color:#fff;font-weight:700">ALEXK413X<span style="color:#dd6a20">_OS</span></span>
      <div style="display:flex;gap:12px;align-items:center">
        <button onClick="{{ restart }}" style="font-family:'JetBrains Mono';font-size:11px;letter-spacing:1px;color:rgba(255,255,255,.7);background:rgba(20,16,12,.7);border:1px solid rgba(221,106,32,.4);border-radius:7px;padding:8px 12px;cursor:pointer" style-hover="border-color:#dd6a20;color:#fff">↻ REBOOT</button>
      </div>
    </nav>

    <!-- stage: core + radial menu -->
    <div style="position:absolute;top:calc(50% - 40px);left:50%;transform:translate(-50%,-50%);width:min(74vh,680px);height:min(74vh,680px)">

      <!-- spokes + orbit -->
      <svg viewBox="0 0 100 100" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;opacity:0;animation: {{ aSpokes }}">
        <circle cx="50" cy="50" r="35" fill="none" stroke="rgba(221,106,32,.14)" stroke-width=".4" stroke-dasharray="1.2 2.4" style="transform-origin:50px 50px;animation:coRingSpin 60s linear infinite"></circle>
        <g stroke="#dd6a20" stroke-width=".5" stroke-dasharray="2 3" opacity=".5" style="animation:coSpokeDash 3s linear infinite">
          <line x1="50" y1="50" x2="50" y2="15"></line>
          <line x1="50" y1="50" x2="85" y2="50"></line>
          <line x1="50" y1="50" x2="50" y2="85"></line>
          <line x1="50" y1="50" x2="15" y2="50"></line>
        </g>
      </svg>

      <!-- CORE -->
      <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:196px;height:196px">
        <div style="width:100%;height:100%;position:relative;opacity:0;animation: {{ aCore }}">
          <svg viewBox="0 0 200 200" style="position:absolute;inset:0;width:100%;height:100%">
            <circle cx="100" cy="100" r="94" fill="none" stroke="rgba(221,106,32,.5)" stroke-width="1.5" stroke-dasharray="2 9" style="transform-origin:100px 100px;animation:coRingSpin 14s linear infinite"></circle>
            <circle cx="100" cy="100" r="80" fill="none" stroke="rgba(240,168,120,.28)" stroke-width="1" stroke-dasharray="1 7" style="transform-origin:100px 100px;animation:coRingSpinR 20s linear infinite"></circle>
            <circle cx="100" cy="100" r="72" fill="none" stroke="rgba(221,106,32,.9)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="150 452" style="transform-origin:100px 100px;animation:coRingSpin 8s linear infinite;filter:drop-shadow(0 0 5px rgba(221,106,32,.8))"></circle>
          </svg>
          <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:118px;height:118px;border-radius:50%;background:radial-gradient(circle at 48% 40%,#fff2e4 0%,#ffb26a 24%,#dd6a20 54%,#7d3407 82%,#2a1305 100%);box-shadow:0 0 40px 10px rgba(221,106,32,.55),0 0 90px 24px rgba(221,106,32,.28),inset 0 -8px 22px rgba(0,0,0,.45),inset 0 6px 18px rgba(255,220,180,.6);animation:coCorePulse 3.4s ease-in-out infinite;display:flex;align-items:center;justify-content:center">
            <span style="font-family:'Archivo';font-weight:900;font-size:38px;color:#2a1305;letter-spacing:-1px;text-shadow:0 1px 1px rgba(255,220,180,.5)">AK</span>
          </div>

      </div>

      <!-- NODE: THE APP (top) -->
      <div style="position:absolute;top:15%;left:50%;transform:translate(-50%,-50%)">
        <button onClick="{{ noop }}" onMouseEnter="{{ onApp }}" onMouseLeave="{{ onLeave }}" style="position:relative;width:132px;height:132px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:radial-gradient(circle at 50% 38%,rgba(46,30,16,.92),rgba(12,10,13,.94));border:1px solid rgba(221,106,32,.35);box-shadow:0 0 0 1px rgba(221,106,32,.08),0 0 34px rgba(221,106,32,.14),inset 0 0 26px rgba(221,106,32,.08);color:#fff;cursor:pointer;transition:transform .34s cubic-bezier(.2,.85,.25,1),box-shadow .34s,border-color .34s;opacity:1;animation: {{ aN1 }}" style-hover="transform:scale(1.13);border-color:#dd6a20;box-shadow:0 0 0 1px rgba(221,106,32,.55),0 0 60px rgba(221,106,32,.5),inset 0 0 40px rgba(221,106,32,.24)">
          <span style="position:absolute;inset:-1px;border-radius:50%;border:1px solid rgba(221,106,32,.4);animation:coHalo 3.2s ease-out infinite;pointer-events:none"></span>
          <span style="font-family:'JetBrains Mono';font-size:10px;color:#eda863;letter-spacing:2px">01</span>
          <span style="font-family:'Space Grotesk';font-weight:600;font-size:14px;letter-spacing:1px">THE APP</span>
        </button>
      </div>

      <!-- NODE: SKILLS (right) -->
      <div style="position:absolute;top:50%;left:85%;transform:translate(-50%,-50%)">
        <button onClick="{{ noop }}" onMouseEnter="{{ onSkills }}" onMouseLeave="{{ onLeave }}" style="position:relative;width:132px;height:132px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:radial-gradient(circle at 50% 38%,rgba(46,30,16,.92),rgba(12,10,13,.94));border:1px solid rgba(221,106,32,.35);box-shadow:0 0 0 1px rgba(221,106,32,.08),0 0 34px rgba(221,106,32,.14),inset 0 0 26px rgba(221,106,32,.08);color:#fff;cursor:pointer;transition:transform .34s cubic-bezier(.2,.85,.25,1),box-shadow .34s,border-color .34s;opacity:1;animation: {{ aN2 }}" style-hover="transform:scale(1.13);border-color:#dd6a20;box-shadow:0 0 0 1px rgba(221,106,32,.55),0 0 60px rgba(221,106,32,.5),inset 0 0 40px rgba(221,106,32,.24)">
          <span style="position:absolute;inset:-1px;border-radius:50%;border:1px solid rgba(221,106,32,.4);animation:coHalo 3.2s .8s ease-out infinite;pointer-events:none"></span>
          <span style="font-family:'JetBrains Mono';font-size:10px;color:#eda863;letter-spacing:2px">02</span>
          <span style="font-family:'Space Grotesk';font-weight:600;font-size:14px;letter-spacing:1px">SKILLS</span>
        </button>
      </div>

      <!-- NODE: ABOUT (bottom) -->
      <div style="position:absolute;top:85%;left:50%;transform:translate(-50%,-50%)">
        <button onClick="{{ noop }}" onMouseEnter="{{ onAbout }}" onMouseLeave="{{ onLeave }}" style="position:relative;width:132px;height:132px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:radial-gradient(circle at 50% 38%,rgba(46,30,16,.92),rgba(12,10,13,.94));border:1px solid rgba(221,106,32,.35);box-shadow:0 0 0 1px rgba(221,106,32,.08),0 0 34px rgba(221,106,32,.14),inset 0 0 26px rgba(221,106,32,.08);color:#fff;cursor:pointer;transition:transform .34s cubic-bezier(.2,.85,.25,1),box-shadow .34s,border-color .34s;opacity:1;animation: {{ aN3 }}" style-hover="transform:scale(1.13);border-color:#dd6a20;box-shadow:0 0 0 1px rgba(221,106,32,.55),0 0 60px rgba(221,106,32,.5),inset 0 0 40px rgba(221,106,32,.24)">
          <span style="position:absolute;inset:-1px;border-radius:50%;border:1px solid rgba(221,106,32,.4);animation:coHalo 3.2s 1.6s ease-out infinite;pointer-events:none"></span>
          <span style="font-family:'JetBrains Mono';font-size:10px;color:#eda863;letter-spacing:2px">03</span>
          <span style="font-family:'Space Grotesk';font-weight:600;font-size:14px;letter-spacing:1px">ABOUT</span>
        </button>
      </div>

      <!-- NODE: WORK (left) -->
      <div style="position:absolute;top:50%;left:15%;transform:translate(-50%,-50%)">
        <button onClick="{{ noop }}" onMouseEnter="{{ onWork }}" onMouseLeave="{{ onLeave }}" style="position:relative;width:132px;height:132px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:radial-gradient(circle at 50% 38%,rgba(46,30,16,.92),rgba(12,10,13,.94));border:1px solid rgba(221,106,32,.35);box-shadow:0 0 0 1px rgba(221,106,32,.08),0 0 34px rgba(221,106,32,.14),inset 0 0 26px rgba(221,106,32,.08);color:#fff;cursor:pointer;transition:transform .34s cubic-bezier(.2,.85,.25,1),box-shadow .34s,border-color .34s;opacity:1;animation: {{ aN4 }}" style-hover="transform:scale(1.13);border-color:#dd6a20;box-shadow:0 0 0 1px rgba(221,106,32,.55),0 0 60px rgba(221,106,32,.5),inset 0 0 40px rgba(221,106,32,.24)">
          <span style="position:absolute;inset:-1px;border-radius:50%;border:1px solid rgba(221,106,32,.4);animation:coHalo 3.2s 2.4s ease-out infinite;pointer-events:none"></span>
          <span style="font-family:'JetBrains Mono';font-size:10px;color:#eda863;letter-spacing:2px">04</span>
          <span style="font-family:'Space Grotesk';font-weight:600;font-size:14px;letter-spacing:1px">WORK</span>
        </button>
      </div>

    </div>

    <!-- READOUT BLADE -->
    <div style="position:absolute;bottom:40px;left:50%;transform:translateX(-50%);width:min(560px,86vw);z-index:6;pointer-events:none;opacity:0;animation: {{ aReadout }}">
      <div style="position:relative;display:flex;gap:16px;align-items:stretch;background:linear-gradient(180deg,rgba(22,15,10,.86),rgba(11,9,12,.86));border:1px solid rgba(221,106,32,.32);border-radius:12px;padding:16px 20px;backdrop-filter:blur(8px);box-shadow:0 20px 50px -20px rgba(0,0,0,.7)">
        <div style="width:3px;border-radius:3px;background:linear-gradient(180deg,#ffd9b3,#dd6a20);box-shadow:0 0 12px rgba(221,106,32,.7);opacity: {{ accentA }}"></div>
        <div style="flex:1;min-width:0">
          <div style="font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:2px;color:#eda863">{{ rTag }}</div>
          <div style="font-family:'Archivo';font-weight:800;font-size:26px;line-height:1.05;margin-top:3px;color:#fff">{{ rTitle }}</div>
          <div style="font-family:'Space Grotesk';font-size:13.5px;line-height:1.5;color:rgba(255,255,255,.62);margin-top:5px">{{ rDesc }}</div>
        </div>
        <sc-if value="{{ rHasCta }}" hint-placeholder-val="{{ true }}">
          <a href="{{ rHref }}" style="align-self:center;flex:none;pointer-events:auto;font-family:'Archivo';font-weight:800;font-size:12.5px;letter-spacing:.5px;background:#dd6a20;color:#180a03;padding:11px 15px;border-radius:8px;white-space:nowrap" style-hover="background:#f0894f">{{ rCta }}</a>
        </sc-if>
      </div>
    </div>

    <!-- corner tickers -->
    <div style="position:absolute;bottom:20px;left:34px;font-family:'JetBrains Mono';font-size:11px;letter-spacing:1px;color:rgba(255,255,255,.32);z-index:6;opacity:0;animation: {{ aNav }}">AGENTIC&nbsp;OS · v4.13</div>
    <div style="position:absolute;bottom:20px;right:34px;font-family:'JetBrains Mono';font-size:11px;letter-spacing:1px;color:rgba(255,255,255,.32);z-index:6;display:flex;align-items:center;gap:7px;opacity:0;animation: {{ aNav }}"><span style="width:7px;height:7px;border-radius:50%;background:#3fbf6a;box-shadow:0 0 8px #3fbf6a;animation:coCorePulse 2s ease-in-out infinite"></span>CORE ONLINE</div>

  </section>

  <!-- ================= BOOT OVERLAY ================= -->
  <sc-if value="{{ showBoot }}" hint-placeholder-val="{{ true }}">
    <div onClick="{{ skip }}" style="position:fixed;inset:0;z-index:100;background:#060509;overflow:hidden;cursor:pointer;transition:opacity .8s ease;opacity: {{ bootOpacity }}">
      <canvas id="co_cv" style="position:absolute;inset:0;width:100%;height:100%;display:block"></canvas>

      <!-- name interstitial (fades in then out, on its own) -->
      <div style="position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);text-align:center;pointer-events:none">
        <div style="font-family:'Archivo';font-weight:900;font-size:clamp(34px,5.4vw,60px);color:#fff;letter-spacing:8px;opacity:0;animation: {{ aName }};text-shadow:0 0 34px rgba(221,106,32,.55)">ALEX KOCH</div>
        <div style="font-family:'JetBrains Mono';font-size:13px;letter-spacing:6px;color:#eda863;margin-top:12px;opacity:0;animation: {{ aSub }}">AGENTIC&nbsp;OS</div>
      </div>

      <!-- boot log (typed in char-by-char via JS; fades out after loading) -->
      <div id="co_log" style="position:absolute;left:34px;bottom:74px;font-family:'JetBrains Mono';font-size:12px;line-height:1.9;color:#eda863;pointer-events:none;opacity:1;animation: {{ aLoadFade }}"></div>

      <!-- progress bar (fills over 6s beneath the name) -->
      <div style="position:absolute;left:34px;right:34px;bottom:56px;height:2px;background:rgba(221,106,32,.16);border-radius:2px;overflow:hidden;opacity:1;animation: {{ aLoadFade }}">
        <div style="height:100%;background:linear-gradient(90deg,#dd6a20,#ffd9b3);transform-origin:left;transform:scaleX(0);animation: {{ aBar }}"></div>
      </div>

      <div style="position:absolute;top:26px;right:30px;font-family:'JetBrains Mono';font-size:11px;letter-spacing:2px;color:rgba(255,255,255,.4);pointer-events:none">CLICK TO SKIP</div>
    </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;skipIntro&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;}}">
class Component extends DCLogic {
  state = { reveal: false, done: false, active: null, typed: false, loadFade: false };

  MOD = {
    app:    { tag: 'MODULE 01 // THE APP', title: 'RPN Dominator', desc: 'A ruthlessly opinionated RPN calculator — stack-first, keyboard-fast, live on the Play Store.', cta: 'Launch ↗', href: '#' },
    skills: { tag: 'MODULE 02 // SKILLS', title: 'Stack & Systems', desc: 'Kotlin · Jetpack Compose · Multi-Agent AI · Python · Claude Code · Firebase.', cta: 'Inspect →', href: '#skills' },
    about:  { tag: 'MODULE 03 // ABOUT', title: 'Operator File', desc: 'Agentic engineer architecting multi-agent QA platforms that generate, execute & self-heal 500+ tests.', cta: 'Read →', href: '#about' },
    work:   { tag: 'MODULE 04 // WORK', title: 'Selected Work', desc: "11+ years shipping mobile at scale — Target myDay (100k+ DAU), Kohl's & Yahoo.", cta: 'Open →', href: '#work' },
  };

  componentDidMount() {
    if (this.props.skipIntro) { this.setState({ done: true, reveal: true }); return; }
    this.buildParticles();
    this.run();
  }
  componentWillUnmount() { this.stop(); window.removeEventListener('resize', this._resize); document.body.style.overflow = ''; }

  // ---------- timeline ----------
  PULSE = 6500;

  push(id) { (this.timers || (this.timers = [])).push(id); return id; }

  run() {
    this.stop();
    document.body.style.overflow = 'hidden';
    this.timers = []; this.reactorT0 = null;
    this.cv = document.getElementById('co_cv');
    if (!this.cv) { this._retry = setTimeout(() => this.run(), 40); return; }
    this.ctx = this.cv.getContext('2d');
    this.resize();
    if (!this._resize) { this._resize = () => this.resize(); window.addEventListener('resize', this._resize); }
    this.start = performance.now(); this.last = this.start; this.flashed = false; this.pulseRings = [];
    this.raf = requestAnimationFrame(this.frame);
    this.typeLines();
  }
  stop() { cancelAnimationFrame(this.raf); clearTimeout(this.skipTimer); clearTimeout(this._retry); (this.timers || []).forEach(clearTimeout); this.timers = []; }

  LINES = [
    [{ t: '> booting AGENTIC OS v4.13 ............ ', c: '#eda863' }, { t: 'OK', c: '#3fbf6a' }],
    [{ t: '> mounting modules [work·app·skills·about] ', c: '#eda863' }, { t: 'OK', c: '#3fbf6a' }],
    [{ t: '> operator: ', c: '#eda863' }, { t: 'ALEX KOCH', c: '#fff4ec' }, { t: ' · clearance ', c: '#eda863' }, { t: '413X', c: '#fff4ec' }],
    [{ t: '> charging reactor core', c: '#eda863' }],
  ];

  typeLines() {
    const cont = document.getElementById('co_log');
    if (!cont) { this.push(setTimeout(() => this.typeLines(), 40)); return; }
    cont.innerHTML = '';
    const els = this.LINES.map(() => { const d = document.createElement('div'); cont.appendChild(d); return d; });
    const CARET = '<span style="display:inline-block;width:8px;height:14px;background:#dd6a20;margin-left:2px;vertical-align:-2px"></span>';
    const BLINK = '<span style="display:inline-block;width:8px;height:14px;background:#dd6a20;margin-left:2px;vertical-align:-2px;animation:coBlink 1s steps(1) infinite"></span>';
    const render = (segs, n, caret) => {
      let html = '', count = 0;
      for (const s of segs) {
        if (count >= n) break;
        const take = Math.min(s.t.length, n - count);
        html += '<span style="color:' + s.c + '">' + s.t.slice(0, take) + '</span>';
        count += take;
      }
      return html + caret;
    };
    let li = 0;
    const typeLine = () => {
      const segs = this.LINES[li], el = els[li], full = segs.reduce((a, s) => a + s.t, '');
      let i = 0;
      const step = () => {
        i++; el.innerHTML = render(segs, i, CARET);
        if (i < full.length) {
          const ch = full[i - 1]; let d = 16 + Math.random() * 34;
          if (ch === ' ') d += Math.random() * 28;
          if ('.,:·['.indexOf(ch) >= 0) d += 18 + Math.random() * 55;
          if (Math.random() < 0.05) d += 80 + Math.random() * 120;
          this.push(setTimeout(step, d));
        } else {
          li++;
          if (li < this.LINES.length) { el.innerHTML = render(segs, i, ''); this.push(setTimeout(typeLine, 220 + Math.random() * 280)); }
          else { el.innerHTML = render(segs, i, BLINK); this.onTypedDone(); }
        }
      };
      step();
    };
    typeLine();
  }

  onTypedDone() {
    if (this.state.typed) return;
    this.setState({ typed: true });
    const BAR = 6000, WAIT = 2500;
    this.push(setTimeout(() => this.setState({ loadFade: true }), BAR));
    this.push(setTimeout(() => this.startReactor(), BAR + WAIT));
  }
  startReactor() {
    this.reactorT0 = performance.now(); this.flashed = false; this.explode = 0; this.shards = [];
    this._pph = Math.random() * 10; this._prevOsc = null; this._wasRising = false; this.pulseRings = [];
    this.push(setTimeout(() => this.doReveal(), this.PULSE + 280));
    this.push(setTimeout(() => this.finish(), this.PULSE + 1200));
  }

  resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    this.W = Math.floor(window.innerWidth * dpr); this.H = Math.floor(window.innerHeight * dpr);
    if (this.cv) { this.cv.width = this.W; this.cv.height = this.H; }
    this.cx = this.W / 2; this.cy = this.H / 2;
  }

  buildParticles() {
    this.parts = [];
    for (let i = 0; i < 360; i++) {
      const tint = Math.random();
      this.parts.push({
        a0: Math.random() * 6.2832,
        r0: 0.45 + Math.random() * 1.05,
        turns: 1.2 + Math.random() * 3.0,
        dir: Math.random() < 0.5 ? 1 : -1,
        delay: Math.random() * 1500,
        size: 0.6 + Math.random() * 2.4,
        c: tint < 0.5 ? [255, 216, 176] : (tint < 0.82 ? [240, 150, 80] : [221, 106, 32]),
      });
    }
    this.arcs = [{ r: 1.05, w: 3, s: 0.0016, o: 0.5 }, { r: 0.82, w: 2, s: -0.0022, o: 0.4 }, { r: 1.25, w: 2, s: 0.0012, o: 0.3 }, { r: 0.62, w: 1.5, s: 0.0028, o: 0.28 }, { r: 1.45, w: 1.5, s: -0.0014, o: 0.22 }];
    this.orbs = [];
    for (let i = 0; i < 13; i++) this.orbs.push({
      ang: Math.random() * 6.2832,
      base: 1.25 + Math.random() * 1.25,
      sp: (0.45 + Math.random() * 1.15) * (Math.random() < 0.5 ? 1 : -1),
      ell: 0.3 + Math.random() * 0.42,
      tilt: Math.random() * 6.2832,
      wf: 0.25 + Math.random() * 0.5,
      wa: 0.02 + Math.random() * 0.06,
      wp: Math.random() * 6.2832,
      ecc: 0.08 + Math.random() * 0.22,
      sz: 0.9 + Math.random() * 1.5,
    });
  }

  ease(t) { t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * (3 - 2 * t); }
  easeIn(t) { t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t; }

  frame = (now) => {
    let t = now - this.start; const ctx = this.ctx, W = this.W, H = this.H, cx = this.cx, cy = this.cy, TAU = 6.2832;
    const dt = Math.min(64, now - this.last); this.last = now;
    const maxR = Math.hypot(W, H) * 0.5;
    ctx.clearRect(0, 0, W, H);

    // bg
    const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR);
    bg.addColorStop(0, 'rgb(22,13,7)'); bg.addColorStop(0.55, 'rgb(10,7,9)'); bg.addColorStop(1, 'rgb(5,4,8)');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    const orbR = Math.min(W, H) * 0.085;
    if (!this.reactorT0) {
      const vg0 = ctx.createRadialGradient(cx, cy, H * 0.2, cx, cy, H * 0.85);
      vg0.addColorStop(0, 'rgba(0,0,0,0)'); vg0.addColorStop(1, 'rgba(3,2,6,0.6)');
      ctx.fillStyle = vg0; ctx.fillRect(0, 0, W, H);
      this.raf = requestAnimationFrame(this.frame); return;
    }
    t = now - this.reactorT0;
    ctx.globalCompositeOperation = 'lighter';

    // ---- pulsing reactor: irregular, starts slow, ramps up, builds to a flash ----
    const PULSE = this.PULSE;
    let power, cScale, flashA = 0, bt = 0, osc = 0;
    if (t < PULSE) {
      bt = t / PULSE;
      this._pph += dt * 0.001 * (0.24 + bt * bt * 2.1);  // pulse speed ramps up slowly
      const s = this._pph;
      let w = 0.5 * Math.sin(s) + 0.32 * Math.sin(s * 1.73 + 1.3) + 0.24 * Math.sin(s * 2.91 + 2.1) + 0.14 * Math.sin(s * 4.7 + 0.6);
      osc = Math.max(0, Math.min(1, (w / 1.2 + 1) / 2));  // uneven, unpredictable
      const base = 0.08 + 0.30 * bt, amp = 0.2 + 0.58 * bt;
      power = base + amp * osc;
      cScale = 0.55 + 0.3 * bt + (0.7 + 0.5 * bt) * (osc - 0.45);
      const surge = bt > 0.7 ? (bt - 0.7) / 0.3 : 0;      // final charge-up into the flash
      power += surge * surge * 0.75; cScale += surge * surge * 1.35;
      if (this._prevOsc != null) {                        // ring only on real peaks
        const rising = osc > this._prevOsc;
        if (this._wasRising && !rising && osc > 0.62) { this.pulseRings.push({ born: t, str: 0.28 + 0.6 * osc * bt }); }
        this._wasRising = rising;
      }
      this._prevOsc = osc;
    } else {
      this.explode = (t - PULSE) / 900;                   // explosion progress 0..1+
      flashA = Math.max(0, 1 - this.explode * 1.5);        // sharp flash, fast decay
      power = 1.2 * Math.max(0, 1 - this.explode);
      cScale = 1;
      if (!this.flashed) { this.flashed = true; this.spawnBurst(); }
    }
    const gR = orbR * cScale;

    // faint gathering filaments
    for (const arc of this.arcs) {
      const rr = arc.r * maxR * 0.32 * (1 - bt * 0.4);
      ctx.strokeStyle = 'rgba(221,106,32,' + (arc.o * (0.10 + power * 0.22)) + ')';
      ctx.lineWidth = arc.w; ctx.beginPath();
      const st = t * arc.s; ctx.arc(cx, cy, rr, st, st + 2.4); ctx.stroke();
    }

    // expanding shock ring per pulse peak
    for (const r of this.pulseRings) {
      const age = (t - r.born) / 720; if (age > 1) continue;
      const rr = orbR * 0.7 + age * maxR * 0.55;
      ctx.strokeStyle = 'rgba(255,196,140,' + ((1 - age) * r.str) + ')';
      ctx.lineWidth = 2.5 * (1 - age) + 0.4;
      ctx.beginPath(); ctx.arc(cx, cy, rr, 0, TAU); ctx.stroke();
    }
    this.pulseRings = this.pulseRings.filter(r => (t - r.born) < 760);

    // soft glow halo around the ball
    const glow = ctx.createRadialGradient(cx, cy, gR * 0.3, cx, cy, gR * 3.4);
    glow.addColorStop(0, 'rgba(255,190,120,' + Math.min(0.9, 0.35 + power * 0.5) + ')');
    glow.addColorStop(0.4, 'rgba(221,106,32,' + Math.min(0.7, 0.22 + power * 0.45) + ')');
    glow.addColorStop(1, 'rgba(221,106,32,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx, cy, gR * 3.4, 0, TAU); ctx.fill();

    // compute orbiter positions, split behind / in front of the core for depth
    const od = [];
    for (const o of this.orbs) {
      o.ang += dt * 0.001 * o.sp * (1 + o.ecc * Math.cos(o.ang));   // uneven angular speed
      const wob = 1 + o.wa * Math.sin(t * 0.001 * o.wf + o.wp);
      const rr = orbR * o.base * wob + gR * 0.12;
      const ct = Math.cos(o.tilt), stg = Math.sin(o.tilt);
      const ex = Math.cos(o.ang) * rr, ey = Math.sin(o.ang) * rr * o.ell;
      const x = cx + ex * ct - ey * stg, y = cy + ex * stg + ey * ct;
      const dir = o.sp < 0 ? -1 : 1, pa = o.ang - dir * 0.32;
      const ex2 = Math.cos(pa) * rr, ey2 = Math.sin(pa) * rr * o.ell;
      const x2 = cx + ex2 * ct - ey2 * stg, y2 = cy + ex2 * stg + ey2 * ct;
      const front = (Math.sin(o.ang) + 1) / 2;
      od.push({ x, y, x2, y2, sz: o.sz * (0.45 + 0.7 * front), al: 0.18 + 0.5 * front, front });
    }
    const drawOrb = (d) => {
      ctx.strokeStyle = 'rgba(255,210,166,' + (d.al * (0.4 + power * 0.35)) + ')'; ctx.lineWidth = d.sz * 0.65; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(d.x2, d.y2); ctx.lineTo(d.x, d.y); ctx.stroke();
      ctx.fillStyle = 'rgba(255,242,226,' + (d.al * 0.92) + ')'; ctx.beginPath(); ctx.arc(d.x, d.y, d.sz, 0, TAU); ctx.fill();
    };
    for (const d of od) if (d.front < 0.5) drawOrb(d);   // behind the core

    // solid hexagonal core — a real object that pulses, with an inner glow
    if (t < PULSE) {
      const sr = gR, rot = t * 0.0003;
      const hex = (r) => { ctx.beginPath(); for (let i = 0; i < 6; i++) { const a = rot + i * Math.PI / 3, px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); } ctx.closePath(); };
      ctx.globalCompositeOperation = 'source-over';
      const sph = ctx.createRadialGradient(cx - sr * 0.28, cy - sr * 0.34, sr * 0.06, cx, cy, sr);
      sph.addColorStop(0, '#fff4e8'); sph.addColorStop(0.32, '#ffb85f'); sph.addColorStop(0.64, '#dd6a20'); sph.addColorStop(0.88, '#8a3c0b'); sph.addColorStop(1, '#341706');
      hex(sr); ctx.fillStyle = sph; ctx.fill();
      hex(sr); ctx.strokeStyle = 'rgba(255,228,196,' + (0.3 + power * 0.5) + ')'; ctx.lineWidth = 1.6; ctx.stroke();
      ctx.globalCompositeOperation = 'lighter';
      const ig = ctx.createRadialGradient(cx, cy, 0, cx, cy, sr * 1.3);
      ig.addColorStop(0, 'rgba(255,224,184,' + (0.35 + power * 0.45) + ')'); ig.addColorStop(0.55, 'rgba(255,168,96,' + (0.12 + power * 0.22) + ')'); ig.addColorStop(1, 'rgba(255,150,90,0)');
      ctx.fillStyle = ig; ctx.beginPath(); ctx.arc(cx, cy, sr * 1.3, 0, TAU); ctx.fill();
    }
    for (const d of od) if (d.front >= 0.5) drawOrb(d);  // in front of the core

    // explosion burst — shards + fast rings + expanding flare
    if (t >= PULSE) {
      const e = 1 - Math.pow(1 - Math.min(1, this.explode / 0.6), 3), fade = Math.max(0, 1 - this.explode);
      for (const sh of this.shards) {
        const d0 = orbR * 0.5 + e * maxR * sh.v, d1 = d0 + maxR * sh.len * (0.4 + fade);
        ctx.strokeStyle = 'rgba(' + sh.c[0] + ',' + sh.c[1] + ',' + sh.c[2] + ',' + (fade * 0.95) + ')';
        ctx.lineWidth = sh.w * fade + 0.3; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(cx + Math.cos(sh.ang) * d0, cy + Math.sin(sh.ang) * d0); ctx.lineTo(cx + Math.cos(sh.ang) * d1, cy + Math.sin(sh.ang) * d1); ctx.stroke();
      }
      for (let k = 0; k < 3; k++) {
        const re = this.explode / 0.5 - k * 0.14;
        if (re > 0 && re < 1) { ctx.strokeStyle = 'rgba(255,208,158,' + ((1 - re) * 0.85) + ')'; ctx.lineWidth = (1 - re) * 5 + 0.5; ctx.beginPath(); ctx.arc(cx, cy, re * maxR * 0.9, 0, TAU); ctx.stroke(); }
      }
      const bs = orbR * (1 + e * 3.2), ba = Math.max(0, 1 - this.explode * 1.7);
      const bgr = ctx.createRadialGradient(cx, cy, 0, cx, cy, bs);
      bgr.addColorStop(0, 'rgba(255,246,230,' + ba + ')'); bgr.addColorStop(0.5, 'rgba(255,180,110,' + (ba * 0.7) + ')'); bgr.addColorStop(1, 'rgba(255,150,90,0)');
      ctx.fillStyle = bgr; ctx.beginPath(); ctx.arc(cx, cy, bs, 0, TAU); ctx.fill();
    }

    // plasma flares (more at high power)
    for (let k = 0; k < 3; k++) {
      if (Math.random() < 0.04 + power * 0.14) {
        const fa = Math.random() * TAU, len = gR * (1.3 + Math.random() * 1.5);
        ctx.strokeStyle = 'rgba(255,206,158,' + (0.25 + Math.random() * 0.35) + ')'; ctx.lineWidth = 1 + Math.random() * 1.3;
        ctx.beginPath(); ctx.moveTo(cx + Math.cos(fa) * gR * 0.8, cy + Math.sin(fa) * gR * 0.8); ctx.lineTo(cx + Math.cos(fa) * len, cy + Math.sin(fa) * len); ctx.stroke();
      }
    }

    ctx.globalCompositeOperation = 'source-over';

    // containment ring
    ctx.strokeStyle = 'rgba(221,106,32,' + (0.28 + power * 0.4) + ')'; ctx.lineWidth = 2;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * 0.0007);
    ctx.setLineDash([4, 12]); ctx.beginPath(); ctx.arc(0, 0, gR * 1.9, 0, TAU); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();

    // vignette
    const vg = ctx.createRadialGradient(cx, cy, H * 0.2, cx, cy, H * 0.85);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(3,2,6,0.6)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

    if (flashA > 0) { ctx.fillStyle = 'rgba(255,240,220,' + (flashA * 0.96) + ')'; ctx.fillRect(0, 0, W, H); }

    this.raf = requestAnimationFrame(this.frame);
  };

  doReveal() { if (!this.state.reveal) this.setState({ reveal: true }); }
  finish = () => { if (this.state.done) return; cancelAnimationFrame(this.raf); document.body.style.overflow = ''; this.setState({ done: true }); };
  skip = () => { this.doReveal(); (this.timers || []).forEach(clearTimeout); this.timers = []; this.skipTimer = setTimeout(this.finish, 820); };
  restart = () => { this.stop(); this.reactorT0 = null; this.setState({ reveal: false, done: false, active: null, typed: false, loadFade: false }); setTimeout(() => this.run(), 60); };
  noop = (e) => { if (e) e.preventDefault(); };

  // ---------- hover ----------
  setActive(k) { this.setState({ active: k }); }
  onApp = () => this.setActive('app');
  onSkills = () => this.setActive('skills');
  onAbout = () => this.setActive('about');
  onWork = () => this.setActive('work');
  onLeave = () => this.setState({ active: null });

  spawnBurst() {
    this.shards = [];
    for (let i = 0; i < 48; i++) this.shards.push({ ang: Math.random() * 6.2832, v: 0.55 + Math.random() * 0.75, w: 0.8 + Math.random() * 2.6, len: 0.05 + Math.random() * 0.14, c: Math.random() < 0.45 ? [255, 242, 222] : [255, 178, 108] });
  }
  renderVals() {
    const rv = this.state.reveal, a = this.state.active, m = a ? this.MOD[a] : null;
    return {
      showBoot: !this.state.done,
      bootOpacity: rv ? 0 : 1,
      aName: this.state.typed ? 'coNameCycle 6s .1s both' : '',
      aSub: this.state.typed ? 'coSubCycle 5s .6s both' : '',
      aBar: this.state.typed ? 'coBar 6s 0s cubic-bezier(.4,0,.3,1) both' : '',
      aLoadFade: this.state.loadFade ? 'coFadeOut .8s 0s both' : '',
      skip: this.skip, restart: this.restart, noop: this.noop,
      onApp: this.onApp, onSkills: this.onSkills, onAbout: this.onAbout, onWork: this.onWork, onLeave: this.onLeave,
      // readout
      rTag: m ? m.tag : 'AGENTIC OS // ONLINE',
      rTitle: m ? m.title : 'Alex Koch',
      rDesc: m ? m.desc : 'Agentic engineer. Orbit a module to inspect the system.',
      rHasCta: !!m,
      rCta: m ? m.cta : '',
      rHref: m ? m.href : '#',
      accentA: a ? 1 : 0.4,
      // entrance animations
      aNav: rv ? 'coFade .9s 1.3s both' : '',
      aSpokes: rv ? 'coFade 1s .7s both' : '',
      aCore: rv ? 'coCoreIn 1s .1s cubic-bezier(.2,.9,.25,1) both' : '',
      aN1: rv ? 'coNodeIn .6s .55s cubic-bezier(.3,1.3,.5,1) backwards' : '',
      aN2: rv ? 'coNodeIn .6s .7s cubic-bezier(.3,1.3,.5,1) backwards' : '',
      aN3: rv ? 'coNodeIn .6s .85s cubic-bezier(.3,1.3,.5,1) backwards' : '',
      aN4: rv ? 'coNodeIn .6s 1s cubic-bezier(.3,1.3,.5,1) backwards' : '',
      aReadout: rv ? 'coRise .8s 1.2s both' : '',
    };
  }
}
</script>
</body>
</html>
