<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open Graph card &middot; Alex Koch</title>

<!-- THE SOURCE OF site/og-card.png, AND THE ONLY PLACE THE CARD IS DESIGNED.
     The card used to be a committed PNG with nothing behind it: no template, no script, no way to change a word
     without opening a bitmap editor. Render it with `python og-card.py`, which writes the PNG beside this file.

     THIS IS NOT A BUILD STEP. The PNG stays committed and is what scrapers fetch; nothing renders at request
     time. Editing this file changes nothing until the renderer is run, exactly as site-url.py works.

     THE FRAME IS EXACTLY 1200x630 because that is what Open Graph and Twitter summary_large_image want, and it
     is the size the renderer's viewport is set to. Do not make the body scroll: whatever falls outside the frame
     is simply cropped by the screenshot. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,700..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* The site's own tokens, copied rather than imported: site.css carries the whole site and this needs six
     values from it. They are checked against site.css by test/suite_seo.py, so a drift is a failing test rather
     than a card that quietly stops matching the site. */
  :root{
    --ink:#0c0c0e;
    --accent:#dd6a20;
    --text-strong:#ffffff;

    /* THE LAYOUT, AS NUMBERS. Every position on the card comes from these; nothing below hard-codes a pixel.
       They were measured off the card this replaced rather than guessed, so the rebuild lands on the original
       to within a pixel on every block. */
    --pad-x:84px;          /* left margin, shared by the mark, the name, the role and the rule */

    --mark-top:80px;       /* the BOX top; favicon's 64-unit ink starts 23.8px below it */
    --mark-size:128px;     /* that viewBox at 2x, which lands the ink at x 112.7 y 103.8 */

    /* ARCHIVO IS A VARIABLE FONT AND THE CARD USES ITS WIDTH AXIS, which is the only way the two headings come
       out right. Set at the default width they are 13% too wide for their cap height, and tracking them in to fit
       closes the letters up until the words touch — the original has clear gaps between letters AND a wide word
       space at the same total width, which only a narrower cut can give. So: condense to 89%, track lightly, and
       put the word space back with word-spacing, since negative tracking eats it too. */
    --name-size:96px;
    --name-width:89%;
    --name-track:-2.75px;
    --name-word:15px;
    --name-top:272px;

    --role-size:35px;
    --role-width:89%;
    --role-track:.2px;
    --role-word:4.5px;
    --role-top:385px;

    --meta-size:22.2px;
    --meta-top:447px;

    --rule-top:555px;
    --rule-w:96px;
    --rule-h:3px;

    /* THE ARCS ARE TWO CONCENTRIC RINGS whose centre sits off the right edge, so the frame shows only the
       sweep that falls inside it. Solved from three measured points on each rather than fitted: a least-squares
       circle through a short arc is ill-conditioned and gave a different answer every time it ran, including a
       pair that were not concentric. Three points and an exact solve reproduce every landmark the original has
       -- both crossings of the top edge, both leftmost points, and the exit through the right edge at y 450.

       ONE CENTRE, TWO DIAMETERS, so moving the centre moves both and the pair cannot drift apart. */
    --arc-cx:1282px;
    --arc-cy:80px;
    --arc1-d:762px;
    --arc2-d:665px;
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background:var(--ink);
    font-family:Archivo,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    position:relative;
  }

  /* THE ARCS, and they are the reason this is HTML rather than an SVG. They are two rings whose centre sits off
     the right edge, so the card shows only the arc that falls inside the frame. Sized from one radius so the
     pair stays concentric when either is moved. */
  .arcs{position:absolute;inset:0;overflow:hidden}
  .arcs i{position:absolute;border:1px solid var(--accent);border-radius:50%;display:block}
  .arcs i:nth-child(1){
    width:var(--arc1-d);height:var(--arc1-d);
    left:calc(var(--arc-cx) - var(--arc1-d) / 2);
    top:calc(var(--arc-cy) - var(--arc1-d) / 2);
  }
  .arcs i:nth-child(2){
    width:var(--arc2-d);height:var(--arc2-d);
    left:calc(var(--arc-cx) - var(--arc2-d) / 2);
    top:calc(var(--arc-cy) - var(--arc2-d) / 2);
  }

  .plate{position:absolute;left:var(--pad-x);right:0;top:0;height:100%}

  /* 41 over 3X, THE SAME PATHS favicon.svg DRAWS. Reused rather than redrawn: the card and the favicon are one
     mark, and the last time they were separate the card lost a stroke and rendered 413-slash for months while the
     alt text underneath it said 413X. Each glyph is on a 100x100 box with its ink spanning x 10-90 and y 4-96, so
     all four share one advance and one cap height. */
  .mark{position:absolute;left:0;top:var(--mark-top);width:var(--mark-size);height:var(--mark-size)}
  .mark svg{display:block;width:100%;height:100%}

  .name{
    position:absolute;top:var(--name-top);
    font-size:var(--name-size);font-weight:900;font-stretch:var(--name-width);
    letter-spacing:var(--name-track);word-spacing:var(--name-word);line-height:1;white-space:nowrap;
    color:var(--text-strong);
  }
  .role{
    position:absolute;top:var(--role-top);
    font-size:var(--role-size);font-weight:800;font-stretch:var(--role-width);
    letter-spacing:var(--role-track);word-spacing:var(--role-word);line-height:1;white-space:nowrap;
    color:var(--accent);
  }
  .meta{
    position:absolute;top:var(--meta-top);
    font-family:'JetBrains Mono',ui-monospace,monospace;
    font-size:var(--meta-size);font-weight:400;letter-spacing:0;line-height:1.3;
    color:var(--text-strong);
    white-space:nowrap;
  }
  .rule{position:absolute;top:var(--rule-top);width:var(--rule-w);height:var(--rule-h);background:var(--accent)}
</style>
</head>
<body>

<div class="arcs" aria-hidden="true"><i></i><i></i></div>

<div class="plate">
  <div class="mark">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="var(--accent)">
      <g transform="translate(12.3 11.07) scale(.205)">
        <path d="M64 4h26v92H64zM10 62h80v26H10zM40 4h26L36 62H10z"/>
      </g>
      <g transform="translate(31.2 11.07) scale(.205)">
        <path d="M10 70h80v26H10zM37 4h26v70H37zM37 4v26L17 42V20z"/>
      </g>
      <g transform="translate(12.3 32.43) scale(.205)">
        <path d="M64 4h26v92H64zM10 4h80v26H10zM32 37h58v26H32zM10 70h80v26H10z"/>
      </g>
      <g transform="translate(31.2 32.43) scale(.205)">
        <path d="M10 4h26l54 92H64zM64 4h26L36 96H10z"/>
      </g>
    </svg>
  </div>

  <!-- THE COPY. These four lines are the whole content of the card. The career facts here must agree with the
       live site, which is the source for them -- see the note in index.html. -->
  <div class="name">ALEX KOCH</div>
  <div class="role">AGENTIC MOBILE ENGINEER</div>
  <div class="meta">14 years shipping mobile at scale &middot; Yahoo! &middot; Target &middot; Kohl's &middot; Vacasa</div>
  <div class="rule"></div>
</div>

</body>
</html>
