<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Only what cannot be inline: the scrollbar and the range-input pseudo-elements. */
  .sb-root *{box-sizing:border-box}
  .sb-root::-webkit-scrollbar{width:7px}
  .sb-root::-webkit-scrollbar-thumb{background:var(--sb-accent,#ffb454);opacity:.3;border-radius:4px}
  .sb-root input[type=range]{-webkit-appearance:none;appearance:none;height:3px;border-radius:3px;background:rgba(255,255,255,.18);outline:none}
  .sb-root input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--sb-accent,#ffb454);cursor:pointer;box-shadow:0 0 7px var(--sb-accent,#ffb454)}
  .sb-root input[type=range]::-moz-range-thumb{width:11px;height:11px;border:none;border-radius:50%;background:var(--sb-accent,#ffb454);cursor:pointer}
</style>
</helmet>

<div class="sb-root" ref="{{ rootRef }}" style="{{ panelStyle }}">
  <div style="{{ headerRow }}">
    <span style="{{ headerTitle }}">{{ title }}</span>
    <sc-if value="{{ hasBadge }}" hint-placeholder-val="{{ false }}">
      <span style="{{ badgeStyle }}">{{ badge }}</span>
    </sc-if>
  </div>

  <sc-if value="{{ hasShapes }}" hint-placeholder-val="{{ false }}">
    <div style="{{ shapeRow }}">
      <sc-for list="{{ shapes }}" as="sh" hint-placeholder-count="5">
        <button onClick="{{ sh.onClick }}" style="{{ sh.btn }}"><span style="{{ sh.shape }}"></span></button>
      </sc-for>
    </div>
  </sc-if>

  <div style="{{ pillGroup }}">
    <sc-if value="{{ hasPresets }}" hint-placeholder-val="{{ true }}">
      <div style="{{ presetRow }}">
        <sc-for list="{{ presets }}" as="p" hint-placeholder-count="3">
          <button onClick="{{ p.onClick }}" style="{{ p.style }}">{{ p.label }}</button>
        </sc-for>
        <sc-if value="{{ hasPresetSwatch }}" hint-placeholder-val="{{ false }}">
          <input type="color" value="{{ presetSwatchColor }}" onInput="{{ onPresetSwatch }}" style="{{ presetSwatchStyle }}">
        </sc-if>
      </div>
    </sc-if>

    <sc-if value="{{ hasActions }}" hint-placeholder-val="{{ true }}">
      <div style="{{ actionRow }}">
        <sc-for list="{{ actions }}" as="a" hint-placeholder-count="2">
          <button onClick="{{ a.onClick }}" style="{{ a.style }}">{{ a.label }}</button>
        </sc-for>
      </div>
    </sc-if>
  </div>

  <sc-for list="{{ sections }}" as="sec" hint-placeholder-count="3">
    <div style="{{ sec.headRow }}">
      <span>{{ sec.name }}</span>
      <sc-if value="{{ sec.hasSwatch }}" hint-placeholder-val="{{ false }}">
        <input type="color" value="{{ sec.swatchColor }}" onInput="{{ sec.onSwatch }}" style="{{ sec.swatchStyle }}">
      </sc-if>
      <sc-if value="{{ sec.hasToggle }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ sec.onToggle }}" style="{{ sec.toggleStyle }}">{{ sec.toggleLabel }}</button>
      </sc-if>
    </div>
    <sc-for list="{{ sec.leadSliders }}" as="sl" hint-placeholder-count="1">
      <div style="{{ sl.row }}" onClick="{{ sl.onSelect }}">
        <span style="{{ sl.labelStyle }}">{{ sl.label }}</span>
        <input type="range" min="{{ sl.min }}" max="{{ sl.max }}" step="{{ sl.step }}" value="{{ sl.value }}" onInput="{{ sl.onInput }}" style="{{ sliderStyle }}">
        <button onClick="{{ sl.dec }}" style="{{ stepBtn }}">&#8249;</button>
        <input type="text" value="{{ sl.disp }}" onFocus="{{ sl.onFocus }}" onInput="{{ sl.onEdit }}" onKeyDown="{{ sl.onKeyCommit }}" onBlur="{{ sl.onCommit }}" style="{{ valInputStyle }}">
        <button onClick="{{ sl.inc }}" style="{{ stepBtn }}">&#8250;</button>
      </div>
    </sc-for>
    <sc-for list="{{ sec.toggleRows }}" as="tr" hint-placeholder-count="2">
      <div style="{{ tr.row }}">
        <span style="{{ tr.labelStyle }}">{{ tr.label }}</span>
        <sc-for list="{{ tr.toggles }}" as="tg" hint-placeholder-count="1">
          <button onClick="{{ tg.onToggle }}" style="{{ tg.style }}">{{ tg.label }}</button>
        </sc-for>
      </div>
    </sc-for>
    <sc-for list="{{ sec.sliders }}" as="sl" hint-placeholder-count="4">
      <div style="{{ sl.row }}" onClick="{{ sl.onSelect }}">
        <span style="{{ sl.labelStyle }}">{{ sl.label }}</span>
        <input type="range" min="{{ sl.min }}" max="{{ sl.max }}" step="{{ sl.step }}" value="{{ sl.value }}" onInput="{{ sl.onInput }}" style="{{ sliderStyle }}">
        <button onClick="{{ sl.dec }}" style="{{ stepBtn }}">&#8249;</button>
        <input type="text" value="{{ sl.disp }}" onFocus="{{ sl.onFocus }}" onInput="{{ sl.onEdit }}" onKeyDown="{{ sl.onKeyCommit }}" onBlur="{{ sl.onCommit }}" style="{{ valInputStyle }}">
        <button onClick="{{ sl.inc }}" style="{{ stepBtn }}">&#8250;</button>
      </div>
    </sc-for>
  </sc-for>

  <sc-if value="{{ hasFooter }}" hint-placeholder-val="{{ false }}">
    <div style="{{ footStyle }}">{{ footer }}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:330,&quot;height&quot;:620},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;CONTROLS&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;badge&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;footer&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#ffb454&quot;,&quot;options&quot;:[&quot;#ffb454&quot;,&quot;#8fff6a&quot;,&quot;#7fd0ff&quot;,&quot;#ff7ba8&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;width&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:308,&quot;min&quot;:240,&quot;max&quot;:420,&quot;step&quot;:4,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;actionsFirst&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;sections&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;any[]&quot;},&quot;presets&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;any[]&quot;},&quot;actions&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;any[]&quot;},&quot;shapes&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;any[]&quot;},&quot;presetSwatch&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{color:string,onInput:(e:any)=&gt;void}&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(k:string,v:number)=&gt;void&quot;},&quot;onPreset&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(i:number)=&gt;void&quot;},&quot;onAction&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(i:number)=&gt;void&quot;},&quot;onShape&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(i:number)=&gt;void&quot;}}">
class Component extends DCLogic {
  // sel is the keyboard cursor: which slider the arrow keys act on. edit/editText hold the typed-in value while a text
  // field has focus, so the field can show what is being typed rather than the formatted value it will commit to.
  state = { sel: 0, edit: null, editText: '' };
  _root = React.createRef();

  componentDidMount() { this._key = (e) => this.onKey(e); window.addEventListener('keydown', this._key); this.publishWidth(); }
  componentDidUpdate() { this.publishWidth(); }
  componentWillUnmount() {
    window.removeEventListener('keydown', this._key);
    document.documentElement.style.setProperty('--sidebar-w', '0px');
  }
  // THE SIDEBAR PUBLISHES ITS OWN WIDTH, so a view beside it is just `right: var(--sidebar-w, 0px)` -- no measuring, no
  // ResizeObserver, no retry loop in every lab. Written EVERY update and unguarded: the bug this replaces only wrote the
  // variable when the measured width CHANGED, so when the first observation happened to match the initial value it was
  // never written at all, resolved to empty, and the content ran underneath the panel.
  // It also ANNOUNCES the width on change. A lab cannot simply read the variable once: the sidebar is loaded
  // asynchronously as a child DC, so it publishes after the host's own componentDidMount and after the first frame --
  // anything that needs the number (a readout, a canvas that must be re-measured, a filter region) has to be told.
  publishWidth() {
    const el = this._root.current;
    const w = (el && el.offsetWidth) || 0;
    document.documentElement.style.setProperty('--sidebar-w', w + 'px');
    if (w !== this._lastW) {
      this._lastW = w;
      window.dispatchEvent(new CustomEvent('sidebar-width', { detail: w }));
    }
  }

  onKey(e) {
    const flat = this._flat || [];
    if (!flat.length) return;
    const tg = e.target || {};
    if (tg.tagName === 'INPUT' && tg.type === 'text') return;   // typing a value owns its own arrow keys
    const k = e.key;
    if (k === 'ArrowUp' || k === 'ArrowDown') {
      e.preventDefault();
      this.setState((s) => ({ sel: (s.sel + (k === 'ArrowDown' ? 1 : -1) + flat.length) % flat.length }));
    } else if (k === 'ArrowLeft' || k === 'ArrowRight') {
      e.preventDefault();
      this.step(flat[this.state.sel], k === 'ArrowRight' ? 1 : -1);
    }
  }
  /* A DISCRETE LADDER ON A SLIDER. A control with `snap` does not range over its value at all -- the slider ranges over
   * INDICES into the list and the value is whatever sits at that index, so dragging walks a set of real settings rather
   * than a continuum that has to be rounded afterwards. The value stored and reported is always the listed one, never
   * the index, so a saved setting still says what it means if the list is ever edited.
   */
  snapIdx(list, v) {
    let bi = 0, bd = Infinity;
    for (let i = 0; i < list.length; i++) { const d = Math.abs(list[i] - v); if (d < bd) { bd = d; bi = i; } }
    return bi;
  }
  // keystep, not step, when it is given: a slider fine enough to drag smoothly is usually too fine to walk with a key.
  // Values are snapped to the step grid and rounded at 4 decimals, so repeated keying cannot drift off it.
  step(sl, dir) {
    if (!sl) return;
    const gi0 = (this._flat || []).indexOf(sl); if (gi0 >= 0) this.setState({ sel: gi0 });
    if (sl.snap) {
      const i = Math.min(sl.snap.length - 1, Math.max(0, this.snapIdx(sl.snap, sl.value) + dir));
      if (this.props.onChange) this.props.onChange(sl.key, sl.snap[i]);
      return;
    }
    const st = sl.keystep != null ? sl.keystep : sl.step;
    let nv = Math.round((sl.value + dir * st) / st) * st;
    nv = Math.min(sl.max, Math.max(sl.min, +nv.toFixed(4)));
    if (this.props.onChange) this.props.onChange(sl.key, nv);
  }
  commitText(sl, text) {
    let nv = sl.parse ? sl.parse(text) : parseFloat(text);
    if (isNaN(nv)) { this.setState({ edit: null }); return; }         // unparseable: keep the value, drop the edit
    // Typing into a snapped control lands on the nearest rung rather than being rejected or kept off-ladder.
    nv = sl.snap ? sl.snap[this.snapIdx(sl.snap, nv)] : Math.min(sl.max, Math.max(sl.min, +nv.toFixed(4)));
    const gi = (this._flat || []).indexOf(sl);
    this.setState({ edit: null, sel: gi >= 0 ? gi : this.state.sel });
    if (this.props.onChange) this.props.onChange(sl.key, nv);
  }

  hexA(hex, a) {
    let h = (hex || '#ffb454').replace('#', '');
    if (h.length === 3) h = h.split('').map((c) => c + c).join('');
    const n = parseInt(h, 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  renderVals() {
    const p = this.props, ac = p.accent || '#ffb454';
    // The accent's own dark counterpart, for text ON the accent. Derived rather than a second prop: one colour in, and
    // an active pill can never be set to an unreadable pair.
    const dark = 'rgba(6,8,10,.92)';
    const secs = p.sections || [];
    // One flat list of every slider, in panel order: the keyboard cursor is an index into this, so it walks sections
    // without knowing they exist.
    const flat = []; secs.forEach((s) => (s.sliders || []).forEach((sl) => flat.push(sl)));
    this._flat = flat;
    const sel = Math.min(this.state.sel, Math.max(0, flat.length - 1));

    const btnBase = 'flex:1;font-family:JetBrains Mono;font-size:10px;letter-spacing:.5px;padding:5px 4px;border-radius:8px;cursor:pointer;transition:all .15s;';
    const presets = (p.presets || []).map((pr, i) => ({
      label: pr.label,
      style: btnBase + (pr.active
        ? 'background:' + ac + ';color:' + dark + ';border:1px solid ' + ac + ';font-weight:700'
        : 'background:rgba(255,255,255,.05);color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.14)'),
      onClick: () => p.onPreset && p.onPreset(i),
    }));
    const actionStyle = 'flex:1;font-family:JetBrains Mono;font-size:11px;letter-spacing:.5px;font-weight:700;padding:6px 4px;border-radius:8px;cursor:pointer;background:' + this.hexA(ac, .12) + ';color:' + ac + ';border:1px solid ' + this.hexA(ac, .45);
    const actions = (p.actions || []).map((a, i) => ({
      label: a.label, style: actionStyle + (a.dim ? ';opacity:.45' : ''), onClick: () => p.onAction && p.onAction(i),
    }));
    const shapes = (p.shapes || []).map((sh, i) => ({
      onClick: () => p.onShape && p.onShape(i),
      btn: 'flex:1;display:flex;align-items:center;justify-content:center;height:30px;border-radius:8px;cursor:pointer;background:' + (sh.active ? this.hexA(ac, .18) : 'rgba(255,255,255,.05)') + ';border:1px solid ' + (sh.active ? ac : 'rgba(255,255,255,.14)'),
      shape: 'width:15px;height:15px;display:block;background:' + (sh.active ? ac : 'rgba(255,255,255,.5)') + ';' + (sh.shapeStyle || ''),
    }));

    const labelStyle = 'flex:0 0 78px;font-family:JetBrains Mono;font-size:9.5px;letter-spacing:.3px;color:rgba(255,255,255,.6);white-space:nowrap;overflow:visible';
    const headBase = 'font-family:JetBrains Mono;font-size:9px;letter-spacing:2px;color:' + ac + ';margin:6px 0 2px;padding-bottom:2px;border-bottom:1px solid ' + this.hexA(ac, .22);
    // One slider row, built once and used by both lists a section can render (see leadSliders below). It closes over
    // flat/sel/labelStyle exactly as it did inline; splitting the list must not mean two copies of the row.
    const mapSlider = (sl) => {
      const gi = flat.indexOf(sl);
      const v = sl.value == null ? sl.min : sl.value;
      const shown = sl.fmt ? sl.fmt(v) : (+v).toFixed(2);
      const editing = this.state.edit === sl.key;
      // A snapped control's slider is an INDEX picker: 0..n-1 by ones, positioned at the rung nearest the live value.
      const snapped = !!sl.snap;
      const si = snapped ? this.snapIdx(sl.snap, v) : 0;
      return {
        key: sl.key, label: sl.label,
        min: snapped ? 0 : sl.min, max: snapped ? sl.snap.length - 1 : sl.max, step: snapped ? 1 : sl.step,
        value: snapped ? si : v,
        // While the field has focus it shows the raw text being typed; otherwise the formatted value. Feeding it the
        // formatted string mid-edit fights the caret on every keystroke.
        disp: editing ? this.state.editText : shown,
        labelStyle: sl.color ? labelStyle + ';color:' + sl.color + ';font-weight:700' : labelStyle,
        row: 'display:flex;align-items:center;gap:5px;min-height:21px;padding:1px 6px;margin:0 -6px;border-radius:6px;cursor:pointer;transition:background .12s;' + (gi === sel ? 'background:' + this.hexA(ac, .12) : ''),
        onSelect: () => this.setState({ sel: gi }),
        onInput: (e) => { this.setState({ sel: gi }); const raw = parseFloat(e.target.value);
          p.onChange && p.onChange(sl.key, snapped ? sl.snap[Math.min(sl.snap.length - 1, Math.max(0, Math.round(raw)))] : raw); },
        // Seeded with the NUMBER, not the formatted string: you should be able to type 45 into a field reading "45°"
        // without deleting the unit first, and parse() has to invert fmt() for the units to survive the round trip.
        onFocus: (e) => { const t = e.target; this.setState({ sel: gi, edit: sl.key, editText: String(parseFloat(shown)) }); setTimeout(() => { try { t.select(); } catch (x) {} }, 0); },
        onEdit: (e) => this.setState({ editText: e.target.value }),
        onKeyCommit: (e) => { if (e.key === 'Enter') e.target.blur(); else if (e.key === 'Escape') this.setState({ edit: null }); },
        onCommit: (e) => this.commitText(sl, e.target.value),
        dec: () => this.step(sl, -1),
        inc: () => this.step(sl, 1),
      };
    };
    const sections = secs.map((s) => ({
      name: s.name,
      headRow: headBase + ';display:flex;align-items:center;justify-content:space-between;gap:8px',
      hasSwatch: !!s.swatch,
      swatchColor: s.swatch ? s.swatch.color : '#000000',
      onSwatch: s.swatch ? s.swatch.onInput : null,
      swatchStyle: 'width:26px;height:15px;padding:0;border:1px solid ' + this.hexA(ac, .5) + ';border-radius:4px;background:none;cursor:pointer',
      hasToggle: !!s.toggle,
      onToggle: s.toggle ? s.toggle.onToggle : null,
      toggleLabel: s.toggle ? (s.toggle.on ? (s.toggle.onLabel || '\u25cf SHOWN') : (s.toggle.offLabel || '\u25cb HIDDEN')) : '',
      toggleStyle: s.toggle
        ? 'white-space:nowrap;font-family:JetBrains Mono;font-size:8px;letter-spacing:1px;padding:2px 7px;border-radius:5px;cursor:pointer;background:' + (s.toggle.on ? this.hexA(ac, .15) : 'rgba(255,255,255,.05)') + ';color:' + (s.toggle.on ? ac : 'rgba(255,255,255,.5)') + ';border:1px solid ' + (s.toggle.on ? this.hexA(ac, .45) : 'rgba(255,255,255,.16)')
        : '',
      /* A ROW of its own toggle, for a section that is nothing BUT switches -- distinct from sec.toggle, which is the
       * single header-level pill (SCAN's SWEEPS, FRAME's BEZEL). A section with several independent on/off states used
       * to need one header toggle each, which meant one section header each: LAYERS existed only to hold OUTLINES, and
       * GUIDE's header held GUIDES even though GUIDE's real content is its shape sliders. Two switches, two headers, for
       * nothing that needed dividing. toggleRows lets a section be sliderless AND hold more than one switch, so LAYERS
       * and the GUIDES switch can live as two rows under one shared header instead.
       */
      toggleRows: (s.toggleRows || []).map((tr) => ({
        label: tr.label,
        row: 'display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:22px;padding:1px 0',
        labelStyle: 'flex:1;min-width:0;font-family:JetBrains Mono;font-size:9.5px;letter-spacing:.3px;color:rgba(255,255,255,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis',
        // A LIST, because one row can own more than one switch: LAYERS carries BOXES and LEGEND, which are two views of
        // the same debug pass and belong on one line rather than in two rows saying nearly the same word.
        toggles: (tr.toggles || []).map((tg) => ({
          onToggle: tg.onToggle,
          label: tg.on ? (tg.onLabel || '\u25cf SHOWN') : (tg.offLabel || '\u25cb HIDDEN'),
          style: 'flex:0 0 auto;white-space:nowrap;font-family:JetBrains Mono;font-size:8px;letter-spacing:1px;padding:2px 7px;border-radius:5px;cursor:pointer;background:' + (tg.on ? this.hexA(ac, .15) : 'rgba(255,255,255,.05)') + ';color:' + (tg.on ? ac : 'rgba(255,255,255,.5)') + ';border:1px solid ' + (tg.on ? this.hexA(ac, .45) : 'rgba(255,255,255,.16)'),
        })),
      })),
      /* LEAD SLIDERS RENDER ABOVE THE TOGGLE ROWS. A section's switches normally come first, because they usually
       * decide what the sliders below them even mean. TERMINAL inverts that for one control: BLOOM applies to whatever
       * the tube is showing, while ALIGN and GROW only exist for text -- so the mode-independent one belongs above the
       * mode-specific ones. `lead` is a COUNT off the front of the same list, not a second list, so a slider cannot end
       * up in both or in neither.
       */
      leadSliders: (s.sliders || []).slice(0, s.lead || 0).map(mapSlider),
      sliders: (s.sliders || []).slice(s.lead || 0).map(mapSlider),
    }));

    const w = p.width == null ? 308 : p.width;
    return {
      rootRef: this._root,
      title: p.title || 'CONTROLS',
      badge: p.badge || '', hasBadge: !!(p.badge && String(p.badge).length),
      badgeStyle: 'flex:0 0 auto;font-family:JetBrains Mono;font-size:9px;letter-spacing:1px;padding:3px 7px;border-radius:6px;background:' + this.hexA(ac, .12) + ';color:' + ac + ';border:1px solid ' + this.hexA(ac, .3) + ';white-space:nowrap',
      // box-sizing on the ROOT, not just its descendants: `.sb-root *` does not match .sb-root itself, so padding and
      // the border sat OUTSIDE the width and a 308px panel measured 341px. Harmless while the view measured the panel;
      // a lie now that `width` is a prop. top/bottom rather than height:100vh, so the panel resolves against the same
      // containing block the view does -- 100vh is always the viewport, which is 22px taller inside a scaled preview.
      panelStyle: 'position:fixed;top:0;bottom:0;right:0;box-sizing:border-box;width:' + w + 'px;--sb-accent:' + ac
        // NO LEFT SHADOW. A 60px shadow spilling onto the view lands exactly where a lab judges its right edge and its
        // right-hand corners, and darkening that band is the last thing a calibration instrument wants -- CRT Lab had to
        // override it with !important. The border and the backdrop blur are enough separation.
        + ';background:rgba(9,11,13,.74);border-left:1px solid rgba(255,255,255,.12);backdrop-filter:blur(12px)'
        + ';font-family:JetBrains Mono,monospace;color:#fff'
        + ';overflow-x:hidden;overflow-y:auto;padding:10px 16px 12px;z-index:40',
      headerRow: 'display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;min-height:26px',
      headerTitle: 'flex:0 1 auto;min-width:0;font-size:10px;letter-spacing:1.5px;color:' + ac + ';white-space:nowrap;overflow:hidden;text-overflow:ellipsis',
      pillGroup: 'display:flex;flex-direction:column',
      // actionsFirst swaps the two rows without moving them in the markup, so a lab whose actions matter more than its
      // presets does not need a second template.
      presetRow: 'display:flex;gap:6px;margin-bottom:6px;order:' + (p.actionsFirst ? 2 : 1),
      actionRow: 'display:flex;gap:6px;margin-bottom:6px;order:' + (p.actionsFirst ? 1 : 2),
      shapeRow: 'display:flex;gap:5px;margin-bottom:6px',
      sliderStyle: 'flex:1;min-width:0',
      stepBtn: 'flex:0 0 auto;width:16px;height:18px;line-height:1;padding:0;font-family:JetBrains Mono;font-size:12px;border-radius:4px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.14);cursor:pointer',
      /* 64px, not 50. The readout is an editable input with no wrap and no ellipsis, so anything wider than the field
       * is SILENTLY TRUNCATED -- it does not overflow, scroll or mark itself, it just shows fewer characters and looks
       * like a shorter value. At 50px three readouts in CRT Lab were cut: "8.0 /100px" (needs 60) on two rows and
       * "OUT 90.0" (needs 54), the last of which had been losing its degree sign for a while without anyone noticing.
       *
       * Sized to the widest string any lab actually produces (60) plus headroom, rather than to the longest one today.
       * The slider next to it is flex:1;min-width:0, so the extra 14px comes out of slider travel and nothing reflows.
       * If a future control needs more than this, widen it HERE -- do not shorten the unit to fit a field that is too
       * small, which just moves the truncation into the vocabulary.
       */
      valInputStyle: 'flex:0 0 64px;width:64px;text-align:right;font-family:JetBrains Mono;font-size:10px;color:' + ac + ';background:transparent;border:none;border-bottom:1px solid ' + this.hexA(ac, .28) + ';padding:1px 0;outline:none;cursor:text',
      footStyle: 'margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.1);font-size:9.5px;line-height:1.55;color:rgba(255,255,255,.4)',
      footer: p.footer || '', hasFooter: !!(p.footer && p.footer.length),
      hasShapes: shapes.length > 0, hasPresets: presets.length > 0, hasActions: actions.length > 0,
      hasPresetSwatch: !!p.presetSwatch,
      presetSwatchColor: p.presetSwatch ? p.presetSwatch.color : '#000000',
      onPresetSwatch: p.presetSwatch ? p.presetSwatch.onInput : null,
      presetSwatchStyle: 'flex:0 0 auto;width:30px;align-self:stretch;padding:0;border:1px solid ' + this.hexA(ac, .5) + ';border-radius:8px;background:none;cursor:pointer',
      shapes: shapes, presets: presets, actions: actions, sections: sections,
    };
  }
}
</script>
</body>
