<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Archivo:wght@700;800;900&display=swap" rel="stylesheet">
<link href="./lab.css" rel="stylesheet">
<style>
  /* Only the body hook: lab.css cannot select a body it does not own a class on. */
  html,body{margin:0;padding:0}
</style>
<script type="module">
  /* Value plumbing lives in a plain ES module so every lab shares one copy. Published on window because a DC logic
     class is not itself a module. Deferred, so the first render can land before it does -- see componentDidMount. */
  import * as controls from './controls.js';
  window.LAB_CONTROLS = controls;
  window.dispatchEvent(new Event('lab-controls'));
</script>
</helmet>

<div class="lab-body">
<div id="stage" class="lab-stage" style="{{ stageVars }}">
  <div class="lab-crosshair-h"></div>
  <div class="lab-crosshair-v"></div>

  <!-- The subject. Every property that moves is a CSS variable set on the stage, so the shape row and the sliders
       change one custom property instead of re-rendering this element's style string. Glow is a drop-shadow rather than
       a box-shadow: it has to follow the CLIPPED silhouette, and a box-shadow is cut off by clip-path. -->
  <div id="shape" style="position:absolute;top:50%;left:50%;width:var(--boxw,320px);height:calc(var(--boxw,320px) * var(--aspect,1));transform:translate(-50%,-50%) rotate(var(--rot,0deg));opacity:var(--boxop,1);display:var(--divdisp,block);border:var(--weight,2px) solid var(--boxcol,#ffb454);border-radius:var(--radius,0px);filter:drop-shadow(0 0 var(--glow,0px) var(--boxcol,#ffb454));transition:border-radius .18s ease-out"></div>

  <!-- The octagon is a STROKED POLYGON, not a clipped box. clip-path cuts the bordered rectangle, so the corners it
       slices off take the border with them and the cut edges carry no stroke at all -- which is why the clipped diamond
       read as a sliced square. non-scaling-stroke keeps LINE in real pixels however the viewBox is stretched. -->
  <svg id="shape_poly" viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;top:50%;left:50%;width:var(--boxw,320px);height:calc(var(--boxw,320px) * var(--aspect,1));transform:translate(-50%,-50%) rotate(var(--rot,0deg));opacity:var(--boxop,1);display:var(--svgdisp,none);overflow:visible;filter:drop-shadow(0 0 var(--glow,0px) var(--boxcol,#ffb454))">
    <polygon points="29.3,0 70.7,0 100,29.3 100,70.7 70.7,100 29.3,100 0,70.7 0,29.3" fill="none" stroke="var(--boxcol,#ffb454)" stroke-width="var(--weightn,2)" stroke-linejoin="round" vector-effect="non-scaling-stroke"></polygon>
  </svg>

  <!-- What the DEBUG section switches. Sized to the subject via the same --boxw/--aspect the shape uses, so the outline
       tracks it through every slider without measuring anything. -->
  <div style="position:absolute;top:50%;left:50%;width:var(--boxw,320px);height:calc(var(--boxw,320px) * var(--aspect,1));transform:translate(-50%,-50%);pointer-events:none;opacity:var(--dbgbox,0);outline:1px dashed #7fd0ff;outline-offset:6px"></div>
  <div style="position:absolute;top:50%;left:50%;width:var(--boxw,320px);pointer-events:none;opacity:var(--dbglabel,0);transform:translate(-50%,calc(-50% - (var(--boxw,320px) * var(--aspect,1)) / 2 - 22px));text-align:center;font-family:JetBrains Mono,monospace;font-size:9px;letter-spacing:1px;color:#7fd0ff">SUBJECT {{ shapeRead }}</div>
  <div style="position:absolute;top:50%;left:0;right:0;height:0;pointer-events:none;opacity:var(--dbgcross,0);border-top:1px dashed #ff3c3c"></div>
  <div style="position:absolute;left:50%;top:0;bottom:0;width:0;pointer-events:none;opacity:var(--dbgcross,0);border-left:1px dashed #ff3c3c"></div>

  <div class="lab-header">
    <div class="lab-header-name">LAB&nbsp;SHELL</div>
    <div class="lab-header-sub">every control type the sidebar offers</div>
  </div>
  <div class="lab-readout">
    <span>VIEW {{ viewSize }}</span>
    <span>SHAPE {{ shapeRead }}</span>
    <span>SIDEBAR {{ sidebarRead }}</span>
    <span id="lab_fps">-- FPS</span>
  </div>
</div>

<dc-import name="Sidebar" title="LAB SHELL" accent="{{ accent }}" badge="{{ badge }}" actions-first="{{ true }}"
  sections="{{ panelSections }}" presets="{{ panelPresets }}" actions="{{ panelActions }}" shapes="{{ panelShapes }}"
  preset-swatch="{{ panelSwatch }}"
  on-change="{{ onChange }}" on-preset="{{ onPreset }}" on-action="{{ onAction }}" on-shape="{{ onShape }}"
  hint-size="308px,100%"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800}}">
/* Lab Shell — the reference wiring for a lab screen, and a live catalogue of every control the sidebar offers:
 *
 *   shapes         a row of icon buttons (here: the drawn shape)   onShape(i)
 *   presets        labelled pills, one active                      onPreset(i)
 *   presetSwatch   a colour input beside the presets               its own onInput
 *   actions        verbs, not values                               onAction(i)
 *   section toggle a pill in a section header                      its own onToggle
 *   section swatch a colour input in a section header              its own onInput
 *   sliders        drag, ‹ › step, or type the value               onChange(key, value)
 *   badge          a live readout in the panel header              a string prop
 *
 * Plus every formatter in controls.js `as.*`, so you can see what each unit reads like on a real slider.
 */
class Component extends DCLogic {
  // Every value the panel can change is a plain state field, and onChange is the only way one moves. That is the whole
  // convention: the sidebar reads state and calls back, so it never owns a value and cannot disagree with the view.
  // ONE declared set of defaults, used for the initial state AND by RESET. Kept separate from the presets because they
  // are different promises: a preset is a look (four values), RESET is "put everything back". Wiring RESET to the BASE
  // preset meant it silently left rotation, hue, opacity, the shape and the colours wherever they had been dragged.
  DEFAULTS = { size: 40, rot: 0, radius: 0, weight: 1, hue: 0, glow: 18, boxop: 1,
               shape: 0, guides: true, preset: 1, boxcol: '#ffb454', guide: '#ff3c3c' };
  // accent is NOT a default: it is the lab's identity colour, code-owned, with no control and no persistence.
  state = Object.assign({ accent: '#ffb454', vw: 0, vh: 0, sbw: 0 },
    { size: 40, rot: 0, radius: 0, weight: 1, hue: 0, glow: 18, boxop: 1,
      shape: 0, guides: true, preset: 1, boxcol: '#ffb454', guide: '#ff3c3c',
      // The DEBUG example's state. Off by default: a debug view that greets you is a debug view you will turn off.
      debugOn: false, dbgOutline: true, dbgLabel: true, dbgCross: false });
  STORE = 'labshell.v2';        // v2: the control set changed meaning when the grid went away
  SHAPES = ['SQUARE', 'CIRCLE', 'OCTAGON', 'BAR'];

  // The control table. One entry per control, keyed by the state field it drives -- table() stamps the key so a name
  // cannot disagree with its field, and the `as.*` units keep fmt and parse inverses of each other: type 45 into a
  // field reading 45° and it commits 45, not NaN.
  meta() {
    const C = window.LAB_CONTROLS; if (!C) return null;
    if (this._meta) return this._meta;
    const ctl = C.ctl, as = C.as;
    return (this._meta = C.table({
      size:   ctl('SIZE', 5, 95, 0.5, as.pct100()),
      rot:    ctl('ROTATE', -180, 180, 1, as.deg()),
      radius: ctl('CORNER', 0, 50, 1, as.ends(as.pct100(), 'SQUARE', 'ROUND', 50)),
      weight: ctl('LINE', 0.5, 6, 0.5, as.mult(1)),
      hue:    ctl('HUE SHIFT', -180, 180, 1, as.deg()),
      glow:   ctl('GLOW', 0, 80, 1, as.off(as.px())),
      boxop:  ctl('OPACITY', 0, 1, 0.01, as.pct()),
    }));
  }
  // The panel layout: sections in order, naming control keys. A section may also carry a toggle and a colour swatch;
  // neither is a value, so neither goes through onChange -- they are wired straight to state.
  //
  // CORNER is DROPPED for the shapes it cannot touch. A circle and a diamond have no corner radius to set, and a
  // slider that visibly does nothing is worse than one that is absent: the spec is rebuilt per render, so a control
  // can come and go with the state it depends on.
  spec() {
    const s = this.state;
    const geo = ['size', 'rot'];
    if (s.shape === 0 || s.shape === 3) geo.push('radius');
    geo.push('weight');
    return [
      { name: 'GEOMETRY', keys: geo,
        // A header carrying BOTH a swatch and a toggle, for the same subject: the guide lines, and their colour.
        swatch: { color: s.guide, onInput: (e) => this.setState({ guide: e.target.value }) },
        toggle: { on: s.guides, onToggle: () => this.setState((x) => ({ guides: !x.guides })), onLabel: '\u25cf GUIDES', offLabel: '\u25cb GUIDES' } },
      { name: 'LOOK', keys: ['hue', 'glow', 'boxop'],
        colors: { boxop: s.boxcol } },      // one tinted label, for a control that should stand out from its neighbours
      /* A SLIDERLESS SECTION OF SWITCHES, and a master that collapses it. Three things are being demonstrated:
       *
       *   toggleRows   several switches as ROWS under one header, instead of one header each. A debug pass usually has
       *                a handful of independent views, and giving each its own section header divides nothing.
       *   two per row  a row can carry more than one pill (here OUTLINES and LABELS, two views of the same pass).
       *   collapsing   returning an empty toggleRows folds the section away while leaving its header and master pill
       *                visible. No Sidebar support is needed for that -- an empty list renders nothing.
       *
       * The master GATES the children rather than overwriting them, so they come back as they were left. That is the
       * part worth copying: a master switch that resets its children is worse than no master at all.
       */
      { name: 'DEBUG', keys: [],
        toggle: { on: s.debugOn, onToggle: () => this.setState((x) => ({ debugOn: !x.debugOn })),
                  onLabel: '\u25cf ON', offLabel: '\u25cb OFF' },
        toggleRows: !s.debugOn ? [] : [
          { label: 'BOX', toggles: [
            { on: s.dbgOutline, onToggle: () => this.setState((x) => ({ dbgOutline: !x.dbgOutline })),
              onLabel: '\u25cf OUTLINES', offLabel: '\u25cb OUTLINES' },
            { on: s.dbgLabel, onToggle: () => this.setState((x) => ({ dbgLabel: !x.dbgLabel })),
              onLabel: '\u25cf LABELS', offLabel: '\u25cb LABELS' },
          ] },
          { label: 'CENTRE MARK', toggles: [
            { on: s.dbgCross, onToggle: () => this.setState((x) => ({ dbgCross: !x.dbgCross })),
              onLabel: '\u25cf SHOWN', offLabel: '\u25cb HIDDEN' },
          ] },
        ] },
    ];
  }

  PRESETS = [
    { label: 'TIGHT', vals: { size: 24, glow: 6, radius: 0, weight: 0.5 } },
    { label: 'BASE', vals: { size: 40, glow: 18, radius: 0, weight: 1 } },
    { label: 'WIDE', vals: { size: 78, glow: 42, radius: 50, weight: 3 } },
  ];

  onChange = (k, v) => this.setState({ [k]: v, preset: -1 });
  onPreset = (i) => this.setState(Object.assign({ preset: i }, this.PRESETS[i].vals));
  onShape = (i) => this.setState({ shape: i });
  onAction = (i) => {
    // RESET restores every declared default, not a preset's handful.
    if (i === 0) this.setState(Object.assign({}, this.DEFAULTS));
    else this.setState({ rot: Math.round(Math.random() * 360 - 180), hue: Math.round(Math.random() * 360 - 180),
      size: 10 + Math.round(Math.random() * 80), shape: Math.floor(Math.random() * 4), preset: -1 });
  };

  componentDidMount() {
    // Module scripts are deferred, so the first render can land before controls.js does: meta() returns null, the panel
    // renders its header alone, and this rebuilds once the module arrives.
    if (!window.LAB_CONTROLS) window.addEventListener('lab-controls', () => this.restore(), { once: true });
    else this.restore();
    // The sidebar announces its width when it lands. It is a child DC, so it is FETCHED: it mounts after this method and
    // after the first frame, and anything reading --sidebar-w before then gets nothing.
    this._onSidebar = () => this.measure();
    window.addEventListener('sidebar-width', this._onSidebar);
    this._onResize = () => this.measure();
    window.addEventListener('resize', this._onResize);
    // THE VIEW IS OBSERVED, NOT READ DURING RENDER. #stage is position:fixed with right:var(--sidebar-w), so at first
    // render it measures its UNPADDED width (924 here) at a height that has not resolved yet (55) -- and nothing would
    // ever re-render to correct it, so the subject stayed a 25px speck until the user happened to touch a control. Same
    // trap as CRT Lab's "the rAF can land before --panelw applies and you build a 924-wide map for a 616-wide element",
    // down to the same 924. A ResizeObserver fires when layout actually settles, which is the only honest trigger.
    this.measure();
    if (!window.ResizeObserver) requestAnimationFrame(() => this.measure());
    // Paused while the tab is hidden: a background rAF loop is a battery drain that measures nothing.
    this._vis = () => { if (document.hidden) { cancelAnimationFrame(this._raf); this._raf = 0; } else if (!this._raf) this.tick(); };
    document.addEventListener('visibilitychange', this._vis);
    this.tick();
  }
  // FPS IS WRITTEN STRAIGHT TO THE DOM, never through state: a value that changes every frame must not re-render the
  // panel and its sliders sixty times a second. Averaged over 500ms, which is the slowest the eye reads a number.
  tick = (now) => {
    now = now || performance.now();
    this._fc = (this._fc || 0) + 1;
    if (!this._ft) this._ft = now;
    if (now - this._ft >= 500) {
      const el = document.getElementById('lab_fps');
      if (el) el.textContent = Math.round(this._fc * 1000 / (now - this._ft)) + ' FPS';
      this._fc = 0; this._ft = now;
    }
    this._raf = requestAnimationFrame(this.tick);
  };
  // The keys this lab persists — the ones a control can actually change. ONE list, used by both save and restore.
  //
  // ACCENT IS NOT HERE. It is the lab's identity colour, declared in code with no control on the panel, so it must not
  // come back off disk: an old blob that still carries it would override the declared value forever, and no amount of
  // clicking could correct it. That is the trap a range clamp cannot catch — a stored key whose OWNERSHIP changed.
  persistKeys() {
    const m = this.meta();
    return (m ? Object.keys(m) : []).concat(['shape', 'guides', 'preset', 'boxcol', 'guide',
      'debugOn', 'dbgOutline', 'dbgLabel', 'dbgCross']);
  }
  componentDidUpdate() {
    const C = window.LAB_CONTROLS;
    if (C && this.meta()) C.save(this.STORE, this.state, this.persistKeys());
    // MEASURED HERE TOO, not only from the observer. The runtime re-creates the host template when the fetched child DC
    // resolves -- which is the same moment the stage goes 924 -> 616 -- so an observer bound at mount is left watching an
    // orphaned node and the one callback that mattered is delivered to nothing. This runs after every commit and
    // re-binds; the "only setState when the measured pair changes" guard in measure() is what makes it terminate.
    this.measure();
  }
  // Measured OUTSIDE render, and stored only when the numbers actually change -- an unconditional setState here would
  // loop through componentDidUpdate forever.
  measure() {
    const el = document.getElementById('stage'); if (!el) return;
    // Re-observe whenever the live node is not the one being watched: see componentDidUpdate.
    if (window.ResizeObserver && this._roNode !== el) {
      if (this._ro) this._ro.disconnect();
      this._ro = new ResizeObserver(() => this.measure());
      this._ro.observe(el);
      this._roNode = el;
    }
    const w = el.offsetWidth, h = el.offsetHeight;
    const sbw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-w')) || 0;
    if (w !== this.state.vw || h !== this.state.vh || sbw !== this.state.sbw) this.setState({ vw: w, vh: h, sbw: sbw });
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this._onResize);
    window.removeEventListener('sidebar-width', this._onSidebar);
    document.removeEventListener('visibilitychange', this._vis);
    if (this._ro) this._ro.disconnect();
    cancelAnimationFrame(this._raf);
  }
  restore() {
    const C = window.LAB_CONTROLS, m = this.meta(); if (!C || !m) return;
    const sv = C.load(this.STORE);
    // Only the keys this lab persists are taken back, and each is clamped into its control's CURRENT range: narrowing a
    // range otherwise leaves a value the slider cannot represent, and the thumb pins at max while the readout still
    // shows the old number. Anything else in the blob is a leftover from a previous version and is ignored.
    if (sv) {
      const keep = {};
      this.persistKeys().forEach((k) => { if (sv[k] !== undefined) keep[k] = sv[k]; });
      Object.assign(this.state, C.clamp(m, keep));
    }
    this.forceUpdate();
  }

  renderVals() {
    const s = this.state, C = window.LAB_CONTROLS, m = this.meta();
    // NO LAYOUT READS HERE. The measured view comes from state, written by measure() when the ResizeObserver says the
    // box changed; reading the DOM during render captures whatever half-resolved geometry that pass happens to see.
    const w = s.vw, h = s.vh;
    // Sized against the SHORTER edge, so the subject stays inside the view at any aspect.
    const box = Math.round(Math.min(w, h) * s.size / 100);
    // Each shape is a few variables, not a few elements. The OCTAGON is the exception and is drawn as a stroked SVG
    // polygon below: clip-path cuts the bordered box, so the corners it slices off take the border with them and the cut
    // edges have no stroke at all -- which is exactly why the clipped diamond read as a sliced square.
    const OCT = 'polygon(29.3% 0%,70.7% 0%,100% 29.3%,100% 70.7%,70.7% 100%,29.3% 100%,0% 70.7%,0% 29.3%)';
    const shape = [
      { radius: (s.radius / 100 * box).toFixed(1) + 'px', aspect: 1, svg: 0 },
      { radius: '50%', aspect: 1, svg: 0 },
      { radius: '0px', aspect: 1, svg: 1 },
      { radius: (s.radius / 100 * box * 0.28).toFixed(1) + 'px', aspect: 0.28, svg: 0 },
    ][s.shape] || {};
    // Icons for the shapes row. These ARE filled 15px swatches, so clipping one is honest -- there is no stroke to lose.
    const icons = ['', 'border-radius:50%', 'clip-path:' + OCT, 'height:4px'];
    return {
      accent: s.accent,
      // ONE style hole for the whole var block, on the stage only. Its children reference var(--boxw) etc. from static
      // inline styles and lab.css classes, so they paint immediately instead of waiting for a value per property.
      stageVars: '--boxw:' + box + 'px;--aspect:' + shape.aspect + ';--radius:' + shape.radius
        + ';--divdisp:' + (shape.svg ? 'none' : 'block') + ';--svgdisp:' + (shape.svg ? 'block' : 'none')
        + ';--rot:' + s.rot + 'deg;--glow:' + s.glow + 'px;--boxop:' + s.boxop + ';--weight:' + (2 * s.weight).toFixed(1) + 'px'
        + ';--weightn:' + (2 * s.weight).toFixed(1)
        + ';--accent:' + s.accent + ';--boxcol:' + s.boxcol + ';--guide:' + s.guide + ';--guideop:' + (s.guides ? 1 : 0)
        // The DEBUG example's three views, each gated by the master. Wired to something you can SEE on purpose: the
        // section exists to be copied, and a demonstration of a control that draws nothing teaches the wrong lesson --
        // this file's own note on dropping CORNER for shapes it cannot touch makes the same point.
        + ';--dbgbox:' + (s.debugOn && s.dbgOutline ? 1 : 0)
        + ';--dbglabel:' + (s.debugOn && s.dbgLabel ? 1 : 0)
        + ';--dbgcross:' + (s.debugOn && s.dbgCross ? 1 : 0)
        // NONE, not hue-rotate(0deg), when the control is at rest. A filter forces a compositing layer and a containing
        // block for as long as it is set -- and an always-on transform did exactly that in CRT Lab, where the promoted
        // subtree only ever rastered one 512px tile and the outer edge of the picture simply had no texture.
        + ';filter:' + (s.hue ? 'hue-rotate(' + s.hue + 'deg)' : 'none'),
      viewSize: w && h ? w + '\u00d7' + h : '\u2014',
      shapeRead: this.SHAPES[s.shape],
      sidebarRead: s.sbw ? s.sbw + 'px' : '\u2014',
      badge: box ? box + 'px' : '',
      panelSections: (C && m) ? C.sections(this.spec(), m, s) : [],
      panelShapes: this.SHAPES.map((n, i) => ({ active: s.shape === i, shapeStyle: icons[i] })),
      panelPresets: this.PRESETS.map((p, i) => ({ label: p.label, active: s.preset === i })),
      panelActions: [{ label: '\u21ba RESET' }, { label: '\u2726 RANDOM' }],
      // The top swatch colours the thing being DRAWN; the GEOMETRY header's swatch colours the guide lines. Neither
      // touches --accent, the lab's own identity colour, so picking a subject colour cannot repaint the panel around it.
      panelSwatch: { color: s.boxcol, onInput: (e) => this.setState({ boxcol: e.target.value }) },
      onChange: this.onChange, onPreset: this.onPreset, onAction: this.onAction, onShape: this.onShape,
    };
  }
}
</script>
</body>
</html>
