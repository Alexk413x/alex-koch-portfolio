<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  .cp-root *{box-sizing:border-box}
  .cp-root::-webkit-scrollbar{width:7px}
  .cp-root::-webkit-scrollbar-thumb{background:var(--cp-accent,#8fff6a);opacity:.3;border-radius:4px}
  .cp-root input[type=range]{-webkit-appearance:none;appearance:none;height:3px;border-radius:3px;background:rgba(255,255,255,.18);outline:none}
  .cp-root input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--cp-accent,#8fff6a);cursor:pointer;box-shadow:0 0 7px var(--cp-accent,#8fff6a)}
  .cp-root input[type=range]::-moz-range-thumb{width:11px;height:11px;border:none;border-radius:50%;background:var(--cp-accent,#8fff6a);cursor:pointer}
</style>
</helmet>

<div class="cp-root" style="{{ panelStyle }}">
  <div style="{{ headerRow }}">
    <span style="{{ headerTitle }}">{{ title }}</span>
    <div style="{{ headerActionsWrap }}">
      <sc-if value="{{ collapsedActions }}" hint-placeholder-val="{{ true }}">
        <sc-for list="{{ barActions }}" as="a" hint-placeholder-count="2">
          <button onClick="{{ a.onClick }}" style="{{ a.style }}">{{ a.icon }}</button>
        </sc-for>
      </sc-if>
      <button onClick="{{ bareToggle }}" style="{{ toggleBtn }}">{{ bareIcon }}</button>
    </div>
  </div>

  <sc-if value="{{ expanded }}" hint-placeholder-val="{{ true }}">
    <sc-if value="{{ hasShapes }}" hint-placeholder-val="{{ true }}">
      <div style="{{ shapeRow }}">
        <sc-for list="{{ shapes }}" as="sh" hint-placeholder-count="5">
          <button onClick="{{ sh.onClick }}" style="{{ sh.btn }}"><span style="{{ sh.shape }}"></span></button>
        </sc-for>
      </div>
    </sc-if>

    <div style="{{ pillGroup }}">
    <sc-if value="{{ hasPresets }}" hint-placeholder-val="{{ true }}">
      <div style="{{ btnRow }}">
        <sc-for list="{{ presets }}" as="p" hint-placeholder-count="3">
          <button onClick="{{ p.onClick }}" style="{{ p.style }}">{{ p.label }}</button>
        </sc-for>
        <sc-if value="{{ hasPresetSwatch }}" hint-placeholder-val="{{ false }}">
          <input type="color" value="{{ presetSwatchColor }}" onInput="{{ onPresetSwatch }}" style="{{ presetSwatchStyle }}">
        </sc-if>
      </div>
    </sc-if>

    <sc-if value="{{ hasActions }}" hint-placeholder-val="{{ true }}">
      <div style="{{ btnRowMb }}">
        <sc-for list="{{ actions }}" as="a" hint-placeholder-count="2">
          <button onClick="{{ a.onClick }}" style="{{ a.style }}">{{ a.label }}</button>
        </sc-for>
      </div>
    </sc-if>
    </div>

    <sc-for list="{{ sections }}" as="sec" hint-placeholder-count="3">
      <div style="{{ sec.headRow }}">
        <span>{{ sec.name }}</span>
        <sc-if value="{{ sec.hasSwatch }}" hint-placeholder-val="{{ false }}">
          <input type="color" value="{{ sec.swatchColor }}" onInput="{{ sec.onSwatch }}" style="{{ sec.swatchStyle }}">
        </sc-if>
        <sc-if value="{{ sec.hasToggle }}" hint-placeholder-val="{{ false }}">
          <button onClick="{{ sec.onToggle }}" style="{{ sec.toggleStyle }}">{{ sec.toggleLabel }}</button>
        </sc-if>
      </div>
      <sc-for list="{{ sec.sliders }}" as="sl" hint-placeholder-count="4">
        <div style="{{ sl.row }}" onClick="{{ sl.onSelect }}">
          <span style="{{ sl.labelStyle }}">{{ sl.label }}</span>
          <sc-if value="{{ showControls }}" hint-placeholder-val="{{ true }}">
            <input type="range" min="{{ sl.min }}" max="{{ sl.max }}" step="{{ sl.step }}" value="{{ sl.value }}" onInput="{{ sl.onInput }}" style="{{ sliderStyle }}">
            <button onClick="{{ sl.dec }}" style="{{ stepBtn }}">‹</button>
          </sc-if>
          <input type="text" value="{{ sl.disp }}" onFocus="{{ sl.onFocus }}" onInput="{{ sl.onEdit }}" onKeyDown="{{ sl.onKeyCommit }}" onBlur="{{ sl.onCommit }}" style="{{ valInputStyle }}">
          <sc-if value="{{ showControls }}" hint-placeholder-val="{{ true }}">
            <button onClick="{{ sl.inc }}" style="{{ stepBtn }}">›</button>
          </sc-if>
        </div>
      </sc-for>
    </sc-for>

    <sc-if value="{{ hasFooter }}" hint-placeholder-val="{{ true }}"><div style="{{ footStyle }}">{{ footer }}</div></sc-if>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:330,&quot;height&quot;:600},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;PRESET&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;footer&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#8fff6a&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sections&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;any[]&quot;},&quot;presets&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;any[]&quot;},&quot;actions&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;any[]&quot;},&quot;shapes&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;any[]&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(k:string,v:number)=&gt;void&quot;},&quot;onPreset&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(i:number)=&gt;void&quot;},&quot;onAction&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(i:number)=&gt;void&quot;},&quot;onShape&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(i:number)=&gt;void&quot;}}">
class Component extends DCLogic {
  state = { sel: 0, collapsed: false, bare: false, edit: null, editText: '' };

  commitText(sl, text) {
    let nv = sl.parse ? sl.parse(text) : parseFloat(text);
    if (isNaN(nv)) { this.setState({ edit: null }); return; }
    nv = Math.min(sl.max, Math.max(sl.min, +nv.toFixed(4)));
    const gi = (this._flat || []).indexOf(sl);
    this.setState({ edit: null, sel: gi >= 0 ? gi : this.state.sel });
    if (this.props.onChange) this.props.onChange(sl.key, nv);
  }
  componentDidMount() { this._key = (e) => this.onKey(e); window.addEventListener('keydown', this._key); }
  componentWillUnmount() { window.removeEventListener('keydown', this._key); }

  onKey(e) {
    const flat = this._flat || [];
    if (!flat.length) return;
    const tg = e.target || {};
    if (tg.tagName === 'INPUT' && tg.type === 'text') return;
    const k = e.key;
    if (k === 'ArrowUp' || k === 'ArrowDown') {
      e.preventDefault();
      this.setState((s) => ({ sel: (s.sel + (k === 'ArrowDown' ? 1 : -1) + flat.length) % flat.length }));
    } else if (k === 'ArrowLeft' || k === 'ArrowRight') {
      e.preventDefault();
      this.step(flat[this.state.sel], k === 'ArrowRight' ? 1 : -1);
    }
  }
  step(sl, dir) {
    if (!sl) return;
    const st = sl.keystep != null ? sl.keystep : sl.step;
    let nv = Math.round((sl.value + dir * st) / st) * st;
    nv = Math.min(sl.max, Math.max(sl.min, +nv.toFixed(4)));
    const gi = (this._flat || []).indexOf(sl); if (gi >= 0) this.setState({ sel: gi });
    if (this.props.onChange) this.props.onChange(sl.key, nv);
  }

  hexA(hex, a) {
    let h = (hex || '#8fff6a').replace('#', '');
    if (h.length === 3) h = h.split('').map((c) => c + c).join('');
    const n = parseInt(h, 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  }

  renderVals() {
    const p = this.props, ac = p.accent || '#8fff6a', dark = '#0a1a06';
    const expanded = !this.state.collapsed;
    const secs = p.sections || [];
    const flat = []; secs.forEach((s) => (s.sliders || []).forEach((sl) => flat.push(sl)));
    this._flat = flat;
    const sel = Math.min(this.state.sel, Math.max(0, flat.length - 1));

    const btnBase = 'flex:1;font-family:JetBrains Mono;font-size:10px;letter-spacing:.5px;padding:5px 4px;border-radius:8px;cursor:pointer;transition:all .15s;';
    const presetStyle = (on) => btnBase + (on
      ? `background:${ac};color:${dark};border:1px solid ${ac};font-weight:700`
      : 'background:rgba(255,255,255,.05);color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.14)');
    const actionStyle = `flex:1;font-family:JetBrains Mono;font-size:11px;letter-spacing:.5px;font-weight:700;padding:6px 4px;border-radius:8px;cursor:pointer;background:${this.hexA(ac, .12)};color:${ac};border:1px solid ${this.hexA(ac, .45)}`;
    const presets = (p.presets || []).map((pr, i) => ({ label: pr.label, style: presetStyle(!!pr.active), onClick: () => p.onPreset && p.onPreset(i) }));
    const actions = (p.actions || []).map((a, i) => ({ label: this.state.bare ? (a.label || '').split(' ')[0] : a.label, style: actionStyle + (a.dim ? ';opacity:.45' : ''), onClick: () => p.onAction && p.onAction(i) }));
    const barActions = (!expanded ? (p.actions || []).map((a, i) => ({ icon: (a.label || '').split(' ')[0], onClick: () => p.onAction && p.onAction(i), style: `width:30px;height:26px;font-size:13px;border-radius:7px;cursor:pointer;background:${this.hexA(ac, .12)};color:${ac};border:1px solid ${this.hexA(ac, .45)}` })) : []);

    const shapes = (p.shapes || []).map((sh, i) => ({
      onClick: () => p.onShape && p.onShape(i),
      btn: `flex:1;display:flex;align-items:center;justify-content:center;height:30px;border-radius:8px;cursor:pointer;background:${sh.active ? this.hexA(ac, .18) : 'rgba(255,255,255,.05)'};border:1px solid ${sh.active ? ac : 'rgba(255,255,255,.14)'}`,
      shape: `width:15px;height:15px;display:block;background:${sh.active ? ac : 'rgba(255,255,255,.5)'};${sh.shapeStyle}`,
    }));

    const showControls = !this.state.bare;
    const labelStyle = showControls
      ? 'flex:0 0 78px;font-family:JetBrains Mono;font-size:9.5px;letter-spacing:.3px;color:rgba(255,255,255,.6);white-space:nowrap;overflow:visible'
      : 'flex:1;min-width:0;font-family:JetBrains Mono;font-size:9.5px;letter-spacing:.3px;color:rgba(255,255,255,.6);white-space:nowrap;overflow:visible';
    const headBase = `font-family:JetBrains Mono;font-size:9px;letter-spacing:2px;color:${ac};margin:6px 0 2px;padding-bottom:2px;border-bottom:1px solid ${this.hexA(ac, .22)}`;
    const sections = secs.map((s) => ({
      name: s.name,
      head: headBase,
      headRow: headBase + ';display:flex;align-items:center;justify-content:space-between;gap:8px',
      hasToggle: !!s.toggle,
      hasSwatch: !!s.swatch,
      swatchColor: s.swatch ? s.swatch.color : '#000000',
      onSwatch: s.swatch ? s.swatch.onInput : null,
      swatchStyle: `width:26px;height:15px;padding:0;border:1px solid ${this.hexA(ac, .5)};border-radius:4px;background:none;cursor:pointer`,
      onToggle: s.toggle ? s.toggle.onToggle : null,
      toggleLabel: s.toggle ? (s.toggle.on ? (s.toggle.onLabel || '● SHOWN') : (s.toggle.offLabel || '○ HIDDEN')) : '',
      toggleStyle: s.toggle
        ? `font-family:JetBrains Mono;font-size:8px;letter-spacing:1px;padding:2px 7px;border-radius:5px;cursor:pointer;background:${s.toggle.on ? this.hexA(ac, .15) : 'rgba(255,255,255,.05)'};color:${s.toggle.on ? ac : 'rgba(255,255,255,.5)'};border:1px solid ${s.toggle.on ? this.hexA(ac, .45) : 'rgba(255,255,255,.16)'}`
        : '',
      sliders: (s.sliders || []).map((sl) => {
        const gi = flat.indexOf(sl);
        const v = sl.value == null ? sl.min : sl.value;
        const fmtVal = sl.fmt ? sl.fmt(v) : (+v).toFixed(2);
        const editing = this.state.edit === sl.key;
        return {
          key: sl.key, label: sl.label, min: sl.min, max: sl.max, step: sl.step, value: v,
          val: fmtVal,
          disp: editing ? this.state.editText : fmtVal,
          labelStyle: sl.color ? labelStyle + ';color:' + sl.color + ';font-weight:700' : labelStyle,
          row: 'display:flex;align-items:center;gap:5px;min-height:21px;padding:1px 6px;margin:0 -6px;border-radius:6px;cursor:pointer;transition:background .12s;' + (showControls ? '' : 'justify-content:space-between;') + (gi === sel ? `background:${this.hexA(ac, .12)}` : ''),
          onSelect: () => this.setState({ sel: gi }),
          onInput: (e) => { this.setState({ sel: gi }); p.onChange && p.onChange(sl.key, parseFloat(e.target.value)); },
          onFocus: (e) => { const t = e.target; this.setState({ sel: gi, edit: sl.key, editText: String(parseFloat(fmtVal)) }); setTimeout(() => { try { t.select(); } catch (x) {} }, 0); },
          onEdit: (e) => this.setState({ editText: e.target.value }),
          onKeyCommit: (e) => { if (e.key === 'Enter') e.target.blur(); else if (e.key === 'Escape') this.setState({ edit: null }); },
          onCommit: (e) => this.commitText(sl, e.target.value),
          dec: () => this.step(sl, -1),
          inc: () => this.step(sl, 1),
        };
      }),
    }));

    const baseWrap = 'position:fixed;top:0;right:0;height:100vh;background:rgba(9,13,9,.74);border-left:1px solid rgba(255,255,255,.12);backdrop-filter:blur(12px);box-shadow:-24px 0 60px -20px rgba(0,0,0,.85);font-family:JetBrains Mono,monospace;color:#fff;transition:width .28s cubic-bezier(.4,0,.2,1)';
    return {
      expanded: true, collapsed: false, showControls,
      bareToggle: () => this.setState((s) => ({ bare: !s.bare })),
      bareIcon: this.state.bare ? '⊞ MAX' : '⊟ SLIM',
      selLabel: (flat[sel] && flat[sel].label) || '—',
      selVal: flat[sel] ? (flat[sel].fmt ? flat[sel].fmt(flat[sel].value == null ? flat[sel].min : flat[sel].value) : (+flat[sel].value).toFixed(2)) : '',
      selPrev: () => this.setState((s) => ({ sel: (s.sel - 1 + flat.length) % flat.length })),
      selNext: () => this.setState((s) => ({ sel: (s.sel + 1) % flat.length })),
      selDec: () => this.step(flat[sel], -1),
      selInc: () => this.step(flat[sel], 1),
      miniRow: 'display:flex;align-items:center;gap:6px;margin-top:8px',
      miniNavWrap: 'display:flex;flex-direction:column;gap:1px',
      miniNav: `width:16px;height:11px;line-height:1;padding:0;font-size:8px;border-radius:3px;background:rgba(255,255,255,.06);color:${this.hexA(ac,.85)};border:1px solid rgba(255,255,255,.14);cursor:pointer`,
      miniLabel: 'flex:1;min-width:70px;font-family:JetBrains Mono;font-size:10px;letter-spacing:.5px;color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis',
      miniVal: `flex:0 0 auto;min-width:48px;text-align:right;font-family:JetBrains Mono;font-size:10px;color:${ac};white-space:nowrap`,
      panelStyle: baseWrap + ';--cp-accent:' + ac + ';width:' + (showControls ? '308px' : '224px') + ';overflow-x:hidden;overflow-y:auto;padding:10px 16px 12px',
      headerRow: 'display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px',
      headerActionsWrap: 'display:flex;align-items:center;gap:6px;flex:0 0 auto',
      collapsedActions: !expanded && (p.actions || []).length > 0,
      barActions,
      headerTitle: `flex:0 1 auto;min-width:0;font-size:10px;letter-spacing:1.5px;color:${ac};white-space:nowrap;overflow:hidden;text-overflow:ellipsis`,
      toggle: () => this.setState((s) => ({ collapsed: !s.collapsed })),
      toggleIcon: expanded ? '– HIDE' : '☰ MENU',
      toggleBtn: `font-family:JetBrains Mono;font-size:9px;letter-spacing:1px;padding:4px 0;width:64px;text-align:center;border-radius:6px;cursor:pointer;background:${this.hexA(ac, .12)};color:${ac};border:1px solid ${this.hexA(ac, .4)};white-space:nowrap`,
      pillGroup: 'display:flex;flex-direction:column',
      btnRow: 'display:flex;gap:6px;margin-bottom:6px' + (p.actionsFirst ? ';order:2' : ';order:1'),
      btnRowMb: 'display:flex;gap:6px;margin-bottom:6px' + (p.actionsFirst ? ';order:1' : ';order:2'),
      shapeRow: 'display:flex;gap:5px;margin-bottom:6px',
      sliderStyle: 'flex:1;min-width:0',
      stepBtn: 'flex:0 0 auto;width:16px;height:18px;line-height:1;padding:0;font-family:JetBrains Mono;font-size:12px;border-radius:4px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.14);cursor:pointer',
      valStyle: `flex:0 0 50px;text-align:right;font-family:JetBrains Mono;font-size:10px;color:${ac};white-space:nowrap;overflow:hidden`,
      valInputStyle: `flex:0 0 50px;width:50px;text-align:right;font-family:JetBrains Mono;font-size:10px;color:${ac};background:transparent;border:none;border-bottom:1px solid ${this.hexA(ac, .28)};padding:1px 0;outline:none;cursor:text`,
      footStyle: 'margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.1);font-size:9.5px;line-height:1.55;color:rgba(255,255,255,.4)',
      title: p.title || 'PRESET', footer: p.footer || '',
      hasShapes: shapes.length > 0, hasPresets: presets.length > 0, hasActions: actions.length > 0, hasFooter: !!(p.footer && p.footer.length),
      hasPresetSwatch: !!p.presetSwatch,
      presetSwatchColor: p.presetSwatch ? p.presetSwatch.color : '#000000',
      onPresetSwatch: p.presetSwatch ? p.presetSwatch.onInput : null,
      presetSwatchStyle: `flex:0 0 auto;width:30px;align-self:stretch;padding:0;border:1px solid ${this.hexA(ac, .5)};border-radius:8px;background:none;cursor:pointer`,
      shapes, presets, actions, sections,
    };
  }
}
</script>
</body>
</html>
